# Copy-ready drop-in fragment for ~/.agents/teams/forge/.
# Each role bases on the bare agent kind and carries its own model, effort, args,
# and prompt file, so the fragment installs without any other configuration.
# See examples/teams/README.md for install and launch commands.

[agents.teams.forge]
# Seed new work with the planner; the roles hand it through the pipeline from there.
leader = "planner"
layout = "planner,coder+reviewer"
stages = ["Explore", "Plan", "Implement", "Review", "Submit", "Reflect"]
scratch-files = ["/blackboard.md", "/*-notes.md"]

# Tune the planner's model, effort, or tools here.
[[agents.teams.forge.roles]]
role = "planner"
profile = "claude"
mode = "auto"
model = "fable"
effort = "high"
auto-compact = "320k"
args = "--strict-mcp-config --tools 'Bash,Read,Edit,Write,AskUserQuestion,LSP,Skill'"
system-prompt-file = "planner.md"

# Tune the coder's model, effort, or Codex feature flags here.
[[agents.teams.forge.roles]]
role = "coder"
profile = "codex"
signals = [
  { signal = "ci.failed" },
]
model = "gpt-6-astra"
effort = "high"
auto-compact = "320k"
args = "--strict-config -c 'web_search=\"disabled\"' -c 'agents.enabled=false' -c 'features.goals=false' -c 'features.multi_agent=false' -c 'features.multi_agent_v2=false' -c 'features.shell_snapshot=true' -c 'features.shell_tool=true' -c 'features.skill_mcp_dependency_install=false' -c 'features.tool_call_mcp_elicitation=false' -c 'features.browser_use=false' -c 'features.browser_use_external=false' -c 'features.computer_use=false' -c 'features.in_app_browser=false' -c 'features.image_generation=false' -c 'features.tool_suggest=false' -c 'features.memories=false' -c 'features.default_mode_request_user_input=false' -c 'tools.experimental_request_user_input.enabled=false' -c 'skills.include_instructions=true'"
system-prompt-file = "coder.md"

# Tune the reviewer's model, effort, or tools here.
[[agents.teams.forge.roles]]
role = "reviewer"
profile = "claude"
mode = "auto"
model = "opus"
effort = "high"
auto-compact = "320k"
args = "--strict-mcp-config --tools 'Bash,Read,Edit,Write,LSP,Skill'"
system-prompt-file = "reviewer.md"
