# A complete ~/.tmux.conf for coding-agent work: true color, the behaviors
# agent TUIs rely on, Zellij-parity Alt chords, titled pane frames, and a
# TokyoNight Night status bar that matches Rimz's default sidebar scheme.
#
# Install (back up any existing config first):
#   cp examples/tmux.conf ~/.tmux.conf
#   tmux source-file ~/.tmux.conf     # or restart the tmux server
#
# Assumes tmux 3.5+ and a 24-bit-color terminal; the status bar and frame
# glyphs assume a Nerd Font or another Powerline-capable face. The guide at
# docs/guide/setup.md walks through every choice; the [tmux] table in
# ~/.config/rimz/config.toml can override the room-scoped keys.

# --- True color + italics ----------------------------------------------------
# Advertise a color terminal inside tmux and pass RGB and styles through.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:RGB,alacritty:RGB,wezterm:RGB"
set -ga terminal-features ",*:RGB,*:usstyle,*:clipboard"

# --- Behaviors a modern TUI agent relies on ----------------------------------
# Rimz applies these inside its rooms; setting them here keeps your own tmux
# sessions consistent.

set -g  mouse on                      # scroll, select panes, resize
set -g  history-limit 100000          # long Claude/Codex output stays in scrollback
set -sg escape-time 0                 # no ESC lag in helix, nvim, fzf, agent TUIs
set -ga terminal-features ",*:sync"   # atomic redraws (DECSET 2026): no torn frames
set -g  focus-events on               # editors and agents see focus changes
set -g  allow-passthrough on          # desktop notifications pass through tmux
set -g  set-clipboard on              # yank into the host clipboard over OSC52

# Modified Enter: agents receive Shift+Enter / Alt+Enter as CSI-u soft newlines
# while plain Enter still submits. On tmux 3.5.x this trades clean multiline
# clipboard paste while extended keys are active; tmux 3.6+ preserves both.
set -s  extended-keys on
set -s  extended-keys-format csi-u
set -ga terminal-features "*:extkeys"
bind-key -n S-Enter send-keys Escape "[13;2u"
bind-key -n M-Enter send-keys Escape "[13;3u"

# --- Copy-mode: vi keys, mouse-drag yanks and exits, gentler scroll -----------

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
# Anchor the selection the instant a drag opens copy-mode, so the first drag
# copies instead of stranding a highlight. Keep tmux's guard that forwards the
# drag to a mouse-aware app or an already-open mode.
bind -T root MouseDrag1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -M ; send -X begin-selection }
bind -T copy-mode-vi WheelUpPane   send -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send -X -N 3 scroll-down

# --- Windows: compact numbering, stable names --------------------------------

set -g  renumber-windows on
setw -g aggressive-resize on
setw -g automatic-rename off          # keep windows at the name they were given
setw -g allow-rename off              # ignore app title escapes renaming them

# --- Pane frames: Zellij-style titled borders ---------------------------------
# Heavy UTF-8 lines render as a solid frame; the title carries the pane index
# and running command. Rimz inherits these in its rooms while the [tmux]
# pane_border_status override stays unset. Toggle with Alt+z below.

set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-indicators colour
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-format "#{?pane_active,#[fg=#7aa2f7 bg=default bold],#[fg=#414868 bg=default]}━ #{?pane_active,#[fg=#7aa2f7 bg=default bold],#[fg=#a9b1d6 bg=default]}#{pane_index} #{pane_current_command} #{?pane_active,#[fg=#7aa2f7 bg=default bold],#[fg=#414868 bg=default]}━#[default]"

# --- Reload and smart splits ---------------------------------------------------
# Splits keep the current directory and follow the pane's longer visual edge
# (the split behavior Rimz rooms give Zellij): wide panes split left/right,
# tall panes split top/bottom.

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
set -g @smart_split_is_wide '#{?#{&&:#{window_cell_width},#{window_cell_height}},#{e|>=:#{e|*:#{pane_width},#{window_cell_width}},#{e|*:#{pane_height},#{window_cell_height}}},#{e|>=:#{pane_width},#{pane_height}}}'
bind | if -F '#{E:@smart_split_is_wide}' 'split-window -h -c "#{pane_current_path}"' 'split-window -v -c "#{pane_current_path}"'
bind - if -F '#{E:@smart_split_is_wide}' 'split-window -h -c "#{pane_current_path}"' 'split-window -v -c "#{pane_current_path}"'
bind c new-window -c "#{pane_current_path}"

# --- Zellij-parity Alt chords --------------------------------------------------
# The same no-prefix chords examples/zellij-config.kdl binds in locked mode, so
# one set of muscle memory drives both multiplexers. They shadow zsh's Alt keys
# (Alt-f forward-word, Alt-. last-arg) - the same trade Zellij makes. Alt+Enter
# stays a soft newline for agents (bound above); zoom remains `prefix z`.

# Tabs == tmux windows.
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-x kill-window
bind -n M-, previous-window
bind -n M-. next-window
bind -n M-i swap-window -d -t -1      # move tab left
bind -n M-o swap-window -d -t +1      # move tab right
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Panes.
bind -n M-n if -F '#{E:@smart_split_is_wide}' 'split-window -h -c "#{pane_current_path}"' 'split-window -v -c "#{pane_current_path}"'
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
# Zellij's floating pane, approximated as a fresh centered popup.
bind -n M-f display-popup -C \; display-popup -E -w 50% -h 50% -t "#{client_session}:#{active_window_index}" -d "#{pane_current_path}"
# Toggle pane frames, like Zellij's pane-mode z.
bind -n M-z if -F '#{!=:#{pane-border-status},off}' 'setw pane-border-status off' 'setw pane-border-status top'

# Resize with Alt+arrows and Alt+-/=; tmux has no spatial pane move.
bind -n M-Left  resize-pane -L 3
bind -n M-Right resize-pane -R 3
bind -n M-Up    resize-pane -U 2
bind -n M-Down  resize-pane -D 2
bind -n M--     resize-pane -D 2
bind -n M-=     resize-pane -U 2

# Session.
bind -n M-d detach-client

# --- Status bar: TokyoNight Night + Powerline tabs -----------------------------
# Blue session block, green focused tab, dim Night surfaces for inactive tabs.
# Swap the hex values for your own scheme's palette; `rimz list-themes` names
# every scheme Rimz bundles if you want the sidebar and status bar to match.

set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left  "#[fg=#1a1b26,bg=#7aa2f7,bold] #S "
set -g status-right "#[fg=#414868,bg=#1a1b26]#[fg=#c0caf5,bg=#414868] %H:%M #[fg=#7aa2f7,bg=#414868]#[fg=#c0caf5,bg=#414868] #h "
set -g status-left-length 60
set -g status-right-length 80
set -g window-status-separator ""
set -g window-status-style          "bg=#1a1b26,fg=#a9b1d6,noreverse"
set -g window-status-current-style  "bg=#1a1b26,fg=#1a1b26,bold,noreverse"
set -g window-status-activity-style "bg=#24283b,fg=#a9b1d6,noreverse"
set -g window-status-bell-style     "bg=#24283b,fg=#a9b1d6,noreverse"
set -g window-status-last-style     "bg=#24283b,fg=#a9b1d6,noreverse"
set -g window-status-format         "#[noreverse,fg=#{?window_start_flag,#7aa2f7,#1a1b26},bg=#24283b]#[noreverse,fg=#a9b1d6,bg=#24283b] #{?automatic_rename,#I:#W,#W} #[noreverse,fg=#24283b,bg=#1a1b26]"
set -g window-status-current-format "#[noreverse,fg=#{?window_start_flag,#7aa2f7,#1a1b26},bg=#9ece6a]#[noreverse,fg=#1a1b26,bg=#9ece6a,bold] #{?automatic_rename,#I:#W,#W} #[noreverse,fg=#9ece6a,bg=#1a1b26]"
set -g message-style         "fg=#1a1b26,bg=#7aa2f7,bold"
set -g message-command-style "fg=#c0caf5,bg=#24283b"
setw -g mode-style           "fg=#c0caf5,bg=#283457"
set -g display-panes-colour        "#414868"
set -g display-panes-active-colour "#7aa2f7"
setw -g clock-mode-colour          "#7aa2f7"
