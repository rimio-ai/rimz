# rimz/examples/tmux -- zellij-keys.conf
#
# Zellij-parity Alt chords: the same no-prefix keys examples/zellij/config.kdl
# binds in locked mode, so one set of muscle memory drives both multiplexers.
#
# This module is deliberately opt-in. No-prefix Alt binds shadow the shell's
# and every app's Alt keys: Alt-f (forward-word), Alt-d (kill-word), Alt-.
# (last-arg), and any agent-TUI Alt binding. That is the same trade Zellij's
# locked mode makes -- take it knowingly, and trim the set to what you use.
# Alt+Enter stays a soft newline for agents (agents.conf); zoom is `prefix z`.
#
# Adopt from your own ~/.tmux.conf:
#   source-file /path/to/rimz/examples/tmux/zellij-keys.conf

# Tabs == tmux windows.
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-x kill-window
bind -n M-, previous-window
bind -n M-. next-window
bind -n M-i swap-window -d -t -1      # move tab left
bind -n M-o swap-window -d -t +1      # move tab right
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Panes. The split follows the pane's longer visual edge, matching Zellij.
set -g @smart_split_is_wide '#{?#{&&:#{window_cell_width},#{window_cell_height}},#{e|>=:#{e|*:#{pane_width},#{window_cell_width}},#{e|*:#{pane_height},#{window_cell_height}}},#{e|>=:#{pane_width},#{pane_height}}}'
bind -n M-n if -F '#{E:@smart_split_is_wide}' 'split-window -h -c "#{pane_current_path}"' 'split-window -v -c "#{pane_current_path}"'
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
# Zellij's floating pane, approximated as a fresh centered popup.
bind -n M-f display-popup -C \; display-popup -E -w 50% -h 50% -t "#{client_session}:#{active_window_index}" -d "#{pane_current_path}"
# Toggle pane frames, like Zellij's pane-mode z.
bind -n M-z if -F '#{!=:#{pane-border-status},off}' 'setw pane-border-status off' 'setw pane-border-status top'

# Resize with Alt+arrows and Alt+-/=; tmux has no spatial pane move.
bind -n M-Left  resize-pane -L 3
bind -n M-Right resize-pane -R 3
bind -n M-Up    resize-pane -U 2
bind -n M-Down  resize-pane -D 2
bind -n M--     resize-pane -D 2
bind -n M-=     resize-pane -U 2

# Session.
bind -n M-d detach-client
