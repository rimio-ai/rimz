# rimz/examples/tmux -- theme-tokyonight.conf
#
# Titled pane frames and a Powerline status bar in TokyoNight Night, the
# palette of Rimz's default sidebar scheme, so the whole room reads as one
# surface. Assumes the terminal uses a Nerd Font or another Powerline-capable
# face. Pure styling -- swap the hex values for your own scheme's palette
# (`rimz list-themes` names every scheme Rimz bundles).
#
# Adopt from your own ~/.tmux.conf:
#   source-file /path/to/rimz/examples/tmux/theme-tokyonight.conf

# Pane frames: heavy UTF-8 lines render as a solid titled border carrying the
# pane index and running command -- tmux's analog of Zellij's pane frames.
# Rimz inherits these in its rooms while the [tmux] pane_border_status
# override stays unset.
set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-indicators colour
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-format "#{?pane_active,#[fg=#7aa2f7 bg=default bold],#[fg=#414868 bg=default]}━ #{?pane_active,#[fg=#7aa2f7 bg=default bold],#[fg=#a9b1d6 bg=default]}#{pane_index} #{pane_current_command} #{?pane_active,#[fg=#7aa2f7 bg=default bold],#[fg=#414868 bg=default]}━#[default]"

# Status bar: blue session block, green focused tab, dim Night surfaces for
# inactive tabs, Powerline transitions between segments.
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left  "#[fg=#1a1b26,bg=#7aa2f7,bold] #S "
set -g status-right "#[fg=#414868,bg=#1a1b26]#[fg=#c0caf5,bg=#414868] %H:%M #[fg=#7aa2f7,bg=#414868]#[fg=#c0caf5,bg=#414868] #h "
set -g status-left-length 60
set -g status-right-length 80
set -g window-status-separator ""
set -g window-status-style          "bg=#1a1b26,fg=#a9b1d6,noreverse"
set -g window-status-current-style  "bg=#1a1b26,fg=#1a1b26,bold,noreverse"
set -g window-status-activity-style "bg=#24283b,fg=#a9b1d6,noreverse"
set -g window-status-bell-style     "bg=#24283b,fg=#a9b1d6,noreverse"
set -g window-status-last-style     "bg=#24283b,fg=#a9b1d6,noreverse"
set -g window-status-format         "#[noreverse,fg=#{?window_start_flag,#7aa2f7,#1a1b26},bg=#24283b]#[noreverse,fg=#a9b1d6,bg=#24283b] #{?automatic_rename,#I:#W,#W} #[noreverse,fg=#24283b,bg=#1a1b26]"
set -g window-status-current-format "#[noreverse,fg=#{?window_start_flag,#7aa2f7,#1a1b26},bg=#9ece6a]#[noreverse,fg=#1a1b26,bg=#9ece6a,bold] #{?automatic_rename,#I:#W,#W} #[noreverse,fg=#9ece6a,bg=#1a1b26]"
set -g message-style         "fg=#1a1b26,bg=#7aa2f7,bold"
set -g message-command-style "fg=#c0caf5,bg=#24283b"
setw -g mode-style           "fg=#c0caf5,bg=#283457"
set -g display-panes-colour        "#414868"
set -g display-panes-active-colour "#7aa2f7"
setw -g clock-mode-colour          "#7aa2f7"
