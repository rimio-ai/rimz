# rimz/examples/tmux -- agents.conf
#
# The behaviors coding-agent TUIs rely on: true color, fast Escape handling, long
# scrollback, focus events, clickable OSC 8 links, notification passthrough,
# OSC52 clipboard, and modified-Enter soft newlines. RimZ asserts these inside its rooms; sourcing
# this file gives every tmux session the same behavior. Its keybindings cover
# Shift+Enter/Alt+Enter and Esc normalization; no theme, no other opinions.
#
# Requires tmux >= 3.5 (RimZ's floor; `extended-keys-format` is new in 3.5).
# Adopt from your own ~/.tmux.conf:
#   source-file /path/to/rimz/examples/tmux/agents.conf

# True color + italics: advertise a color terminal, pass RGB and styles through.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:RGB,alacritty:RGB,wezterm:RGB"
set -ga terminal-features ",*:RGB,*:usstyle,*:clipboard"

set -g  mouse on                      # scroll, select panes, resize
set -g  history-limit 100000          # long Claude/Codex output stays in scrollback
set -sg escape-time 10                # upstream 3.5+ default; safely joins split ESC sequences
set -ga terminal-features ",*:sync"   # atomic redraws (DECSET 2026): no torn frames
set -ga terminal-features ",*:hyperlinks" # clickable OSC 8 links
set -g  focus-events on               # editors and agents see focus changes
set -g  allow-passthrough on          # desktop notifications pass through tmux
set -g  set-clipboard on              # yank into the host clipboard over OSC52

# Modified Enter: agents receive Shift+Enter / Alt+Enter as CSI-u soft newlines
# while plain Enter still submits. On tmux 3.5.x this trades clean multiline
# clipboard paste while extended keys are active; tmux 3.6+ preserves both.
set -s  extended-keys on
set -s  extended-keys-format csi-u
set -ga terminal-features "*:extkeys"
set -s  user-keys[240] "\e[27u"        # name Ghostty's modifier-less CSI-u Esc
bind-key -n User240 send-keys Escape   # normalize it back to plain Esc
bind-key -n S-Enter send-keys Escape "[13;2u"
bind-key -n M-Enter send-keys Escape "[13;3u"
