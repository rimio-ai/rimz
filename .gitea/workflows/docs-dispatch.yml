name: Docs site dispatch

on:
  push:
    branches: [main]
    paths: ["README.md", "docs/**"]
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: [linux_amd64, debian-13]
    steps:
      - name: Dispatch GitHub docs sync
        env:
          GH_TOKEN: ${{ secrets.RIMZ_DOCS_DISPATCH }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://api.github.com/repos/rimio-ai/rimz-docs/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"event_type":"docs-updated"}'
