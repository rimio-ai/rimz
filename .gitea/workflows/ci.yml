name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

# PRs key on the PR ref, so a newer push cancels stale work. Pushes key on the
# commit, so every landed default-branch commit verifies.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_NET_RETRY: "5"
  RUSTUP_HOME: /usr/local/rustup
  CARGO_TARGET_DIR: target/ci
  # `-D warnings` is the deny-warnings gate.
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: "on"

jobs:
  checks:
    runs-on: [linux_amd64, debian-13]
    timeout-minutes: 30
    # The rimz-ci image keeps the no-persistence job container model while
    # starting warm: Rust, cargo plugins, cargo-vet, tmux, Zellij, mold,
    # sccache, and the release toolchain are baked once by ci-image.yml. The
    # workspace path stays stable for cargo cache keys, concurrent jobs stay
    # isolated, and every run skips per-job toolchain bootstrap. The private
    # Gitea package pulls with a dedicated read:package PAT.
    container:
      image: ${{ vars.RIMZ_CI_IMAGE }}
      options: --init
      credentials:
        username: ${{ vars.RIMZ_CI_REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PULL_TOKEN }}
    # Per-commit dedupe across events per tier. A rebase-ff merge lands the PR
    # head sha unchanged on main, so the merge fires both a push (main) and a
    # pull_request (the rebased branch) run for the same commit. Gitea matches
    # job-level concurrency groups repo-wide, so keying the job on the commit
    # collapses that pair into one run. The push run gates release.yml, so it
    # wins by canceling the redundant pull_request job.
    concurrency:
      group: ci-commit-${{ github.sha }}-checks
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image — RIMZ_CI_IMAGE is unset or wrong; dispatch ci-image.yml to build/push it and set the variable"
            exit 1
          }

      - uses: actions/checkout@v6

      - name: Cargo registry cache
        # rust-cache keeps the registry and git index warm; sccache owns
        # compiled artifact reuse.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/ci"
          prefix-key: "rimz-ci"
          cache-bin: false
          cache-targets: false

      - name: Configure sccache
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          export CARGO_HOME="$cargo_home"
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$CARGO_HOME/bin:$PATH"
          if ! sccache_path="$(command -v sccache)"; then
            echo "::error::sccache missing from rimz-ci image — dispatch ci-image.yml to rebuild/push it and repoint RIMZ_CI_IMAGE"
            exit 1
          fi
          dirname "$sccache_path" >> "$GITHUB_PATH"
          {
            echo "SCCACHE_PATH=$sccache_path"
            echo "ACTIONS_CACHE_SERVICE_V2=on"
            echo "ACTIONS_RESULTS_URL=${ACTIONS_RESULTS_URL:-}"
            echo "ACTIONS_RUNTIME_TOKEN=${ACTIONS_RUNTIME_TOKEN:-}"
          } >> "$GITHUB_ENV"

      - name: cargo xtask checks
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          mold -run cargo xtask checks

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  externals:
    runs-on: [linux_amd64, debian-13]
    timeout-minutes: 30
    # Supply-chain gates run off the checks/test critical path, one step each.
    # `deny` runs offline: advisories come from the image, and yanked metadata
    # comes from the index rebuilt through the runners' `[source.crates-io]`
    # nexus mirror and aliased to the canonical crates.io index path cargo-deny
    # reads from Cargo.lock. `vet` and `semver` fetch the crates.io
    # index/baseline directly, bypass the mirror, and retry transient egress.
    # All three gates block the job.
    container:
      image: ${{ vars.RIMZ_CI_IMAGE }}
      options: --init
      credentials:
        username: ${{ vars.RIMZ_CI_REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PULL_TOKEN }}
    concurrency:
      group: ci-commit-${{ github.sha }}-externals
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image — RIMZ_CI_IMAGE is unset or wrong; dispatch ci-image.yml to build/push it and set the variable"
            exit 1
          }

      - uses: actions/checkout@v6

      - name: Cargo registry cache
        # A warm registry/index feeds deny local yanked data and trims vet/semver egress.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/ci"
          prefix-key: "rimz-ci"
          cache-bin: false
          cache-targets: false

      - name: Configure sccache
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          export CARGO_HOME="$cargo_home"
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$CARGO_HOME/bin:$PATH"
          if ! sccache_path="$(command -v sccache)"; then
            echo "::error::sccache missing from rimz-ci image — dispatch ci-image.yml to rebuild/push it and repoint RIMZ_CI_IMAGE"
            exit 1
          fi
          dirname "$sccache_path" >> "$GITHUB_PATH"
          {
            echo "SCCACHE_PATH=$sccache_path"
            echo "ACTIONS_CACHE_SERVICE_V2=on"
            echo "ACTIONS_RESULTS_URL=${ACTIONS_RESULTS_URL:-}"
            echo "ACTIONS_RUNTIME_TOKEN=${ACTIONS_RUNTIME_TOKEN:-}"
          } >> "$GITHUB_ENV"

      - name: cargo xtask deny
        # Blocking: policy, advisory, yanked, license, and source failures red
        # the externals job.
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          # Keep Cargo's runtime home at the runner default so rust-cache's
          # restored registry and git cache are the paths `cargo` reads.
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          export CARGO_HOME="$cargo_home"
          mkdir -p "$CARGO_HOME"
          if ! find "$CARGO_HOME/advisory-dbs" -maxdepth 1 -type d -name 'advisory-db-*' 2>/dev/null | grep -q .; then
            if find /usr/local/cargo/advisory-dbs -maxdepth 1 -type d -name 'advisory-db-*' 2>/dev/null | grep -q .; then
              rm -rf "$CARGO_HOME/advisory-dbs"
              cp -a /usr/local/cargo/advisory-dbs "$CARGO_HOME/advisory-dbs"
            else
              cargo deny fetch db
            fi
          fi
          # rust-cache can restore crate archives without sparse index rows for
          # every locked crate. Rebuild the index through the runner's nexus
          # mirror so the yanked check reads it offline instead of reaching
          # crates.io directly.
          rm -rf "$CARGO_HOME/registry/index"
          cargo fetch --locked
          # cargo-deny resolves yanked metadata by the canonical crates.io source
          # URL recorded in Cargo.lock, while cargo fetch writes the runner's
          # source-replaced mirror index. Mirror the freshly rebuilt index to the
          # canonical cache path cargo-deny probes.
          canonical="$CARGO_HOME/registry/index/index.crates.io-1949cf8c6b5b557f"
          if [ ! -d "$canonical" ]; then
            mirror_index="$(find "$CARGO_HOME/registry/index" -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$mirror_index"
            cp -a "$mirror_index" "$canonical"
          fi
          # Offline: advisories from the baked DB, yanked from the aliased mirror index.
          RIMZ_DENY_OFFLINE=1 mold -run cargo xtask deny

      - name: cargo xtask vet
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          # Retry transient crates.io egress failures rather than failing the run.
          n=0
          until mold -run cargo xtask vet; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::vet checks failed after 3 attempts"
              exit 1
            fi
            echo "::warning::vet attempt $n failed; retrying in 10s"
            sleep 10
          done

      - name: cargo xtask semver
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          # Retry transient crates.io egress failures rather than failing the run.
          n=0
          until mold -run cargo xtask semver; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::semver checks failed after 3 attempts"
              exit 1
            fi
            echo "::warning::semver attempt $n failed; retrying in 10s"
            sleep 10
          done

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  tests:
    runs-on: [linux_amd64, debian-13]
    timeout-minutes: 60
    container:
      image: ${{ vars.RIMZ_CI_IMAGE }}
      options: --init
      credentials:
        username: ${{ vars.RIMZ_CI_REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PULL_TOKEN }}
    concurrency:
      group: ci-commit-${{ github.sha }}-tests
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image — RIMZ_CI_IMAGE is unset or wrong; dispatch ci-image.yml to build/push it and set the variable"
            exit 1
          }

      - uses: actions/checkout@v6

      - name: Cargo registry cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/ci"
          prefix-key: "rimz-ci"
          cache-bin: false
          cache-targets: false

      - name: Configure sccache
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          export CARGO_HOME="$cargo_home"
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$CARGO_HOME/bin:$PATH"
          if ! sccache_path="$(command -v sccache)"; then
            echo "::error::sccache missing from rimz-ci image — dispatch ci-image.yml to rebuild/push it and repoint RIMZ_CI_IMAGE"
            exit 1
          fi
          dirname "$sccache_path" >> "$GITHUB_PATH"
          {
            echo "SCCACHE_PATH=$sccache_path"
            echo "ACTIONS_CACHE_SERVICE_V2=on"
            echo "ACTIONS_RESULTS_URL=${ACTIONS_RESULTS_URL:-}"
            echo "ACTIONS_RUNTIME_TOKEN=${ACTIONS_RUNTIME_TOKEN:-}"
          } >> "$GITHUB_ENV"

      - name: cargo xtask test-archive
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          mold -run cargo xtask test-archive --archive-file target/ci/nextest-archive.tar.zst

      - name: cargo nextest run (gate)
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          unset NO_COLOR
          cargo nextest run --profile gate --archive-file target/ci/nextest-archive.tar.zst

      - name: cargo nextest run (live-tmux)
        if: ${{ !cancelled() }}
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          unset NO_COLOR
          cargo nextest run --profile live-tmux --archive-file target/ci/nextest-archive.tar.zst

      - name: cargo nextest run (live-zellij)
        if: ${{ !cancelled() }}
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          unset NO_COLOR
          cargo nextest run --profile live-zellij --archive-file target/ci/nextest-archive.tar.zst

      - name: cargo nextest run (journey)
        if: ${{ !cancelled() }}
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          unset NO_COLOR
          cargo nextest run --profile journey --archive-file target/ci/nextest-archive.tar.zst

      - name: sccache stats
        if: always()
        run: sccache --show-stats
