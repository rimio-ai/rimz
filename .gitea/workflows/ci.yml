name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

# PRs key on the PR ref, so a newer push cancels stale work. Pushes key on the
# commit, so every landed default-branch commit verifies.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTUP_HOME: /usr/local/rustup
  CARGO_TARGET_DIR: target/ci
  # `-D warnings` is the deny-warnings gate.
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: cargo xtask ci
    runs-on: [linux_amd64, debian-13]
    timeout-minutes: 30
    # The rimz-ci image keeps the no-persistence job container model while
    # starting warm: Rust, cargo plugins, cargo-vet, tmux, Zellij, mold, and the
    # release toolchain are baked once by ci-image.yml. The workspace path stays
    # stable for rust-cache, concurrent jobs stay isolated, and every run skips
    # per-job toolchain bootstrap. The private Gitea package pulls with a
    # dedicated read:package PAT.
    container:
      image: ${{ vars.RIMZ_CI_IMAGE }}
      credentials:
        username: ${{ vars.RIMZ_CI_REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PULL_TOKEN }}
    # Per-commit dedupe across events. A rebase-ff merge lands the PR head sha
    # unchanged on main, so the merge fires both a push (main) and a
    # pull_request (the rebased branch) run for the same commit. Gitea matches
    # job-level concurrency groups repo-wide, so keying the job on the commit
    # collapses that pair into one run. The push run gates release.yml, so it
    # wins by canceling the redundant pull_request job.
    concurrency:
      group: ci-commit-${{ github.sha }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image — RIMZ_CI_IMAGE is unset or wrong; dispatch ci-image.yml to build/push it and set the variable"
            exit 1
          }

      - uses: actions/checkout@v6

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/ci"
          prefix-key: "rimz-ci"
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo xtask ci
        # Cap nextest to half the cores so overlapping GitHub jobs leave the
        # latency-sensitive live-mux tests enough CPU for their CLI round-trips.
        # The per-run server cap in .config/nextest.toml bounds server count,
        # not CPU.
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          # Keep Cargo's runtime home at the runner default so rust-cache's
          # restored registry and git cache are the paths `cargo` reads. The CI
          # image keeps tools and the baked RustSec DB under /usr/local/cargo.
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          export CARGO_HOME="$cargo_home"
          mkdir -p "$CARGO_HOME"
          if ! find "$CARGO_HOME/advisory-dbs" -maxdepth 1 -type d -name 'advisory-db-*' 2>/dev/null | grep -q .; then
            if find /usr/local/cargo/advisory-dbs -maxdepth 1 -type d -name 'advisory-db-*' 2>/dev/null | grep -q .; then
              rm -rf "$CARGO_HOME/advisory-dbs"
              cp -a /usr/local/cargo/advisory-dbs "$CARGO_HOME/advisory-dbs"
            else
              cargo deny fetch db
            fi
          fi
          export RIMZ_DENY_OFFLINE=1
          NEXTEST_TEST_THREADS="$(( ($(nproc) + 1) / 2 ))"
          export NEXTEST_TEST_THREADS
          echo "Capping nextest to $NEXTEST_TEST_THREADS of $(nproc) cores for live-mux headroom"
          mold -run cargo xtask ci
