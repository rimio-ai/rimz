name: CI image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: image tag (defaults to date+sha)
        required: false
      base:
        description: base image (defaults to current RIMZ_CI_IMAGE)
        required: false

jobs:
  build:
    name: build and publish rimz-ci
    runs-on: [linux_amd64, debian-13]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image ref
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          REQUESTED_BASE: ${{ github.event.inputs.base }}
          DEFAULT_BASE: ${{ vars.RIMZ_CI_IMAGE }}
        run: |
          set -euo pipefail
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          host="${host%%/*}"
          host="${host,,}"
          owner="${GITHUB_REPOSITORY%/*}"
          owner="${owner,,}"
          tag="${REQUESTED_TAG:-$(date +%Y%m%d)-${GITHUB_SHA::7}}"
          base="${REQUESTED_BASE:-$DEFAULT_BASE}"
          if [ -z "$base" ]; then
            echo "::error::RIMZ_CI_IMAGE is unset and no base image was provided"
            exit 1
          fi
          if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::invalid Docker tag: ${tag}"
            exit 1
          fi
          echo "REGISTRY_HOST=$host" >> "$GITHUB_ENV"
          echo "IMAGE=${host}/${owner}/rimz-ci:${tag}" >> "$GITHUB_ENV"
          echo "BASE_IMAGE=$base" >> "$GITHUB_ENV"

      - name: Build and push image
        env:
          TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          auth_dir="${RUNNER_TEMP:-/tmp}/registry-auth"
          mkdir -p "$auth_dir/docker"
          export DOCKER_CONFIG="$auth_dir/docker"
          export REGISTRY_AUTH_FILE="$auth_dir/auth.json"
          echo "$TOKEN" | podman login "$REGISTRY_HOST" -u "$GITHUB_ACTOR" --password-stdin
          containerfile="$(mktemp)"
          cat > "$containerfile" <<'CONTAINERFILE'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          ENV RUSTUP_HOME=/usr/local/rustup \
              CARGO_HOME=/usr/local/cargo \
              PATH=/usr/local/cargo/bin:$PATH
          RUN rm -rf /usr/local/cargo/advisory-dbs \
           && tmp="$(mktemp -d)" \
           && printf '[package]\nname="x"\nversion="0.0.0"\nedition="2021"\n' > "$tmp/Cargo.toml" \
           && mkdir "$tmp/src" \
           && : > "$tmp/src/lib.rs" \
           && ( cd "$tmp" && cargo deny fetch db ) \
           && ( cd "$tmp" && cargo deny check advisories --disable-fetch ) \
           && rm -rf "$tmp" \
           && find /usr/local/cargo/advisory-dbs -maxdepth 1 -type d -name 'advisory-db-*' | grep -q .
          CONTAINERFILE
          podman build --isolation=chroot --build-arg BASE_IMAGE="$BASE_IMAGE" -f "$containerfile" -t "$IMAGE" .
          podman push "$IMAGE"

      - name: Update RIMZ_CI_IMAGE variable
        env:
          TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          var_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/variables/RIMZ_CI_IMAGE"
          body="$(printf '{"value":"%s"}' "$IMAGE")"
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT

          code="$(curl -sS -o "$response" -w '%{http_code}' -X PUT \
            -H "Authorization: token ${TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$body" \
            "$var_url")"
          case "$code" in
            200|201|204)
              ;;
            404)
              : > "$response"
              code="$(curl -sS -o "$response" -w '%{http_code}' -X POST \
                -H "Authorization: token ${TOKEN}" \
                -H 'Content-Type: application/json' \
                --data "$body" \
                "$var_url")"
              case "$code" in
                200|201|204)
                  ;;
                *)
                  cat "$response" >&2
                  echo "::error::failed to create RIMZ_CI_IMAGE (HTTP ${code})"
                  exit 1
                  ;;
              esac
              ;;
            *)
              cat "$response" >&2
              echo "::error::failed to update RIMZ_CI_IMAGE (HTTP ${code})"
              exit 1
              ;;
          esac
