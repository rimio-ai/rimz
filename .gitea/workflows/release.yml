name: Release

# Release is downstream of CI. The rolling `latest-main` build publishes after
# the CI workflow finishes successfully on the default branch, so a red commit
# never reaches the release page. Version tags cut their own gated private
# mirror on demand; GitHub owns the public release channels.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

# Release API writes for one identity run in order. Tag releases keep their own
# group; workflow-run and manual rolling builds share `latest-main`.
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || 'latest-main' }}
  cancel-in-progress: false

permissions:
  code: write
  releases: write

env:
  CARGO_TERM_COLOR: always
  # Match ci.yml when a release commit has no existing CI verdict and needs the
  # fallback self-gate.
  TERM: xterm-256color
  CARGO_HOME: /usr/local/cargo
  RUSTUP_HOME: /usr/local/rustup
  CARGO_TARGET_DIR: target/release-ci
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1
  RIMZ_SCCACHE: "off"

jobs:
  release:
    name: build and publish dist archives
    runs-on: [linux_amd64, debian-13]
    # Covers the 30-minute CI-verdict wait budget plus the dist build.
    timeout-minutes: 60
    # The rimz-ci image keeps the release container on the same warm baseline as
    # CI: Rust, gate plugins, cargo-vet, Python, tmux, Zellij, mold, zig,
    # cargo-zigbuild, rcodesign, and gh are baked once by ci-image.yml.
    # rust-cache still restores target/release-ci, but release jobs no longer
    # spend minutes reinstalling toolchains before the gate and dist build. The
    # private Gitea package pulls with a dedicated read:package PAT.
    container:
      image: ${{ vars.RIMZ_CI_IMAGE }}
      credentials:
        username: ${{ vars.RIMZ_CI_REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PULL_TOKEN }}
    # A `workflow_run` fires for every CI conclusion; gate on success so only a
    # green default-branch build publishes. Tag pushes and manual dispatches use
    # the exact release commit's CI verdict before falling back to a self-gate.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image — RIMZ_CI_IMAGE is unset or wrong; dispatch ci-image.yml to build/push it and set the variable"
            exit 1
          }

      - uses: actions/checkout@v7
        with:
          # Build the exact commit CI validated; for tags/dispatch this is the
          # event's own ref.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Trust checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/release-ci"
          prefix-key: "rimz-release"
          cache-bin: false

      # Self-gate: tag and manual-dispatch releases ride on CI's verdict for
      # the exact release commit. CI (checks + externals + full tests) is a
      # strict superset of `cargo xtask ci` (checks + full tests), so a green
      # CI run makes the re-test redundant. A CI run still in flight is awaited;
      # a red CI refuses the release; a commit CI never saw falls back to the
      # full self-gate below. The `workflow_run` path already passed CI.
      - name: Await CI verdict for this commit
        if: ${{ github.event_name != 'workflow_run' }}
        id: ci_verdict
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse 'HEAD^{commit}')"
          python_bin="$(command -v python3 || command -v python)"
          runs_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${commit}&limit=100"
          # Wait budget for an in-flight CI run; past it, self-gate instead.
          deadline="$(( $(date +%s) + 30 * 60 ))"
          while :; do
            if response="$(curl -fsS -H "Authorization: token ${TOKEN}" "$runs_url")"; then
              verdict="$(printf '%s' "$response" | "$python_bin" -c '
          import json
          import sys

          runs = json.load(sys.stdin).get("workflow_runs", [])
          ci_runs = [
              run for run in runs
              if (run.get("path") or "").split("@", 1)[0].endswith("ci.yml")
          ]
          if not ci_runs:
              print("none none")
          else:
              run = max(ci_runs, key=lambda item: int(item.get("id") or 0))
              print(run.get("status") or "unknown", run.get("conclusion") or "pending")
          ')"
            else
              verdict="unknown unknown"
            fi
            run_status="${verdict% *}"
            conclusion="${verdict#* }"
            case "$run_status" in
              none|unknown)
                echo "no CI verdict available for ${commit} (${run_status}); running the self-gate"
                echo "green=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              completed)
                if [ "$conclusion" = "success" ]; then
                  echo "CI green on ${commit}; skipping the self-gate"
                  echo "green=true" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "::error::CI concluded '${conclusion}' on ${commit} - a red commit never releases"
                exit 1
                ;;
              *)
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "CI still ${run_status} on ${commit} past the wait budget; running the self-gate"
                  echo "green=false" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "CI ${run_status} on ${commit}; waiting for its verdict"
                sleep 30
                ;;
            esac
          done

      - name: Gate on CI
        if: ${{ github.event_name != 'workflow_run' && steps.ci_verdict.outputs.green != 'true' }}
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          cargo xtask ci

      - name: Build distribution archives
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          cargo xtask dist

      - name: Resolve release identity
        shell: bash
        env:
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # The push trigger is tags-only, so this is a `v*` version tag.
            release_tag="${GITHUB_REF_NAME}"
            release_title="RimZ ${GITHUB_REF_NAME}"
            release_prerelease=false
            release_rolling=false
            release_commit="${GITHUB_SHA}"
            release_body="$(printf 'Private build mirror for %s at %s.\n\nPublic downloads and install channels: https://github.com/rimio-ai/rimz/releases/tag/%s\n' \
              "${GITHUB_REF_NAME}" "${release_commit}" "${GITHUB_REF_NAME}")"
          else
            # workflow_run (CI green on the default branch) or manual dispatch:
            # the rolling build published under a moving `latest-main` tag.
            release_tag="latest-main"
            release_title="RimZ (latest main)"
            release_prerelease=true
            release_rolling=true
            release_commit="${WORKFLOW_RUN_HEAD_SHA:-$GITHUB_SHA}"
            release_body="Rolling build from the default branch at ${release_commit}."
          fi

          {
            echo "RELEASE_TAG=${release_tag}"
            echo "RELEASE_TITLE=${release_title}"
            echo "RELEASE_PRERELEASE=${release_prerelease}"
            echo "RELEASE_ROLLING=${release_rolling}"
            echo "RELEASE_COMMIT=${release_commit}"
            echo "RELEASE_BODY<<RIMZ_RELEASE_BODY"
            printf '%s\n' "${release_body}"
            echo "RIMZ_RELEASE_BODY"
          } >> "$GITHUB_ENV"

      - name: Move rolling release tag
        if: ${{ env.RELEASE_ROLLING == 'true' }}
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "gitea-actions"
          git config user.email "actions@rimio.ai"
          git tag -f "$RELEASE_TAG" "$RELEASE_COMMIT"
          git -c "http.extraheader=Authorization: token ${TOKEN}" \
            push origin "refs/tags/${RELEASE_TAG}" --force

      - name: Publish Gitea release assets
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(command -v python3 || command -v python)"
          dist_dir="${CARGO_TARGET_DIR}/dist"
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          releases_url="${GITHUB_API_URL}/repos/${owner}/${repo}/releases"
          auth_header="Authorization: token ${TOKEN}"

          request_json() {
            local method="$1"
            local url="$2"
            local body="${3:-}"
            local response_file status
            response_file="$(mktemp)"
            if [ -n "$body" ]; then
              status="$(curl -sS -o "$response_file" -w '%{http_code}' \
                -X "$method" \
                -H "$auth_header" \
                -H 'Content-Type: application/json' \
                --data "$body" \
                "$url")"
            else
              status="$(curl -sS -o "$response_file" -w '%{http_code}' \
                -X "$method" \
                -H "$auth_header" \
                "$url")"
            fi
            cat "$response_file"
            rm -f "$response_file"
            test "$status" -ge 200 -a "$status" -lt 300
          }

          release_body="$("$python_bin" <<'PY'
          import json
          import os

          print(json.dumps({
              "tag_name": os.environ["RELEASE_TAG"],
              "target_commitish": os.environ["RELEASE_COMMIT"],
              "name": os.environ["RELEASE_TITLE"],
              "body": os.environ["RELEASE_BODY"],
              "draft": False,
              "prerelease": os.environ["RELEASE_PRERELEASE"] == "true",
          }))
          PY
          )"

          release_json=""
          if release_json="$(request_json GET "${releases_url}/tags/${RELEASE_TAG}")"; then
            release_id="$(printf '%s' "$release_json" | "$python_bin" -c 'import json, sys; print(json.load(sys.stdin)["id"])')"
            request_json PATCH "${releases_url}/${release_id}" "$release_body" >/dev/null
          else
            release_json="$(request_json POST "$releases_url" "$release_body")"
            release_id="$(printf '%s' "$release_json" | "$python_bin" -c 'import json, sys; print(json.load(sys.stdin)["id"])')"
          fi

          assets_json="$(request_json GET "${releases_url}/${release_id}/assets")"

          upload_artifact() {
            local artifact="$1"
            local asset_name="$2"
            local asset_id
            # Clear every prior asset with this name so an older concurrent
            # publisher cannot leave duplicates behind.
            while IFS= read -r asset_id; do
              [ -n "$asset_id" ] || continue
              curl -fsS -X DELETE \
                -H "$auth_header" \
                "${releases_url}/${release_id}/assets/${asset_id}" >/dev/null
            done < <(printf '%s' "$assets_json" | "$python_bin" -c 'import json, sys; name = sys.argv[1]; print(*(asset["id"] for asset in json.load(sys.stdin) if asset.get("name") == name), sep="\n")' "$asset_name")
            curl -fsS -X POST \
              -H "$auth_header" \
              -F "attachment=@${artifact}" \
              "${releases_url}/${release_id}/assets?name=${asset_name}" >/dev/null
            echo "uploaded ${asset_name}"
          }

          while read -r _ asset_name; do
            upload_artifact "${dist_dir}/${asset_name}" "$asset_name"
          done < "${dist_dir}/SHA256SUMS"
          upload_artifact "${dist_dir}/SHA256SUMS" SHA256SUMS
