[graph]
all-features = true
# Audit what links into the artifacts rimz ships on its supported platforms.
# wasm32 is deliberately absent: its only occupant is the presence plugin's
# `zellij-tile` → `zellij-utils` subtree, which executes inside Zellij's wasm
# sandbox — the same zellij-utils code every Zellij install already runs —
# and is supply-chain-covered by cargo-vet at safe-to-run for that boundary
# (see supply-chain/config.toml `[policy.rimz-presence-zellij]`). Revisit if
# rimz ever ships a wasm artifact that runs outside a plugin sandbox.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    # The rustls TLS stack reached via `ureq` (pricing refresh): permissive,
    # OSI-approved licenses on `ring`, `rustls-webpki`, `untrusted` (ISC),
    # `subtle` (BSD-3-Clause), and the Mozilla CA root bundle `webpki-roots`
    # (CDLA-Permissive-2.0, a permissive data license).
    "ISC",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    # `notify` uses CC0-1.0: a public-domain dedication with no copyleft
    # obligations, accepted for the local filesystem watcher dependency.
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Unmaintained / superseded — keep this list short and explained.
    { name = "fs2", reason = "unmaintained; use std `File` locking instead" },
]
skip = [
    # The `ring` crypto backend reached via `ureq`/`rustls` pins older support
    # crates than the rest of the tree; isolated to the TLS stack, drop when ring
    # catches up. (The former wit-bindgen and windows-sys skips left with the
    # graph's target scoping — wasm and windows triples are no longer audited.)
    { crate = "getrandom@0.2.17", reason = "ring pins getrandom 0.2; workspace otherwise on 0.3/0.4" },
    # `proptest` and `sentry-core` still carry rand 0.9 after tungstenite moved
    # to rand 0.10; drop these when both roots follow.
    { crate = "getrandom@0.3.4", reason = "proptest and sentry-core's rand 0.9 pin getrandom 0.3; uuid and tungstenite carry 0.4" },
    { crate = "rand@0.9.4", reason = "proptest and sentry retain rand 0.9; tungstenite carries rand 0.10" },
    { crate = "rand_core@0.9.5", reason = "proptest and sentry's rand 0.9 pins rand_core 0.9; tungstenite carries 0.10" },
    # `thiserror-impl` 2.0.19 leads the proc-macro stack onto syn 3; every other
    # derive crate still carries syn 2. Drop when the rest follow.
    { crate = "syn@3.0.2", reason = "thiserror-impl 2.0.19 pins syn 3; the rest of the proc-macro stack carries syn 2" },
    # `toml_edit`/`indexmap` has moved to hashbrown 0.17 while the ratatui
    # stack still carries 0.16; drop when either upstream converges.
    { crate = "hashbrown@0.17.1", reason = "toml_edit/indexmap pins hashbrown 0.17; ratatui stack pins 0.16" },
    # `kdl` 4.7.1 matches Zellij 0.44.3's permission-cache serializer and pins
    # the older miette/thiserror/unicode-width line; drop when Zellij moves.
    { crate = "thiserror@1.0.69", reason = "kdl 4.7.1 pins thiserror 1; workspace otherwise on 2" },
    { crate = "thiserror-impl@1.0.69", reason = "kdl 4.7.1 pins thiserror 1; workspace otherwise on 2" },
    { crate = "unicode-width@0.1.14", reason = "kdl 4.7.1's miette stack pins unicode-width 0.1; workspace otherwise on 0.2" },
]

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
