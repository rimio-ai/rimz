name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # `-D warnings` is the deny-warnings gate. The link-arg picks mold: a
  # `RUSTFLAGS` env overrides `[target.*].rustflags` from .cargo/config.toml
  # (the `linker = "clang"` key there survives), so the link-arg is re-added
  # here. mold + clang are installed per job below.
  RUSTFLAGS: -D warnings -Clink-arg=-fuse-ld=mold
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` pins the channel + components; this action
      # respects it.
      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rimz-ci

      - name: Install fast linker (mold + clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y mold clang

      # Prebuilt binaries — avoids compiling six plugins from source on every
      # cache miss (rust-cache does not cache ~/.cargo/bin).
      - name: Install cargo plugins
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-machete,cargo-vet,cargo-llvm-cov,cargo-semver-checks

      - name: cargo xtask ci
        run: cargo xtask ci

  mux-tests:
    name: mux backends (zellij + tmux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rimz-mux

      - name: Install tmux, Zellij, and the fast linker
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux mold clang
          curl -L https://github.com/zellij-org/zellij/releases/latest/download/zellij-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar -xz -C /usr/local/bin

      - name: Install cargo-nextest (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo xtask test
        run: cargo xtask test
