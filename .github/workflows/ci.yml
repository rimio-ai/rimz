name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

# PRs key on the PR ref, so a newer push cancels stale work. Pushes key on the
# commit, so every landed default-branch commit verifies.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: /usr/local/cargo
  RUSTUP_HOME: /usr/local/rustup
  CARGO_TARGET_DIR: target/ci
  # `-D warnings` is the deny-warnings gate.
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The rimz-ci image keeps the no-persistence job container model while
    # starting warm: Rust, cargo plugins, cargo-vet, tmux, Zellij, mold, and the
    # release toolchain are baked once by ci-image.yml. The workspace path stays
    # stable for rust-cache, concurrent jobs stay isolated, and every run skips
    # per-job toolchain bootstrap. The private Gitea package pulls with a
    # dedicated read:package PAT.
    container:
      image: ${{ vars.RIMZ_CI_IMAGE }}
      credentials:
        username: ${{ vars.RIMZ_CI_REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PULL_TOKEN }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image — RIMZ_CI_IMAGE is unset or wrong; dispatch ci-image.yml to build/push it and set the variable"
            exit 1
          }

      - uses: actions/checkout@v6

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/ci"
          prefix-key: "rimz-ci"
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo xtask ci
        # Cap nextest to half the cores so overlapping GitHub jobs leave the
        # latency-sensitive live-mux tests enough CPU for their CLI round-trips.
        # The per-run server cap in .config/nextest.toml bounds server count,
        # not CPU.
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          NEXTEST_TEST_THREADS="$(( ($(nproc) + 1) / 2 ))"
          export NEXTEST_TEST_THREADS
          echo "Capping nextest to $NEXTEST_TEST_THREADS of $(nproc) cores for live-mux headroom"
          mold -run cargo xtask ci
