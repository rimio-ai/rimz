name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # `-D warnings` is the deny-warnings gate.
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: cargo xtask ci
    runs-on: [linux_amd64, debian-13]
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/rimz-ci-target-${{ github.run_id }}-ci
    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` pins the channel + components; this action
      # respects it.
      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      # Prebuilt binaries — avoids compiling six plugins from source on every
      # cache miss. Gitea 1.25 lower-cases runner.os, so invoke install-action's
      # script directly with GitHub-compatible runner env values.
      - name: Install cargo plugins
        env:
          INPUT_TOOL: cargo-nextest,cargo-deny,cargo-machete,cargo-vet,cargo-llvm-cov,cargo-semver-checks
        run: |
          install_action_dir="$(mktemp -d)"
          trap 'rm -rf "$install_action_dir"' EXIT
          git clone --depth 1 --branch v2 https://github.com/taiki-e/install-action "$install_action_dir"
          env \
            ACTION_USER_AGENT="taiki-e/install-action (v2)" \
            DEFAULT_GITHUB_TOKEN= \
            GH_TOKEN= \
            GITHUB_ACTION_PATH="$install_action_dir" \
            GITHUB_TOKEN= \
            INPUT_CHECKSUM=true \
            INPUT_FALLBACK=cargo-binstall \
            RUNNER_ARCH=X64 \
            RUNNER_OS=Linux \
            bash --noprofile --norc "$install_action_dir/main.sh"

      - name: cargo xtask ci
        run: cargo xtask ci

      - name: Clean cargo target
        if: always()
        run: rm -rf "$CARGO_TARGET_DIR"

  mux-tests:
    name: mux backends (zellij + tmux)
    runs-on: [linux_amd64, debian-13]
    timeout-minutes: 20
    needs: ci
    env:
      CARGO_TARGET_DIR: /tmp/rimz-ci-target-${{ github.run_id }}-mux
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Check tmux
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            echo "tmux is not installed on this Gitea runner; skipping live mux backend tests"
            echo "RIMZ_SKIP_MUX_TESTS=1" >> "$GITHUB_ENV"
          fi

      - name: Install Zellij
        run: |
          if [ "${RIMZ_SKIP_MUX_TESTS:-}" = 1 ]; then
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/bin"
          curl -L https://github.com/zellij-org/zellij/releases/latest/download/zellij-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install cargo-nextest (prebuilt)
        env:
          INPUT_TOOL: cargo-nextest
        run: |
          if [ "${RIMZ_SKIP_MUX_TESTS:-}" = 1 ]; then
            exit 0
          fi
          install_action_dir="$(mktemp -d)"
          trap 'rm -rf "$install_action_dir"' EXIT
          git clone --depth 1 --branch v2 https://github.com/taiki-e/install-action "$install_action_dir"
          env \
            ACTION_USER_AGENT="taiki-e/install-action (v2)" \
            DEFAULT_GITHUB_TOKEN= \
            GH_TOKEN= \
            GITHUB_ACTION_PATH="$install_action_dir" \
            GITHUB_TOKEN= \
            INPUT_CHECKSUM=true \
            INPUT_FALLBACK=cargo-binstall \
            RUNNER_ARCH=X64 \
            RUNNER_OS=Linux \
            bash --noprofile --norc "$install_action_dir/main.sh"

      - name: cargo xtask test
        run: |
          if [ "${RIMZ_SKIP_MUX_TESTS:-}" = 1 ]; then
            echo "live mux backend tests skipped"
            exit 0
          fi
          cargo xtask test

      - name: Clean cargo target
        if: always()
        run: rm -rf "$CARGO_TARGET_DIR"
