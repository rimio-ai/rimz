name: CI

on:
  workflow_dispatch:
    inputs:
      # `container.image` reads `inputs` but not `env`, so a dispatch is the
      # one way a branch runs in an image other than `latest`. Every other
      # event leaves the input empty.
      image_tag:
        description: rimz-ci image tag to run in (defaults to latest)
        required: false
        type: string
  pull_request:
  # The main ruleset's merge queue waits for the required checks on its own
  # merge-group commit; without this trigger every queued PR times out.
  merge_group:
  push:
    branches: [main, master]

# PRs key on the PR ref, so a newer push cancels stale work. Pushes and merge
# groups key on the commit, so every landed default-branch commit verifies.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  TERM: xterm-256color
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_NET_RETRY: "5"
  CARGO_HOME: /usr/local/cargo
  RUSTUP_HOME: /usr/local/rustup
  CARGO_TARGET_DIR: target/ci
  # `-D warnings` is the deny-warnings gate.
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"
  # Overrides `[profile.dev] debug` from Cargo.toml for CI only; the `test`
  # profile inherits it. Backtrace frames lose file and line, panic messages
  # keep their location.
  CARGO_PROFILE_DEV_DEBUG: "false"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # How much of the suite this event runs:
  # - `pr`: a pull request runs formatting, the invariants check, and the
  #   supply-chain gates. Everything else waits for the merge queue.
  # - `full`: the merge queue and a manual dispatch run every job.
  # - `warm`: a push to main whose commit already has a green `merge_group`
  #   run compiles what the queue's runs read from main's sccache entries (the
  #   test build, `cargo xtask checks`, the cross-target checks) and runs no
  #   tests. The queue fast-forwards main to the commit it tested, and both runs
  #   share the workflow concurrency group keyed on the SHA, so the push run
  #   starts only once the queue's run has finished. A push that bypassed the
  #   queue finds no such run and runs `full`.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      suite: ${{ steps.suite.outputs.suite }}
    steps:
      - name: Choose the suite
        id: suite
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) suite=pr ;;
            push)
              # A failed lookup runs the full suite: it costs time, never coverage.
              green="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${HEAD_SHA}&event=merge_group&status=success" \
                --jq '.total_count')" || {
                echo "::warning::could not read this commit's merge_group runs; running the full suite"
                green=0
              }
              if [ "$green" -gt 0 ]; then suite=warm; else suite=full; fi
              ;;
            *) suite=full ;;
          esac
          echo "suite=$suite" | tee -a "$GITHUB_OUTPUT"

  pr-checks:
    needs: scope
    if: needs.scope.outputs.suite == 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The rimz-ci image keeps the no-persistence job container model while
    # starting warm: Rust, cargo plugins, cargo-vet, the cargo registry, tmux,
    # Zellij, mold, sccache, and the release toolchain are baked once by
    # ci-image.yml. No job restores a registry cache: cargo fetches only what
    # Cargo.lock gained since the image was built. The workspace path stays
    # stable for cargo cache keys, concurrent jobs stay isolated, and every run
    # skips per-job toolchain bootstrap.
    container:
      image: ghcr.io/${{ github.repository_owner }}/rimz-ci:${{ inputs.image_tag || 'latest' }}
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    concurrency:
      group: ci-commit-${{ github.sha }}-pr-checks
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image - dispatch ci-image.yml to build/push ghcr.io/${GITHUB_REPOSITORY_OWNER}/rimz-ci:latest"
            exit 1
          }
          command -v sccache >/dev/null || {
            echo "::error::sccache missing from rimz-ci image - dispatch ci-image.yml to rebuild/push it"
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Trust checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: cargo xtask fmt
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          cargo xtask fmt

      - name: cargo xtask invariants
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          cargo xtask invariants

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  xtask-checks:
    needs: scope
    if: needs.scope.outputs.suite != 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository_owner }}/rimz-ci:${{ inputs.image_tag || 'latest' }}
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    concurrency:
      group: ci-commit-${{ github.sha }}-xtask-checks
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image - dispatch ci-image.yml to build/push ghcr.io/${GITHUB_REPOSITORY_OWNER}/rimz-ci:latest"
            exit 1
          }
          command -v sccache >/dev/null || {
            echo "::error::sccache missing from rimz-ci image - dispatch ci-image.yml to rebuild/push it"
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Trust checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: cargo xtask checks
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          mold -run cargo xtask checks

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  cross-targets:
    needs: scope
    if: needs.scope.outputs.suite != 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository_owner }}/rimz-ci:${{ inputs.image_tag || 'latest' }}
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    concurrency:
      group: ci-commit-${{ github.sha }}-cross-targets
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image - dispatch ci-image.yml to build/push ghcr.io/${GITHUB_REPOSITORY_OWNER}/rimz-ci:latest"
            exit 1
          }
          command -v sccache >/dev/null || {
            echo "::error::sccache missing from rimz-ci image - dispatch ci-image.yml to rebuild/push it"
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Trust checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      # The Release cross-build is the only other Darwin compile, and it runs
      # after merge; this type-checks the macOS target in the merge queue. Both
      # runs are needed: the plain one checks the shipped library and binary,
      # and `--tests` checks the test targets, which the crate's self
      # dev-dependency builds with `testkit` on, so it never sees the install
      # shape.
      - name: darwin check
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          cargo-zigbuild check -p rimz --target aarch64-apple-darwin --locked
          cargo-zigbuild check -p rimz --tests --target aarch64-apple-darwin --locked

      # The installer sends musl and ARM Linux users to cargo install. No other
      # queue job compiles these targets, and the only other aarch64 Linux
      # compile is GitHub's arm64 Docker image build at release; this
      # type-checks both in the merge queue.
      - name: musl linux check
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          cargo-zigbuild check -p rimz --target x86_64-unknown-linux-musl --locked

      - name: aarch64 linux check
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          cargo-zigbuild check -p rimz --target aarch64-unknown-linux-gnu --locked

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  checks:
    needs: [scope, pr-checks, xtask-checks, cross-targets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Roll up the checks jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e '.scope.result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null

  externals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Supply-chain gates run off the checks/test critical path, one step each.
    # `deny` runs offline: advisories and the canonical crates.io index come
    # from the image, then `cargo fetch --locked` pulls only lock-drift rows and
    # merges them back to the canonical index path cargo-deny reads from
    # Cargo.lock. `vet` fetches the crates.io index directly, bypasses the
    # mirror, and retries transient egress. Both gates block the job.
    container:
      image: ghcr.io/${{ github.repository_owner }}/rimz-ci:${{ inputs.image_tag || 'latest' }}
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    concurrency:
      group: ci-commit-${{ github.sha }}-externals
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image - dispatch ci-image.yml to build/push ghcr.io/${GITHUB_REPOSITORY_OWNER}/rimz-ci:latest"
            exit 1
          }
          command -v sccache >/dev/null || {
            echo "::error::sccache missing from rimz-ci image - dispatch ci-image.yml to rebuild/push it"
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Trust checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: cargo xtask deny
        # Blocking: policy, advisory, yanked, license, and source failures red
        # the externals job.
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          export CARGO_HOME="$cargo_home"
          mkdir -p "$CARGO_HOME"
          if ! find "$CARGO_HOME/advisory-dbs" -maxdepth 1 -type d -name 'advisory-db-*' 2>/dev/null | grep -q .; then
            if find /usr/local/cargo/advisory-dbs -maxdepth 1 -type d -name 'advisory-db-*' 2>/dev/null | grep -q .; then
              rm -rf "$CARGO_HOME/advisory-dbs"
              cp -a /usr/local/cargo/advisory-dbs "$CARGO_HOME/advisory-dbs"
            else
              cargo deny fetch db
            fi
          fi
          canonical="$CARGO_HOME/registry/index/index.crates.io-1949cf8c6b5b557f"
          cargo fetch --locked
          # cargo-deny resolves yanked metadata by the canonical crates.io source
          # URL recorded in Cargo.lock. When the runner mirror writes lock-drift
          # sparse index rows under its source-replaced cache key, merge those
          # rows into the baked canonical index cargo-deny probes.
          mkdir -p "$canonical"
          for mirror_index in "$CARGO_HOME"/registry/index/*; do
            [ -d "$mirror_index" ] || continue
            [ "$mirror_index" = "$canonical" ] && continue
            cp -a "$mirror_index"/. "$canonical"/
          done
          # Offline: advisories and yanked metadata from the local cargo home.
          RIMZ_DENY_OFFLINE=1 mold -run cargo xtask deny

      - name: cargo xtask vet
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          # Retry transient crates.io egress failures rather than failing the run.
          n=0
          until mold -run cargo xtask vet; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::vet checks failed after 3 attempts"
              exit 1
            fi
            echo "::warning::vet attempt $n failed; retrying in 10s"
            sleep 10
          done

      # `cargo xtask semver` is not a CI step. It reads the `rimz` crate's Rust
      # API, which is not a supported surface: the lib target exists so the
      # binary, tests, and benches can link the domain modules. It fires on
      # internal refactors and is blind to the flags, output, exit codes,
      # config keys, and persisted formats callers depend on. Those are gated
      # by the CLI surface snapshot in the `gate-tests` job.

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # The gate tier compiles once: this job archives the test binaries, and
  # `gate-tests` runs one slice of the tier per job from that archive. `warm`
  # compiles here and uploads nothing.
  gate-archive:
    needs: scope
    if: needs.scope.outputs.suite != 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository_owner }}/rimz-ci:${{ inputs.image_tag || 'latest' }}
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    concurrency:
      group: ci-commit-${{ github.sha }}-gate-archive
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image - dispatch ci-image.yml to build/push ghcr.io/${GITHUB_REPOSITORY_OWNER}/rimz-ci:latest"
            exit 1
          }
          command -v sccache >/dev/null || {
            echo "::error::sccache missing from rimz-ci image - dispatch ci-image.yml to rebuild/push it"
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Trust checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      # A version stamp that moves with every commit would change the `rimz`
      # crate's inputs, so no commit could reuse an earlier commit's `rimz`
      # build from sccache. The crate version keeps the stamp's prefix, which
      # `build_id` tests assert.
      - name: Fix the build version stamp
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "rimz"))')"
          echo "RIMZ_BUILD_VERSION_OVERRIDE=${version}+ci" >> "$GITHUB_ENV"

      - name: cargo xtask test-archive
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          mold -run cargo xtask test-archive --archive-file target/ci/nextest-archive.tar.zst
          ls -l target/ci/nextest-archive.tar.zst

      # The archive is zstd already, so the upload stores it as is.
      - name: Upload nextest archive
        if: needs.scope.outputs.suite == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: target/ci/nextest-archive.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  gate-tests:
    needs: [scope, gate-archive]
    if: needs.scope.outputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        partition: [1, 2, 3]
    container:
      image: ghcr.io/${{ github.repository_owner }}/rimz-ci:${{ inputs.image_tag || 'latest' }}
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    concurrency:
      group: ci-commit-${{ github.sha }}-gate-tests-${{ matrix.partition }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    env:
      PARTITION: count:${{ matrix.partition }}/3
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image - dispatch ci-image.yml to build/push ghcr.io/${GITHUB_REPOSITORY_OWNER}/rimz-ci:latest"
            exit 1
          }
          command -v sccache >/dev/null || {
            echo "::error::sccache missing from rimz-ci image - dispatch ci-image.yml to rebuild/push it"
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Trust checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Download nextest archive
        uses: actions/download-artifact@v8
        with:
          name: nextest-archive

      # Each job runs its slice of the gate tier as two nextest runs of one
      # profile: a filter and its negation. Every binary but the integration one
      # keeps nextest's default of one test per core. Each run writes
      # target/nextest/gate/junit.xml, so the first run's report moves aside
      # before the second starts.
      - name: cargo xtask test (gate, unit binaries)
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          mold -run cargo xtask test --deny-skips --profile gate --archive-file nextest-archive.tar.zst --partition "$PARTITION" -E 'not binary_id(=rimz::integration)'
          mkdir -p target/nextest/gate-units
          mv target/nextest/gate/junit.xml target/nextest/gate-units/junit.xml

      # At one test per core the integration binary leaves the 4-vCPU runner
      # about half idle, its tests waiting on child processes and deadlines, so
      # they overlap: 16 slots is four tests per core.
      - name: cargo xtask test (gate, integration)
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          mold -run cargo xtask test --deny-skips --profile gate --archive-file nextest-archive.tar.zst --partition "$PARTITION" -E 'binary_id(=rimz::integration)' --test-threads 16

      # A green run still carries each flaky test's failed first attempt here.
      # When a run fails before nextest starts, no report exists, so this step
      # fails too with "No files were found": the earlier failed step is the
      # cause.
      - name: Upload nextest JUnit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextest-junit-gate-${{ matrix.partition }}
          path: target/nextest/*/junit.xml
          if-no-files-found: error

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  live-tests:
    needs: scope
    if: needs.scope.outputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository_owner }}/rimz-ci:${{ inputs.image_tag || 'latest' }}
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    concurrency:
      group: ci-commit-${{ github.sha }}-live-tests
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image - dispatch ci-image.yml to build/push ghcr.io/${GITHUB_REPOSITORY_OWNER}/rimz-ci:latest"
            exit 1
          }
          command -v sccache >/dev/null || {
            echo "::error::sccache missing from rimz-ci image - dispatch ci-image.yml to rebuild/push it"
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Trust checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: cargo xtask loop-tests
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          cargo xtask loop-tests

      # A version stamp that moves with every commit would change the `rimz`
      # crate's inputs, so no commit could reuse an earlier commit's `rimz`
      # build from sccache. The crate version keeps the stamp's prefix, which
      # `build_id` tests assert.
      - name: Fix the build version stamp
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "rimz"))')"
          echo "RIMZ_BUILD_VERSION_OVERRIDE=${version}+ci" >> "$GITHUB_ENV"

      - name: cargo xtask test (compile)
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          mold -run cargo xtask test --no-run

      - name: cargo xtask test (live)
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          mold -run cargo xtask test --deny-skips --profile live

      - name: cargo xtask test (journey)
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          mold -run cargo xtask test --deny-skips --profile journey

      # A green run still carries each flaky test's failed first attempt here.
      # When compile fails, no report exists, so this step fails too with
      # "No files were found": the earlier failed step is the cause.
      - name: Upload nextest JUnit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextest-junit-live
          path: target/nextest/*/junit.xml
          if-no-files-found: error

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  tests:
    needs: [scope, gate-archive, gate-tests, live-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Roll up the test jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e '.scope.result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
