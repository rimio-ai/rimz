name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target/ci
  # `-D warnings` is the deny-warnings gate.
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: cargo xtask ci
    runs-on: [linux_amd64, debian-13]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # `rust-toolchain.toml` pins the channel + components; this action
      # respects it.
      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Compute Cargo cache key
        id: cargo-cache-key
        shell: bash
        run: |
          cache_key_input="${RUNNER_TEMP:-/tmp}/rimz-cargo-cache-key"
          {
            printf 'runner-os=%s\n' "${RUNNER_OS:-unknown}"
            printf 'runner-arch=%s\n' "${RUNNER_ARCH:-unknown}"
            printf 'cargo-target-dir=%s\n' "$CARGO_TARGET_DIR"
            printf 'rustflags=%s\n' "${RUSTFLAGS:-}"
            rustc -vV
            cargo -vV
            find . -type f \( \
              -name Cargo.lock \
              -o -name Cargo.toml \
              -o -name rust-toolchain \
              -o -name rust-toolchain.toml \
              -o -path '*/.cargo/config.toml' \
            \) -print | LC_ALL=C sort | while IFS= read -r file; do
              sha256sum "$file"
            done
          } > "$cache_key_input"

          runner_os="$(printf '%s' "${RUNNER_OS:-linux}" | tr '[:upper:]' '[:lower:]')"
          runner_arch="$(printf '%s' "${RUNNER_ARCH:-x64}" | tr '[:upper:]' '[:lower:]')"
          key_hash="$(sha256sum "$cache_key_input" | awk '{print $1}')"
          prefix="cargo-${runner_os}-${runner_arch}-${key_hash}"
          echo "key=$prefix" >> "$GITHUB_OUTPUT"
          echo "fallback_prefix=cargo-${runner_os}-${runner_arch}-" >> "$GITHUB_OUTPUT"

      - name: Prepare Cargo cache directories
        run: mkdir -p ~/.cargo/registry/index ~/.cargo/registry/cache ~/.cargo/git/db "$CARGO_TARGET_DIR"

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/ci
          key: ${{ steps.cargo-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.cargo-cache-key.outputs.fallback_prefix }}

      # Prebuilt binaries — avoids compiling six plugins from source on every
      # cache miss. Gitea 1.25 lower-cases runner.os, so invoke install-action's
      # script directly with GitHub-compatible runner env values.
      - name: Install cargo plugins
        env:
          INPUT_TOOL: cargo-nextest,cargo-deny,cargo-machete,cargo-llvm-cov,cargo-semver-checks
        run: |
          install_action_dir="$(mktemp -d)"
          trap 'rm -rf "$install_action_dir"' EXIT
          git clone --depth 1 --branch v2 https://github.com/taiki-e/install-action "$install_action_dir"
          env \
            ACTION_USER_AGENT="taiki-e/install-action (v2)" \
            DEFAULT_GITHUB_TOKEN= \
            GH_TOKEN= \
            GITHUB_ACTION_PATH="$install_action_dir" \
            GITHUB_TOKEN= \
            INPUT_CHECKSUM=true \
            INPUT_FALLBACK=cargo-binstall \
            RUNNER_ARCH=X64 \
            RUNNER_OS=Linux \
            bash --noprofile --norc "$install_action_dir/main.sh"

      # cargo-vet 0.10.1+ adds Trusted Publishing support, and the imported
      # audits now carry `trusted-publisher` entries that 0.10.0 cannot parse.
      # Upstream ships no prebuilt binary past 0.10.0, so build the pinned
      # crates.io release (cached) to keep CI and contributors on one version.
      - name: Cache cargo-vet
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-vet
          key: cargo-vet-0.10.2-linux-amd64
      - name: Install cargo-vet (pinned 0.10.2)
        run: |
          set -euo pipefail
          if cargo vet --version 2>/dev/null | grep -qx 'cargo-vet 0.10.2'; then
            echo 'cargo-vet 0.10.2 already installed'
          else
            cargo install --locked cargo-vet@0.10.2
          fi

      - name: cargo xtask ci
        run: cargo xtask ci

  mux-tests:
    name: mux backends (zellij + tmux)
    runs-on: [linux_amd64, debian-13]
    timeout-minutes: 20
    needs: ci
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Compute Cargo cache key
        id: cargo-cache-key
        shell: bash
        run: |
          cache_key_input="${RUNNER_TEMP:-/tmp}/rimz-cargo-cache-key"
          {
            printf 'runner-os=%s\n' "${RUNNER_OS:-unknown}"
            printf 'runner-arch=%s\n' "${RUNNER_ARCH:-unknown}"
            printf 'cargo-target-dir=%s\n' "$CARGO_TARGET_DIR"
            printf 'rustflags=%s\n' "${RUSTFLAGS:-}"
            rustc -vV
            cargo -vV
            find . -type f \( \
              -name Cargo.lock \
              -o -name Cargo.toml \
              -o -name rust-toolchain \
              -o -name rust-toolchain.toml \
              -o -path '*/.cargo/config.toml' \
            \) -print | LC_ALL=C sort | while IFS= read -r file; do
              sha256sum "$file"
            done
          } > "$cache_key_input"

          runner_os="$(printf '%s' "${RUNNER_OS:-linux}" | tr '[:upper:]' '[:lower:]')"
          runner_arch="$(printf '%s' "${RUNNER_ARCH:-x64}" | tr '[:upper:]' '[:lower:]')"
          key_hash="$(sha256sum "$cache_key_input" | awk '{print $1}')"
          prefix="cargo-${runner_os}-${runner_arch}-${key_hash}"
          echo "key=$prefix" >> "$GITHUB_OUTPUT"
          echo "fallback_prefix=cargo-${runner_os}-${runner_arch}-" >> "$GITHUB_OUTPUT"

      - name: Prepare Cargo cache directories
        run: mkdir -p ~/.cargo/registry/index ~/.cargo/registry/cache ~/.cargo/git/db "$CARGO_TARGET_DIR"

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/ci
          key: ${{ steps.cargo-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.cargo-cache-key.outputs.fallback_prefix }}

      - name: Install tmux
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            if ! command -v apt-get >/dev/null 2>&1 || ! command -v dpkg-deb >/dev/null 2>&1; then
              echo "::error::tmux is missing and this runner cannot extract the Debian package fallback"
              exit 1
            fi
            tmux_root="$RUNNER_TEMP/tmux-root"
            tmux_apt="$RUNNER_TEMP/tmux-apt"
            mkdir -p \
              "$tmux_root" \
              "$tmux_apt/state/lists/partial" \
              "$tmux_apt/cache/archives/partial" \
              "$tmux_apt/dpkg"
            touch "$tmux_apt/dpkg/status"
            apt-get \
              -o Dir::State="$tmux_apt/state" \
              -o Dir::Cache="$tmux_apt/cache" \
              -o Dir::State::status="$tmux_apt/dpkg/status" \
              update
            apt-get \
              --yes \
              --download-only \
              -o Dir::State="$tmux_apt/state" \
              -o Dir::Cache="$tmux_apt/cache" \
              -o Dir::State::status="$tmux_apt/dpkg/status" \
              install tmux
            for deb in "$tmux_apt"/cache/archives/*.deb; do
              dpkg-deb -x "$deb" "$tmux_root"
            done
            loader="$(find "$tmux_root" -name ld-linux-x86-64.so.2 -print -quit)"
            if [ -z "$loader" ] || [ ! -x "$tmux_root/usr/bin/tmux" ]; then
              echo "::error::tmux package fallback did not produce an executable tmux"
              exit 1
            fi
            lib_path="$tmux_root/usr/lib/x86_64-linux-gnu:$tmux_root/lib/x86_64-linux-gnu"
            mkdir -p "$RUNNER_TEMP/bin"
            {
              printf '%s\n' '#!/bin/sh'
              printf 'exec "%s" --library-path "%s" "%s" "$@"\n' "$loader" "$lib_path" "$tmux_root/usr/bin/tmux"
            } > "$RUNNER_TEMP/bin/tmux"
            chmod +x "$RUNNER_TEMP/bin/tmux"
            export PATH="$RUNNER_TEMP/bin:$PATH"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi
          # debian-13 ships tmux 3.5a (≥ MIN_TMUX_VERSION); fail loudly if a
          # runner image is older so the live suite never silently degrades.
          tmux -V

      - name: Install Zellij
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -L https://github.com/zellij-org/zellij/releases/latest/download/zellij-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install cargo-nextest (prebuilt)
        env:
          INPUT_TOOL: cargo-nextest
        run: |
          install_action_dir="$(mktemp -d)"
          trap 'rm -rf "$install_action_dir"' EXIT
          git clone --depth 1 --branch v2 https://github.com/taiki-e/install-action "$install_action_dir"
          env \
            ACTION_USER_AGENT="taiki-e/install-action (v2)" \
            DEFAULT_GITHUB_TOKEN= \
            GH_TOKEN= \
            GITHUB_ACTION_PATH="$install_action_dir" \
            GITHUB_TOKEN= \
            INPUT_CHECKSUM=true \
            INPUT_FALLBACK=cargo-binstall \
            RUNNER_ARCH=X64 \
            RUNNER_OS=Linux \
            bash --noprofile --norc "$install_action_dir/main.sh"

      - name: cargo xtask test
        run: cargo xtask test
