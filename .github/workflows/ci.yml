name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

# PRs key on the PR ref, so a newer push cancels stale work. Pushes key on the
# commit, so every landed default-branch commit verifies.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  TERM: xterm-256color
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_NET_RETRY: "5"
  CARGO_HOME: /usr/local/cargo
  RUSTUP_HOME: /usr/local/rustup
  CARGO_TARGET_DIR: target/ci
  # `-D warnings` is the deny-warnings gate.
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  checks:
    name: cargo xtask checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The rimz-ci image keeps the no-persistence job container model while
    # starting warm: Rust, cargo plugins, cargo-vet, tmux, Zellij, mold,
    # sccache, and the release toolchain are baked once by ci-image.yml. The
    # workspace path stays stable for cargo cache keys, concurrent jobs stay
    # isolated, and every run skips per-job toolchain bootstrap.
    container:
      image: ghcr.io/${{ github.repository_owner }}/rimz-ci:latest
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    concurrency:
      group: ci-commit-${{ github.sha }}-checks
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image - dispatch ci-image.yml to build/push ghcr.io/${GITHUB_REPOSITORY_OWNER}/rimz-ci:latest"
            exit 1
          }
          command -v sccache >/dev/null || {
            echo "::error::sccache missing from rimz-ci image - dispatch ci-image.yml to rebuild/push it"
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Trust checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cargo registry cache
        # rust-cache keeps the registry and git index warm; sccache owns
        # compiled artifact reuse.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/ci"
          prefix-key: "rimz-ci"
          cache-bin: false
          cache-targets: false

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      - name: cargo xtask checks
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          mold -run cargo xtask checks

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  externals:
    name: cargo xtask externals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Supply-chain gates run off the checks/test critical path, one step each.
    # `deny` runs offline: advisories come from the image, and yanked metadata
    # comes from the index rebuilt through the mirror and aliased to the
    # canonical crates.io index path cargo-deny reads from Cargo.lock. `vet` and
    # `semver` fetch the crates.io index/baseline directly, bypass the mirror,
    # and retry transient egress. All three gates block the job.
    container:
      image: ghcr.io/${{ github.repository_owner }}/rimz-ci:latest
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    concurrency:
      group: ci-commit-${{ github.sha }}-externals
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image - dispatch ci-image.yml to build/push ghcr.io/${GITHUB_REPOSITORY_OWNER}/rimz-ci:latest"
            exit 1
          }
          command -v sccache >/dev/null || {
            echo "::error::sccache missing from rimz-ci image - dispatch ci-image.yml to rebuild/push it"
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Trust checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cargo registry cache
        # A warm registry/index feeds deny local yanked data and trims vet/semver egress.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/ci"
          prefix-key: "rimz-ci"
          cache-bin: false
          cache-targets: false

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      - name: cargo xtask deny
        # Blocking: policy, advisory, yanked, license, and source failures red
        # the externals job.
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          export CARGO_HOME="$cargo_home"
          mkdir -p "$CARGO_HOME"
          if ! find "$CARGO_HOME/advisory-dbs" -maxdepth 1 -type d -name 'advisory-db-*' 2>/dev/null | grep -q .; then
            if find /usr/local/cargo/advisory-dbs -maxdepth 1 -type d -name 'advisory-db-*' 2>/dev/null | grep -q .; then
              rm -rf "$CARGO_HOME/advisory-dbs"
              cp -a /usr/local/cargo/advisory-dbs "$CARGO_HOME/advisory-dbs"
            else
              cargo deny fetch db
            fi
          fi
          # rust-cache can restore crate archives without sparse index rows for
          # every locked crate. Rebuild the index through the runner's mirror so
          # the yanked check reads it offline instead of reaching crates.io
          # directly.
          rm -rf "$CARGO_HOME/registry/index"
          cargo fetch --locked
          # cargo-deny resolves yanked metadata by the canonical crates.io source
          # URL recorded in Cargo.lock, while cargo fetch writes the runner's
          # source-replaced mirror index. Mirror the freshly rebuilt index to the
          # canonical cache path cargo-deny probes.
          canonical="$CARGO_HOME/registry/index/index.crates.io-1949cf8c6b5b557f"
          if [ ! -d "$canonical" ]; then
            mirror_index="$(find "$CARGO_HOME/registry/index" -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$mirror_index"
            cp -a "$mirror_index" "$canonical"
          fi
          # Offline: advisories from the baked DB, yanked from the aliased mirror index.
          RIMZ_DENY_OFFLINE=1 mold -run cargo xtask deny

      - name: cargo xtask vet
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          # Retry transient crates.io egress failures rather than failing the run.
          n=0
          until mold -run cargo xtask vet; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::vet checks failed after 3 attempts"
              exit 1
            fi
            echo "::warning::vet attempt $n failed; retrying in 10s"
            sleep 10
          done

      - name: cargo xtask semver
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          # Retry transient crates.io egress failures rather than failing the run.
          n=0
          until mold -run cargo xtask semver; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::semver checks failed after 3 attempts"
              exit 1
            fi
            echo "::warning::semver attempt $n failed; retrying in 10s"
            sleep 10
          done

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  build-tests:
    name: cargo xtask test-archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/${{ github.repository_owner }}/rimz-ci:latest
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    concurrency:
      group: ci-commit-${{ github.sha }}-build-tests
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image - dispatch ci-image.yml to build/push ghcr.io/${GITHUB_REPOSITORY_OWNER}/rimz-ci:latest"
            exit 1
          }
          command -v sccache >/dev/null || {
            echo "::error::sccache missing from rimz-ci image - dispatch ci-image.yml to rebuild/push it"
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Trust checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cargo registry cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/ci"
          prefix-key: "rimz-ci"
          cache-bin: false
          cache-targets: false

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      - name: cargo xtask test-archive
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          mold -run cargo xtask test-archive --archive-file target/ci/nextest-archive.tar.zst

      - name: Upload nextest archive
        uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: target/ci/nextest-archive.tar.zst
          if-no-files-found: error
          retention-days: 3

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  tests-gate:
    name: cargo nextest run (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-tests
    container:
      image: ghcr.io/${{ github.repository_owner }}/rimz-ci:latest
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    concurrency:
      group: ci-commit-${{ github.sha }}-tests-gate
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image - dispatch ci-image.yml to build/push ghcr.io/${GITHUB_REPOSITORY_OWNER}/rimz-ci:latest"
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Trust checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download nextest archive
        uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: .

      - name: cargo nextest run
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          unset NO_COLOR
          cargo nextest run --profile gate --archive-file nextest-archive.tar.zst

  tests-live:
    name: cargo nextest run (live)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-tests
    container:
      image: ghcr.io/${{ github.repository_owner }}/rimz-ci:latest
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    concurrency:
      group: ci-commit-${{ github.sha }}-tests-live
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image - dispatch ci-image.yml to build/push ghcr.io/${GITHUB_REPOSITORY_OWNER}/rimz-ci:latest"
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Trust checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download nextest archive
        uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: .

      - name: cargo nextest run (live)
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          unset NO_COLOR
          cargo nextest run --profile live --archive-file nextest-archive.tar.zst

      - name: cargo nextest run (journey)
        if: ${{ !cancelled() }}
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          unset NO_COLOR
          cargo nextest run --profile journey --archive-file nextest-archive.tar.zst

  tests-complete:
    name: cargo nextest run (all tiers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [tests-gate, tests-live]
    # Aggregate gate: the single check to require in branch protection. `always()`
    # runs it even when a tier is skipped or cancelled, then the guard fails unless
    # every tier succeeded. A tier the scheduler drops under runner pressure lands
    # as `skipped`, which reduces its result below `success`, so a tier that never
    # ran can no longer pass as a green PR the way it did before.
    if: ${{ always() }}
    steps:
      - name: Require every test tier to succeed
        run: |
          gate='${{ needs['tests-gate'].result }}'
          live='${{ needs['tests-live'].result }}'
          if [ "$gate" != "success" ] || [ "$live" != "success" ]; then
            echo "::error::test tiers did not all succeed (tests-gate=$gate, tests-live=$live) — a tier failed, was cancelled, or was skipped/never scheduled; re-run so every tier executes"
            exit 1
          fi
