name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

# PRs key on the PR ref, so a newer push cancels stale work. Pushes key on the
# commit, so every landed default-branch commit verifies.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  TERM: xterm-256color
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_NET_RETRY: "5"
  CARGO_HOME: /usr/local/cargo
  RUSTUP_HOME: /usr/local/rustup
  CARGO_TARGET_DIR: target/ci
  # `-D warnings` is the deny-warnings gate.
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The rimz-ci image keeps the no-persistence job container model while
    # starting warm: Rust, cargo plugins, cargo-vet, tmux, Zellij, mold,
    # sccache, and the release toolchain are baked once by ci-image.yml. The
    # workspace path stays stable for cargo cache keys, concurrent jobs stay
    # isolated, and every run skips per-job toolchain bootstrap.
    container:
      image: ghcr.io/${{ github.repository_owner }}/rimz-ci:latest
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    concurrency:
      group: ci-commit-${{ github.sha }}-checks
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image - dispatch ci-image.yml to build/push ghcr.io/${GITHUB_REPOSITORY_OWNER}/rimz-ci:latest"
            exit 1
          }
          command -v sccache >/dev/null || {
            echo "::error::sccache missing from rimz-ci image - dispatch ci-image.yml to rebuild/push it"
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Trust checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cargo registry cache
        # rust-cache keeps the registry and git index warm; sccache owns
        # compiled artifact reuse.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/ci"
          prefix-key: "rimz-ci"
          cache-bin: false
          cache-targets: false

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      - name: cargo xtask checks
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          mold -run cargo xtask checks

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  externals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Supply-chain gates run off the checks/test critical path, one step each.
    # `deny` runs offline: advisories and the canonical crates.io index come
    # from the image, then `cargo fetch --locked` pulls only lock-drift rows and
    # merges them back to the canonical index path cargo-deny reads from
    # Cargo.lock. `vet` and `semver` fetch the crates.io index/baseline
    # directly, bypass the mirror, and retry transient egress. All three gates
    # block the job.
    container:
      image: ghcr.io/${{ github.repository_owner }}/rimz-ci:latest
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    concurrency:
      group: ci-commit-${{ github.sha }}-externals
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image - dispatch ci-image.yml to build/push ghcr.io/${GITHUB_REPOSITORY_OWNER}/rimz-ci:latest"
            exit 1
          }
          command -v sccache >/dev/null || {
            echo "::error::sccache missing from rimz-ci image - dispatch ci-image.yml to rebuild/push it"
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Trust checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cargo registry cache
        # A warm registry/index feeds deny local yanked data and trims vet/semver egress.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/ci"
          prefix-key: "rimz-ci"
          cache-bin: false
          cache-targets: false

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      - name: cargo xtask deny
        # Blocking: policy, advisory, yanked, license, and source failures red
        # the externals job.
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          export CARGO_HOME="$cargo_home"
          mkdir -p "$CARGO_HOME"
          if ! find "$CARGO_HOME/advisory-dbs" -maxdepth 1 -type d -name 'advisory-db-*' 2>/dev/null | grep -q .; then
            if find /usr/local/cargo/advisory-dbs -maxdepth 1 -type d -name 'advisory-db-*' 2>/dev/null | grep -q .; then
              rm -rf "$CARGO_HOME/advisory-dbs"
              cp -a /usr/local/cargo/advisory-dbs "$CARGO_HOME/advisory-dbs"
            else
              cargo deny fetch db
            fi
          fi
          canonical="$CARGO_HOME/registry/index/index.crates.io-1949cf8c6b5b557f"
          cargo fetch --locked
          # cargo-deny resolves yanked metadata by the canonical crates.io source
          # URL recorded in Cargo.lock. When the runner mirror writes lock-drift
          # sparse index rows under its source-replaced cache key, merge those
          # rows into the baked canonical index cargo-deny probes.
          mkdir -p "$canonical"
          for mirror_index in "$CARGO_HOME"/registry/index/*; do
            [ -d "$mirror_index" ] || continue
            [ "$mirror_index" = "$canonical" ] && continue
            cp -a "$mirror_index"/. "$canonical"/
          done
          # Offline: advisories and yanked metadata from the local cargo home.
          RIMZ_DENY_OFFLINE=1 mold -run cargo xtask deny

      - name: cargo xtask vet
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          # Retry transient crates.io egress failures rather than failing the run.
          n=0
          until mold -run cargo xtask vet; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::vet checks failed after 3 attempts"
              exit 1
            fi
            echo "::warning::vet attempt $n failed; retrying in 10s"
            sleep 10
          done

      - name: cargo xtask semver
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          # Retry transient crates.io egress failures rather than failing the run.
          n=0
          until mold -run cargo xtask semver; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::semver checks failed after 3 attempts"
              exit 1
            fi
            echo "::warning::semver attempt $n failed; retrying in 10s"
            sleep 10
          done

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository_owner }}/rimz-ci:latest
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    concurrency:
      group: ci-commit-${{ github.sha }}-tests
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image - dispatch ci-image.yml to build/push ghcr.io/${GITHUB_REPOSITORY_OWNER}/rimz-ci:latest"
            exit 1
          }
          command -v sccache >/dev/null || {
            echo "::error::sccache missing from rimz-ci image - dispatch ci-image.yml to rebuild/push it"
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Trust checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cargo registry cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/ci"
          prefix-key: "rimz-ci"
          cache-bin: false
          cache-targets: false

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      - name: cargo xtask test (compile)
        id: compile
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          mold -run cargo xtask test --no-run

      - name: cargo xtask test (gate)
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          mold -run cargo xtask test --profile gate

      - name: cargo xtask test (live)
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          mold -run cargo xtask test --profile live

      - name: cargo xtask test (journey)
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          mold -run cargo xtask test --profile journey

      - name: sccache stats
        if: always()
        run: sccache --show-stats
