name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # `-D warnings` is the deny-warnings gate.
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: cargo xtask ci
    runs-on: [linux_amd64, debian-13]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` pins the channel + components; this action
      # respects it.
      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rimz-ci

      # Prebuilt binaries — avoids compiling six plugins from source on every
      # cache miss (rust-cache does not cache ~/.cargo/bin).
      - name: Install cargo plugins
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-machete,cargo-vet,cargo-llvm-cov,cargo-semver-checks

      - name: cargo xtask ci
        run: cargo xtask ci

  mux-tests:
    name: mux backends (zellij + tmux)
    runs-on: [linux_amd64, debian-13]
    timeout-minutes: 20
    continue-on-error: true
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rimz-mux

      - name: Check tmux
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            echo "tmux is required on the Gitea runner for mux backend tests" >&2
            exit 1
          fi

      - name: Install Zellij
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -L https://github.com/zellij-org/zellij/releases/latest/download/zellij-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install cargo-nextest (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo xtask test
        run: cargo xtask test
