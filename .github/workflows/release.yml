name: Release

# Release is downstream of CI. The rolling `latest-main` build publishes after
# the CI workflow finishes successfully on the default branch, so a red commit
# never reaches the release page. Version tags cut their own gated release on
# demand.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: write
  id-token: write
  packages: read
  # The self-gate skip reads this commit's CI runs before deciding to re-test.
  actions: read

env:
  CARGO_TERM_COLOR: always
  # Match ci.yml so the self-gate (`cargo xtask ci`) runs the suite in the same
  # environment CI validated — live mux servers and terminal probes need TERM.
  TERM: xterm-256color
  CARGO_HOME: /usr/local/cargo
  RUSTUP_HOME: /usr/local/rustup
  CARGO_TARGET_DIR: target/release-ci
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1
  RIMZ_SCCACHE: "off"

jobs:
  release:
    name: build and publish dist archives
    runs-on: ubuntu-latest
    environment: release
    # Covers the 30-minute CI-verdict wait budget plus the dist build.
    timeout-minutes: 60
    # The rimz-ci image keeps the release container on the same warm baseline as
    # CI: Rust, gate plugins, cargo-vet, Python, tmux, Zellij, mold, zig,
    # cargo-zigbuild, rcodesign, and gh are baked once by ci-image.yml.
    # rust-cache still restores target/release-ci, but release jobs no longer
    # spend minutes reinstalling toolchains before the gate and dist build.
    container:
      image: ghcr.io/${{ github.repository_owner }}/rimz-ci:latest
      options: --init
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    # A `workflow_run` fires for every CI conclusion; gate on success so only a
    # green default-branch build publishes. Tag pushes and manual dispatches run
    # the gate themselves (the `cargo xtask ci` step below) before publishing.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Assert running in the rimz-ci image
        run: |
          test -f /etc/rimz-ci || {
            echo "::error::not inside rimz-ci image - dispatch ci-image.yml to build/push ghcr.io/${GITHUB_REPOSITORY_OWNER}/rimz-ci:latest"
            exit 1
          }

      - uses: actions/checkout@v7
        with:
          # Build the exact commit CI validated; for tags/dispatch this is the
          # event's own ref.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Trust checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate Cargo release tag
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          crate_version="$(cargo pkgid -p rimz | sed 's/.*#//')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ] && \
             [ "$crate_version" != "${tag_version}.0" ] && \
             [ "$crate_version" != "${tag_version}.0.0" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match rimz ${crate_version}"
            exit 1
          fi

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/release-ci"
          prefix-key: "rimz-release"
          cache-bin: false

      # Self-gate: tag and manual-dispatch releases ride on CI's verdict for
      # the exact release commit. CI (checks + externals + full tests) is a
      # strict superset of `cargo xtask ci` (checks + full tests), so a green
      # CI run makes the re-test redundant. A CI run still in flight — the
      # commit and its tag usually push together — is awaited rather than
      # raced; a red CI refuses the release; a commit CI never saw (an old or
      # mid-push commit) falls back to the full self-gate below. The
      # `workflow_run` path already passed CI, so it skips unconditionally.
      - name: Await CI verdict for this commit
        if: ${{ github.event_name != 'workflow_run' }}
        id: ci_verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse 'HEAD^{commit}')"
          # Wait budget for an in-flight CI run; past it, self-gate instead.
          deadline="$(( $(date +%s) + 30 * 60 ))"
          while :; do
            verdict="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${commit}&per_page=1" \
              --jq 'if (.workflow_runs | length) == 0 then "none none"
                    else .workflow_runs[0] | "\(.status) \(.conclusion // "pending")" end' \
              || echo "unknown unknown")"
            run_status="${verdict% *}"
            conclusion="${verdict#* }"
            case "$run_status" in
              none|unknown)
                echo "no CI verdict available for ${commit} (${run_status}); running the self-gate"
                echo "green=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              completed)
                if [ "$conclusion" = "success" ]; then
                  echo "CI green on ${commit}; skipping the self-gate"
                  echo "green=true" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "::error::CI concluded '${conclusion}' on ${commit} - a red commit never releases"
                exit 1
                ;;
              *)
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "CI still ${run_status} on ${commit} past the wait budget; running the self-gate"
                  echo "green=false" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "CI ${run_status} on ${commit}; waiting for its verdict"
                sleep 30
                ;;
            esac
          done

      - name: Gate on CI
        if: ${{ github.event_name != 'workflow_run' && steps.ci_verdict.outputs.green != 'true' }}
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          cargo xtask ci

      - name: Build distribution archives
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          cargo xtask dist

      - name: Authenticate to crates.io
        if: ${{ github.event_name == 'push' }}
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        if: ${{ github.event_name == 'push' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          set -euo pipefail
          version="$(cargo pkgid -p rimz | sed 's/.*#//')"
          if curl -fsS -H 'User-Agent: rimz-release' "https://crates.io/api/v1/crates/rimz/${version}" >/dev/null; then
            echo "rimz ${version} already published"
          else
            # cargo xtask dist already refreshed the gitignored pricing snapshot
            # force-included by Cargo's package include list; --allow-dirty is
            # required because cargo otherwise rejects that ignored included file.
            cargo publish -p rimz --allow-dirty
          fi

      - name: Resolve release identity
        shell: bash
        env:
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # The push trigger is tags-only, so this is a `v*` version tag.
            tap="${owner}/${GITHUB_REPOSITORY#*/}"
            release_tag="${GITHUB_REF_NAME}"
            release_title="RimZ ${GITHUB_REF_NAME}"
            release_prerelease=false
            release_rolling=false
            release_commit="${GITHUB_SHA}"
            # The release body is the runtime-generated place the concrete tap
            # host is allowed to appear; it is built from ${GITHUB_SERVER_URL},
            # never hardcoded in tracked source. The 4-space indent renders the
            # command as a code block in the release notes.
            release_body="$(printf 'Release %s at %s.\n\nInstall with Homebrew:\n\n    brew install %s/%s\n' \
              "${GITHUB_REF_NAME}" "${release_commit}" "${tap}" "${GITHUB_REPOSITORY#*/}")"
          else
            # workflow_run (CI green on the default branch) or manual dispatch:
            # the rolling build published under a moving `latest-main` tag.
            release_tag="latest-main"
            release_title="RimZ (latest main)"
            release_prerelease=true
            release_rolling=true
            release_commit="${WORKFLOW_RUN_HEAD_SHA:-$GITHUB_SHA}"
            release_body="Rolling build from the default branch at ${release_commit}."
          fi

          {
            echo "RELEASE_TAG=${release_tag}"
            echo "RELEASE_TITLE=${release_title}"
            echo "RELEASE_PRERELEASE=${release_prerelease}"
            echo "RELEASE_ROLLING=${release_rolling}"
            echo "RELEASE_COMMIT=${release_commit}"
            echo "RELEASE_BODY<<RIMZ_RELEASE_BODY"
            printf '%s\n' "${release_body}"
            echo "RIMZ_RELEASE_BODY"
          } >> "$GITHUB_ENV"

      - name: Move rolling release tag
        if: ${{ env.RELEASE_ROLLING == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "actions@rimio.ai"
          git tag -f "$RELEASE_TAG" "$RELEASE_COMMIT"
          git push origin "refs/tags/${RELEASE_TAG}" --force

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          dist_dir="${CARGO_TARGET_DIR}/dist"
          assets=("${dist_dir}/SHA256SUMS")
          while read -r _ asset_name; do
            assets+=("${dist_dir}/${asset_name}")
          done < "${dist_dir}/SHA256SUMS"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$RELEASE_PRERELEASE" = "true" ]; then
              gh release edit "$RELEASE_TAG" \
                --title "$RELEASE_TITLE" \
                --notes "$RELEASE_BODY" \
                --target "$RELEASE_COMMIT" \
                --prerelease
            else
              gh release edit "$RELEASE_TAG" \
                --title "$RELEASE_TITLE" \
                --notes "$RELEASE_BODY" \
                --target "$RELEASE_COMMIT" \
                --prerelease=false
            fi
          else
            if [ "$RELEASE_PRERELEASE" = "true" ]; then
              gh release create "$RELEASE_TAG" \
                --title "$RELEASE_TITLE" \
                --notes "$RELEASE_BODY" \
                --target "$RELEASE_COMMIT" \
                --prerelease
            else
              gh release create "$RELEASE_TAG" \
                --title "$RELEASE_TITLE" \
                --notes "$RELEASE_BODY" \
                --target "$RELEASE_COMMIT"
            fi
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

      # Tags only: the rolling `latest-main` prerelease never touches the tap.
      # The push trigger is tags-only in this workflow, so `event_name == push`
      # selects real `v*` releases.
      - name: Publish Homebrew tap formula
        if: ${{ github.event_name == 'push' }}
        env:
          TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        shell: bash
        run: |
          export PATH="/usr/local/cargo/bin:/usr/local/bin:$PATH"
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          tap_url="${GITHUB_SERVER_URL}/${owner}/homebrew-rimz.git"
          tap_dir="$(mktemp -d)"
          # Git-over-HTTPS wants Basic auth (username + PAT-as-password); the
          # API-style `token` scheme is rejected and git falls back to an
          # interactive prompt, which dies in CI. Mask the base64 form since
          # only the raw secret is auto-masked.
          basic_auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          printf '::add-mask::%s\n' "$basic_auth"
          auth_header="Authorization: Basic ${basic_auth}"

          git -c "http.extraheader=${auth_header}" clone --depth 1 "$tap_url" "$tap_dir"

          RIMZ_BREW_VERSION="${GITHUB_REF_NAME}" \
          RIMZ_BREW_BASE_URL="${GITHUB_SERVER_URL}/${owner}/${repo}/releases/download/${GITHUB_REF_NAME}" \
          RIMZ_BREW_HOMEPAGE="${GITHUB_SERVER_URL}/${owner}/${repo}" \
          RIMZ_BREW_OUT="${tap_dir}/Formula/rimz.rb" \
            cargo xtask brew-formula

          git -C "$tap_dir" config user.name "github-actions[bot]"
          git -C "$tap_dir" config user.email "actions@rimio.ai"
          git -C "$tap_dir" add Formula/rimz.rb
          if git -C "$tap_dir" diff --cached --quiet; then
            echo "formula already up to date"
          else
            git -C "$tap_dir" commit -m "rimz ${GITHUB_REF_NAME}"
            git -C "$tap_dir" -c "http.extraheader=${auth_header}" push origin HEAD
          fi
