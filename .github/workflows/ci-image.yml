name: CI image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: image tag (defaults to date+sha)
        required: false
      tag_only:
        description: push only the tag and leave rimz-ci:latest where it is
        type: boolean
        default: false
  schedule:
    # Weekly refresh keeps the baked RustSec DB and Cargo registry warm.
    - cron: "0 4 * * 1"
  push:
    branches: [main]
    paths:
      - ci/Dockerfile
      - rust-toolchain.toml
      - .github/workflows/ci-image.yml
  pull_request:
    paths:
      - ci/Dockerfile
      - rust-toolchain.toml
      - .github/workflows/ci-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build and publish rimz-ci
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      # Publishes serialize on one non-cancelling lane; PR validation builds key
      # per-ref and cancel stale runs.
      group: ci-image-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'publish' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image ref
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          TAG_ONLY: ${{ inputs.tag_only }}
        run: |
          set -euo pipefail
          host="ghcr.io"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="${REQUESTED_TAG:-$(date +%Y%m%d)-${GITHUB_SHA::7}}"
          if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::invalid Docker tag: ${tag}"
            exit 1
          fi
          echo "REGISTRY_HOST=$host" >> "$GITHUB_ENV"
          echo "IMAGE=${host}/${owner}/rimz-ci:${tag}" >> "$GITHUB_ENV"
          # A tag-only build is a branch image: LATEST_IMAGE stays unset so no
          # later step tags or pushes `latest`, and the tag itself may not be it.
          if [ "$TAG_ONLY" = "true" ]; then
            if [ "$tag" = "latest" ]; then
              echo "::error::tag_only leaves rimz-ci:latest alone; pass a tag other than latest"
              exit 1
            fi
          else
            echo "LATEST_IMAGE=${host}/${owner}/rimz-ci:latest" >> "$GITHUB_ENV"
          fi

      - name: Build and push image
        env:
          TOKEN: ${{ github.token }}
          # Push on dispatch/schedule/push-to-main; pull_request only validates the build.
          PUSH: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          if [ "$PUSH" = "true" ]; then
            auth_dir="${RUNNER_TEMP:-/tmp}/registry-auth"
            mkdir -p "$auth_dir/docker"
            export DOCKER_CONFIG="$auth_dir/docker"
            export REGISTRY_AUTH_FILE="$auth_dir/auth.json"
            echo "$TOKEN" | docker login "$REGISTRY_HOST" -u "$GITHUB_ACTOR" --password-stdin
          fi
          # The token reaches cargo-binstall as a build secret, lifting its
          # GitHub API resolution off the 60-per-hour anonymous quota that
          # shared runner egress addresses exhaust. A secret mount keeps it out
          # of image history, where --build-arg would leave it.
          tags=(-t "$IMAGE")
          if [ -n "${LATEST_IMAGE:-}" ]; then
            tags+=(-t "$LATEST_IMAGE")
          fi
          docker build --pull -f ci/Dockerfile \
            --secret id=github_token,env=TOKEN \
            "${tags[@]}" .
          if [ "$PUSH" = "true" ]; then
            docker push "$IMAGE"
            if [ -n "${LATEST_IMAGE:-}" ]; then
              docker push "$LATEST_IMAGE"
            fi
          fi

      - name: Publish summary
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          {
            if [ "$IS_PR" = "true" ]; then
              echo "### Validated CI image build (not pushed)"
            else
              echo "### Published CI image"
            fi
            echo
            echo "- \`${IMAGE}\`"
            if [ "$IS_PR" != "true" ] && [ -n "${LATEST_IMAGE:-}" ]; then
              echo "- \`${LATEST_IMAGE}\`"
            fi
            # Sizes are the unpacked layers on the builder, newest layer first;
            # a pull moves the compressed form, so compare builds, not bytes.
            docker image inspect --format '{{.Size}}' "$IMAGE" |
              awk '{ printf "\nTotal size: %.1f MB (unpacked)\n\n", $1 / 1e6 }'
            echo "| MB | Layer |"
            echo "|---:|---|"
            docker history --no-trunc --human=false --format '{{.Size}}{{"\t"}}{{.CreatedBy}}' "$IMAGE" |
              awk -F '\t' '$1 > 0 {
                cmd = $2
                sub(/^RUN (\|[0-9]+ .* )?\/bin\/sh -c /, "RUN ", cmd)
                sub(/ # buildkit$/, "", cmd)
                gsub(/`/, "\047", cmd)
                cmd = substr(cmd, 1, 120)
                gsub(/\|/, "\\|", cmd)
                printf "| %.1f | `%s` |\n", $1 / 1e6, cmd
              }'
          } | tee -a "$GITHUB_STEP_SUMMARY"
