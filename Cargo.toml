[workspace]
members = ["crates/rimz", "crates/rimz-presence-zellij", "xtask"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/rimio-ai/rimz"
# True floor for the current lock: libsqlite3-sys 0.38.1 (via rusqlite 0.40,
# bundled sqlite) uses the cfg_select! macro, stable since Rust 1.95 — above the
# let-chains/dep-declared 1.88. Verify with `cargo +1.95 check --locked`.
rust-version = "1.95"
version = "0.4.0"

[workspace.lints.clippy]
# Stdout is the protocol surface. Library code must use `tracing`; legal
# stdout sites carry `#[expect(clippy::print_stdout, reason = "...")]`.
print_stdout = "deny"
# Same logic for stderr — diagnostics go through `tracing`, not `eprintln!`.
print_stderr = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Core runtime
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
dotenvy = "0.15"
# `rimz config` probes unknown keys through the serde model so the editable key
# surface stays derived from the real config structs instead of a hand-mirrored
# schema. The crate is a tiny visitor wrapper over serde deserializers and adds
# no transitive dependencies beyond serde.
serde_ignored = "0.1"
toml = "1"
flate2 = "1"
# Release archives are streamed through gzip and extracted in-process by
# `rimz update`. `tar` supplies the mature archive parser and path handling;
# default xattr support stays off because the updater extracts one executable.
tar = { version = "0.4", default-features = false }
# OpenCode stores usage and Cursor stores live chat roots in WAL SQLite
# databases; adapters open both read-only. `bundled` keeps RimZ independent of
# a system libsqlite3 at install time.
rusqlite = { version = "0.40.1", features = ["bundled"] }
# Cursor's version-pinned chat root is protobuf. The decoder reads only the one
# repeated pending-call field instead of owning a wire parser.
prost = "0.14"
# Format-preserving TOML edits for `rimz config set`; keeps the generated
# config template's comments intact while changing one key.
toml_edit = { version = "0.25", features = ["serde"] }
# Zellij stores plugin permission grants as KDL (`permissions.kdl`). RimZ seeds
# its own presence-plugin grant by parsing and merging that shared file instead
# of string-splicing a format Zellij itself owns.
kdl = "4.7.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Identifiers and time
uuid = { version = "1", features = ["v7", "serde"] }
jiff = { version = "0.2", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive", "env", "unstable-ext", "wrap_help"] }
# Dynamic completion is still feature-gated as unstable, so pin its API until
# clap stabilizes the environment-driven engine.
clap_complete = { version = "=4.6.7", features = ["unstable-dynamic"] }
# Layout launch flags are authored as shell-like strings in TOML but launched as
# direct argv, so RimZ needs quote removal without invoking a shell. `shlex` is a
# tiny POSIX-compatible splitter already present through the build graph and
# vetted for deploy; making it direct avoids a bespoke parser on a launch path.
shlex = "2"

# Terminal geometry probe — the launch paths read the invoking terminal's
# width once to pick the sidebar's birth size (fixed cap vs percentage).
# Already in the tree transitively via clap's `wrap_help`; trivial API.
terminal_size = "0.4"

# Human-facing CLI presentation (`cli/render`). `anstyle` is the styling
# primitive and `anstream` the auto-detecting stdout adapter that strips ANSI
# when output is piped or color is disabled (it honors NO_COLOR/CLICOLOR/
# CLICOLOR_FORCE and TTY), so `--json` and snapshot output stay byte-clean while
# interactive runs get color; `colorchoice` carries the `--color` override into
# anstream's global. `unicode-width` measures display columns so the borderless
# auto-fit tables align under wide glyphs. This is the clap-native styling stack
# (the same one cargo and ripgrep use) and every one of these crates is already
# in the tree transitively through clap — promoting them to direct deps adds
# zero footprint. Writing through anstream uses `writeln!`, matching the
# existing `print_json` stdout path, so the `print_stdout` lint still guards the
# protocol surface.
anstyle = "1"
anstream = "1"
colorchoice = "1"
unicode-width = "0.2"

# Hook consent diffs — `similar` gives a minimal line-level unified diff for
# the config install gate. It is already in the tree transitively via `insta`;
# making it direct lets the user-visible security diff use the library rather
# than a hand-rolled approximation.
# Held on 2.x because `insta` still requires `similar ^2`; bump with insta to avoid a duplicate tree entry.
similar = { version = "2", features = ["unicode"] }

# HTTP — pricing refresh: the runtime LiteLLM/models.dev fetch and the
# release-time generated snapshot both GET static JSON documents. `ureq` is a
# small, synchronous, rustls-backed client — the right shape for a one-shot
# background fetch and an xtask, with no async-runtime drag.
ureq = "3"
url = "2"
# Codex app-server daemon control sockets speak RFC6455 WebSocket over a Unix
# stream. `tungstenite` supplies the handshake, framing, ping/pong, close, and
# fragmentation state machine over any `Read + Write`; hand-rolling that would
# put protocol correctness on RimZ for a transport that must fail safe. Default
# features are enough here; TLS stays out because the stream is UDS-local.
tungstenite = "0.29"

# Off-box error/event reporting. RimZ `warn!`/`error!` and observed agent
# rate-limit/overload conditions surface in a Sentry project an operator can
# watch. The rimz crate marks these deps optional behind its non-default
# `sentry` feature, so shipped binaries exclude the reporting code and this
# transitive tree entirely. `sentry` rides its `ureq` transport so it reuses the
# same small, synchronous, rustls-backed HTTP client RimZ already pins — no
# second TLS stack, no async-runtime drag — and the init guard flushes on drop,
# which fits the short-lived hook subprocesses. `panic` and `backtrace` capture
# process panics with stacks; `contexts` is deliberately omitted so the Apple
# `objc2` UIKit binding tree never links into the shipped binary. With the
# feature compiled in, no DSN means no client and no network. `sentry-tracing`
# bridges the existing `tracing` subscriber so every diagnostic event becomes a
# Sentry event without a parallel API. Its transitive tree (sentry-*,
# `url`/`idna`/`icu`, `rand`) is covered by the imported cargo-vet audit sets in
# `supply-chain/config.toml`.
sentry = { version = "0.48", default-features = false, features = [
    "backtrace",
    "panic",
    "ureq",
] }
sentry-tracing = "0.48"

# Filesystem and locking
tempfile = "3"
# Worktree seeding — `.worktreeinclude` lists glob patterns whose matches are
# copied from the checkout into a freshly created worktree. `glob` expands a
# pattern against the filesystem, descending only the directories the pattern
# names (`.env` stats one path, `config/*.toml` lists one directory) instead of
# walking the whole repo the way a matcher-plus-walker (`globset` + `walkdir`)
# would. It is the minimal, std-only, widely-vetted choice for pattern→paths
# expansion and brings no transitive tree; `Pattern::escape` roots user patterns
# under the project directory safely even when that path holds glob metacharacters.
glob = "0.3"
# Filesystem-event watch — the elder sidebar tails live Codex rollout files so
# a mid-turn token update repaints on the write instead of the next producer
# tick. `notify` is the standard cross-platform watcher (inotify/kqueue/
# ReadDirectoryChanges) behind one small API. Used only as a latency hint over
# the existing stat-gated refresh: every init or event error is fail-soft to the
# tick backstop, never on a correctness path.
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }

# Hashing
foldhash = "0.2"
sha2 = "0.11"
# Cursor names each chat bucket with the MD5 of its exact workspace path.
# RustCrypto supplies that provider wire primitive; it is not used for security.
md5 = { package = "md-5", version = "0.11" }
hex = "0.4"
# Pet sprite sheets are WebP or PNG. `image-webp` is decode-only-capable, pure
# Rust, and avoids libwebp C bindings for the built-in Codex CDN asset cache.
image-webp = "0.2"
# Petdex pets may ship PNG sheets (for example `goose-default`). `png` is
# pure Rust and keeps RimZ off the full `image` crate tree.
png = "0.18"
# Event-log frame checksum: hardware CRC32 for the per-frame validate and the
# repair scan. Already in the tree through flate2 and already carries a
# supply-chain exemption, so the direct dep adds zero footprint.
crc32fast = "1"

# OS integration (cfg(unix))
nix = { version = "0.31", features = ["feature", "fs", "hostname", "poll", "process", "signal", "socket", "term", "user"] }
# Safe FIONREAD wraps the best-effort ignored-stdin hint without admitting
# unsafe code into the binary; rustix 1.x is already in the dependency tree.
rustix = "1"
# Held on 0.3 because `crossterm` 0.29 (via ratatui) requires `^0.3.17`; bump when that line moves.
signal-hook = "0.3"

# Process detection
which = "8"

# Sidebar terminal UI — `crossterm` is supplied transitively by ratatui's
# `crossterm_0_29` feature; no direct dep needed.
ratatui = "0.30"

# Test-time
insta = { version = "1", features = ["json", "yaml", "filters"] }
proptest = "1"
assert_cmd = "2"
predicates = "3"
vt100 = "0.16"
portable-pty = "0.9"
# Performance benches. Dev-only: a small modern harness with built-in
# allocation profiling, so the cost model can be regenerated without linking
# bench machinery into shipped artifacts.
divan = "0.1"

# Full debuginfo is the bulk of link time and on-disk artifact size for our own
# crates, which relink constantly. `line-tables-only` keeps backtraces with
# file/line while dropping the variable/type debuginfo a CLI never inspects;
# `unpacked` keeps that debuginfo out of the linked image so the linker moves
# less. Both cut the dev loop without touching correctness.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Optimized like release but with line-tables debug info, for perf/samply
# profiling. Built by `cargo xtask profile-build`, output in target/profiling/.
# force-frame-pointers and symbol-mangling-version=v0 come from xtask RUSTFLAGS.
# Release strips symbols for shipped artifacts; profiling restores them.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# Keep release arithmetic fail-fast: a sidebar width/count underflow should
# panic at the faulting expression and enter the normal recovery/diagnostic
# path rather than wrap into a huge allocation and abort silently. Shipped
# artifacts are symbol-stripped and thin-LTO'd to keep install size down and
# retain cross-unit optimization. Sixteen codegen units let the 236k-line `rimz`
# leaf crate use available cores; one unit serialized release rebuilds to one
# core for roughly 2-4 minutes.
[profile.release]
overflow-checks = true
strip = "symbols"
lto = "thin"
codegen-units = 16

# The integration suite spawns the `rimz` binary hundreds of times; an
# unoptimized dependency tree (serde, clap, jiff, ratatui) dominates per-spawn
# startup. Optimize dependencies even in dev/test builds — they
# compile once and cache — while leaving our own crates at opt-level 0 so
# incremental rebuilds and debugging stay fast.
[profile.dev.package."*"]
opt-level = 2
