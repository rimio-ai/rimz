[workspace]
members = ["crates/rimz", "crates/rimz-presence-zellij", "xtask"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rimz/rimz"
version = "0.0.0"

[workspace.lints.clippy]
# Stdout is the protocol surface. Library code must use `tracing`; legal
# stdout sites carry `#[expect(clippy::print_stdout, reason = "...")]`.
print_stdout = "deny"
# Same logic for stderr — diagnostics go through `tracing`, not `eprintln!`.
print_stderr = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Core runtime
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Identifiers and time
uuid = { version = "1", features = ["v7", "serde"] }
jiff = { version = "0.2", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# Terminal geometry probe — the launch paths read the invoking terminal's
# width once to pick the sidebar's birth size (fixed cap vs percentage).
# Already in the tree transitively via clap's `wrap_help`; trivial API.
terminal_size = "0.4"

# Hook consent diffs — `similar` gives a minimal line-level unified diff for
# the config install gate. It is already in the tree transitively via `insta`;
# making it direct lets the user-visible security diff use the library rather
# than a hand-rolled approximation.
similar = "2"

# HTTP — pricing refresh: the runtime LiteLLM/models.dev fetch and the
# build-time embed both GET a static JSON document. `ureq` is a small,
# synchronous, rustls-backed client — the right shape for a one-shot
# background fetch and a build script, with no async-runtime drag.
ureq = "3"

# Filesystem and locking
fs4 = { version = "1", features = ["sync"] }
tempfile = "3"
# Filesystem-event watch — the elder sidebar tails live Codex rollout files so
# a mid-turn token update repaints on the write instead of the next producer
# tick. `notify` is the standard cross-platform watcher (inotify/kqueue/
# ReadDirectoryChanges) behind one small API. Used only as a latency hint over
# the existing stat-gated refresh: every init or event error is fail-soft to the
# tick backstop, never on a correctness path.
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }

# Hashing
sha2 = "0.11"
hex = "0.4"
# Event-log frame checksum: hardware CRC32 for the per-frame validate and the
# repair scan. Already in the tree transitively (ureq -> flate2) and already
# carries a supply-chain exemption, so the direct dep adds zero footprint.
crc32fast = "1"

# OS integration (cfg(unix))
nix = { version = "0.31", features = ["feature", "fs", "signal", "socket", "user"] }

# Process detection
which = "8"

# Sidebar terminal UI — `crossterm` is supplied transitively by ratatui's
# `crossterm_0_29` feature; no direct dep needed.
ratatui = "0.30"
# Post-render color effects on the ratatui buffer — the attention glow and the
# one-shot transition cues. Default features off drops the effect-DSL parser
# tree; the runtime pass is truecolor-gated in the renderer.
tachyonfx = { version = "0.25", default-features = false, features = ["std-duration"] }

# Test-time
insta = { version = "1", features = ["json", "yaml", "filters"] }
proptest = "1"
assert_cmd = "2"
predicates = "3"
vt100 = "0.16"
portable-pty = "0.9"

# Full debuginfo is the bulk of link time and on-disk artifact size for our own
# crates, which relink constantly. `line-tables-only` keeps backtraces with
# file/line while dropping the variable/type debuginfo a CLI never inspects;
# `unpacked` keeps that debuginfo out of the linked image so the linker moves
# less. Both cut the dev loop without touching correctness.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# The integration suite spawns the `rimz` binary hundreds of times; an
# unoptimized dependency tree (serde, clap, jiff, ratatui) dominates per-spawn
# startup. Optimize dependencies even in dev/test builds — they
# compile once and cache — while leaving our own crates at opt-level 0 so
# incremental rebuilds and debugging stay fast.
[profile.dev.package."*"]
opt-level = 2
