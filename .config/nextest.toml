# Nextest configuration.
#
# Live Zellij tests each spawn a real `zellij` server, isolated on a per-test
# `XDG_RUNTIME_DIR` (see crates/rimz/tests/integration/backend/zellij.rs and
# journey/deep.rs). That per-test runtime dir is what removed the old
# machine-global flock and lets separate worktrees run these tests with zero
# shared state — no lock to serialize on, no cross-worktree starvation.
#
# Real zellij servers are heavy, though. Empirically ~8 concurrent on an 8-core
# host starve each other's startup, while ~4 stay healthy. The cap is per *run*
# (each nextest process gets its own budget), so two worktrees running the suite
# at once put ~2× the cap of servers on the machine. Capping at 2 lands that
# headline two-worktree scenario at the safe ~4-server level rather than 8, and
# still beats the old flock, which serialized these tests to one at a time even
# within a single run. This is per-run accounting, NOT a shared lock: the
# worktrees never block on each other.
#
# Server count is not the whole load story. The live tests are latency-sensitive
# — each spawns a `zellij`/`tmux` CLI client that must round-trip to its server
# within a deadline — so the CI layout matters too. Each CI job now runs on its
# own 64-core runner, so workflows leave nextest's global thread count uncapped.
# The binding concurrency control is the per-run live server caps in
# `[test-groups]`, not `NEXTEST_TEST_THREADS`.
#
# Retries absorb the startup races that slip through under load (a different
# test each time — momentary contention, not a real failure): a starved runner
# can kill a live server mid-test ("There is no active session!"), and the whole
# test phase is one sustained-load window only tens of seconds wide. So the
# retry budget spans that window with exponential backoff rather than a few
# fixed-3s tries that all land in the same bad patch — a later attempt fires
# once the suite's heavy phase has passed. The `query-tab-names` /
# command-metadata spawn waits in the tests keep the first-try races rare. The
# deep journey zellij smoke joins the group so the cap bounds the total.
#
# Live tmux servers are far lighter (one `tmux` process per tempdir socket, no
# wasm plugin host), so their cap is generous; the group exists to give tmux's
# live tests the same retry tolerance for the occasional under-load startup race
# the Zellij group already absorbs. The deep journey tmux smoke joins the group
# too, mirroring its Zellij twin, so an under-load blip retries instead of
# failing the run outright.
[test-groups]
live-zellij = { max-threads = 2 }
live-tmux = { max-threads = 4 }
# Rendered journeys each run a real `rimz sidebar serve` process over a PTY. The
# full journey sweep now covers the dashboard, rate-limit recovery, selection,
# remote badge, and resume paths, so cap this tier like the live-mux tier instead
# of starting every renderer at once.
rendered-journey = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'package(rimz) & (test(/^backend::zellij::/) | test(/^backend::single_backend_room::/) | test(/^journey::deep::zellij/))'
test-group = 'live-zellij'
retries = { backoff = "exponential", count = 4, delay = "3s", max-delay = "30s", jitter = true }

[[profile.default.overrides]]
filter = 'package(rimz) & (test(/^backend::tmux::/) | test(/^journey::deep::tmux/))'
test-group = 'live-tmux'
retries = { backoff = "exponential", count = 4, delay = "3s", max-delay = "30s", jitter = true }

# Rendered journeys are as latency-sensitive as the live-mux tiers — each polls
# a real `rimz sidebar serve` process over a PTY for a rendered frame within a
# deadline — so a starved runner can stall a render past the budget during the
# suite's heavy phase. Give them the same retry budget so an under-load render
# race fires a later attempt once that phase has passed instead of failing the
# run outright, mirroring the live mux groups above.
[[profile.default.overrides]]
filter = 'package(rimz) & test(/^journey::/) & not test(/^journey::deep::/)'
test-group = 'rendered-journey'
retries = { backoff = "exponential", count = 4, delay = "3s", max-delay = "30s", jitter = true }

# `gate` is the fast pre-PR subset: everything except the live-backend and
# journey tiers. The perf tier stays in this profile because it is deterministic
# and fast. Escalate to the full suite (`cargo xtask ci` / explicit filters)
# when a change touches the excluded surfaces.
[profile.gate]
default-filter = 'not (package(rimz) & (test(/^backend::tmux::/) | test(/^backend::zellij::/) | test(/^backend::single_backend_room::/) | test(/^journey::/)))'

# `live` runs both mux backends in one nextest process, letting tmux and Zellij
# co-schedule on 64-core CI while each stays bounded by its per-backend group.
# Together, `live` and `journey` are the exact complement of `gate`.
# Inherits the live-server groups and the retry budget from `default`.
[profile.live]
default-filter = 'package(rimz) & (test(/^backend::tmux::/) | test(/^backend::zellij::/) | test(/^backend::single_backend_room::/) | test(/^journey::deep::/))'

# CI runs `journey` as its own step after `live`; the deep mux smokes ride in
# `live` so the per-backend groups bound their real-server load.
[profile.journey]
default-filter = 'package(rimz) & test(/^journey::/) & not test(/^journey::deep::/)'
