# Nextest configuration.
#
# Live Zellij tests each spawn a real `zellij` server, isolated on a per-test
# `XDG_RUNTIME_DIR` (see crates/rimz/tests/integration/backend/zellij.rs and
# journey/deep.rs). That per-test runtime dir is what removed the old
# machine-global flock and lets separate worktrees run these tests with zero
# shared state — no lock to serialize on, no cross-worktree starvation.
#
# Real zellij servers are heavy, though. Empirically ~8 concurrent on an 8-core
# host starve each other's startup, while ~4 stay healthy. The cap is per *run*
# (each nextest process gets its own budget), so two worktrees running the suite
# at once put ~2× the cap of servers on the machine. Capping at 2 lands that
# headline two-worktree scenario at the safe ~4-server level rather than 8, and
# still beats the old flock, which serialized these tests to one at a time even
# within a single run. This is per-run accounting, NOT a shared lock: the
# worktrees never block on each other.
#
# CI multiplies that aggregate beyond two worktrees. The shared self-hosted
# runner executes several `cargo llvm-cov nextest` jobs at once — a push and its
# pull_request land in different concurrency groups (sha vs ref), so the same
# commit verifies twice over, and back-to-back landings stack a third. Coverage
# instrumentation also makes every live server cost more CPU than the plain
# `nextest` the ~4-safe figure was measured under, so the real ceiling is lower
# there. The `ci` profile pins the Zellij cap to one server per run: N concurrent
# coverage jobs then put ~N live servers on the host instead of 2N, holding the
# aggregate inside the safe envelope no matter how the events overlap. `coverage`
# in xtask selects it (`-P ci`); local `nextest`/`test` keep the cap-2 default.
#
# Server count is only half the load story. The live tests are latency-sensitive
# — each spawns a `zellij`/`tmux` CLI client that must round-trip to its server
# within a deadline — so they also starve when the box is CPU-oversubscribed,
# which two full instrumented suites running at once on the shared runner cause
# regardless of how few servers each holds. The CI workflow caps
# `NEXTEST_TEST_THREADS` to half the runner's cores for exactly this reason: two
# concurrent runs then sum to ~one box's worth of test threads, leaving the
# round-trips enough CPU to meet their deadlines (see .github/workflows/ci.yml).
#
# Retries absorb the startup races that slip through under load (a different
# test each time — momentary contention, not a real failure): a starved runner
# can kill a live server mid-test ("There is no active session!"), and the whole
# test phase is one sustained-load window only tens of seconds wide. So the
# retry budget spans that window with exponential backoff rather than a few
# fixed-3s tries that all land in the same bad patch — a later attempt fires
# once the suite's heavy phase has passed. The `query-tab-names` /
# command-metadata spawn waits in the tests keep the first-try races rare. The
# deep journey zellij smoke joins the group so the cap bounds the total.
#
# Live tmux servers are far lighter (one `tmux` process per tempdir socket, no
# wasm plugin host), so their cap is generous; the group exists to give tmux's
# live tests the same retry tolerance for the occasional under-load startup race
# the Zellij group already absorbs. The deep journey tmux smoke joins the group
# too, mirroring its Zellij twin, so an under-load blip retries instead of
# failing the run outright.
[test-groups]
live-zellij = { max-threads = 2 }
# The coverage-run cap: one live Zellij server per run, so overlapping CI jobs on
# the shared runner sum to ~N servers across N runs rather than 2N.
live-zellij-ci = { max-threads = 1 }
live-tmux = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'package(rimz) & (test(/^backend::zellij::/) | test(/^journey::deep::zellij/))'
test-group = 'live-zellij'
retries = { backoff = "exponential", count = 4, delay = "3s", max-delay = "30s", jitter = true }

[[profile.default.overrides]]
filter = 'package(rimz) & (test(/^backend::tmux::/) | test(/^journey::deep::tmux/))'
test-group = 'live-tmux'
retries = { backoff = "exponential", count = 4, delay = "3s", max-delay = "30s", jitter = true }

# CI runs under coverage instrumentation on a shared runner; `coverage` selects
# this profile with `-P ci`. It inherits everything from `default` and remaps
# only the Zellij live group onto the cap-1 `live-zellij-ci` group so concurrent
# coverage jobs cannot stack two servers each. The tmux override and the retry
# budget carry over from `default` through profile inheritance.
[profile.ci]

[[profile.ci.overrides]]
filter = 'package(rimz) & (test(/^backend::zellij::/) | test(/^journey::deep::zellij/))'
test-group = 'live-zellij-ci'
retries = { backoff = "exponential", count = 4, delay = "3s", max-delay = "30s", jitter = true }
