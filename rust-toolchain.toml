[toolchain]
channel = "stable"
components = ["rustfmt", "clippy", "llvm-tools-preview"]
# The Zellij presence plugin (`crates/rimz-presence-zellij`) compiles to WASI;
# rustup auto-installs the target from this list, so contributors and CI need
# no extra provisioning step.
targets = ["wasm32-wasip1", "aarch64-apple-darwin", "x86_64-apple-darwin"]
