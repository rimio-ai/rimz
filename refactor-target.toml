reason = "Synthetic-message composition, boundary attempts and recorded misses now belong to message::synthetic; cache_keepalive and auto_continue keep target resolution and assist records in cli. The two remote::web members manage SSH web tunnels, not messages: this callee-set family is not a shared workflow. Fleet and team report queue/settle/cancel choreography stays in cli to avoid new upward dependencies from message (pass 31a)."

[[verdict]]
kind = "guard"
key = "$0.wait_for_required.is_empty()"
reason = "One admission outcome read three ways: lsp::admission releases the queue ticket, cli/lsp_admission skips the wait report, cli/lsp bails with no matching root-markers before polling; each site owns what an empty wait list means (pass 28a, after pass 26a's review of lsp)."

[[verdict]]
kind = "guard"
key = "$0==Isolation::Host"
reason = "sandbox::preflight returns no probe for host; agents restart and subagents resume run the host-only process preflight. These remain separate decisions after sharing request construction; a predicate would only rename equality (pass 28a, reaffirmed pass 28f)."

[[verdict]]
kind = "guard"
key = "$0Some($1)=&$2.degraded"
reason = "A degraded posture is advisory in explain (a warning row), a stderr note in fork, and fatal in subagents resume; the reason string is shared and the outcome is each command's (pass 28a, reaffirmed pass 28f)."

