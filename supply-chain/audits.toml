[[audits.crc32fast]]
who = "GPT 6 Astra <noreply@openai.com>"
criteria = "safe-to-deploy"
delta = "1.5.1 -> 1.5.2"
notes = "AI source review by a GPT 6 Astra subagent verified both published archive SHA-256 values against the baseline and updated workspace lockfiles. Reviewed the complete archive delta, baseline implementation, existing fast-versus-slow property test and unchanged build.rs probe. The sole production change extracts the existing little-endian 16-byte CRC fold into fold_16 and uses it for remaining complete blocks before the bytewise tail. Both callers establish sufficient length; indices stay bounded against the unchanged 16-by-256 table. CRC complement handling is preserved. No new unsafe operation, dependency requirement or build behavior. Delta review from the existing exempted baseline, not a full baseline or dependency audit. No upstream test execution was performed for this source review."

