notes = "Reviewed the published crate delta, manifests, lockfile, VCS metadata and src/string.rs, including ValueMetrics::calculate and its formatting consumers. Archive SHA-256 values match the old and new workspace lockfile checksums. Quote-run counters now use Saturating<u8>, preventing overflow while preserving the consumers' zero and two thresholds. The scan remains linear and resets counters on other bytes. Remaining changes affect package inclusion paths, version, lint settings and development lockfile dependencies; build remains disabled. No new I/O or unsafe code is introduced. This is a delta review from the existing exempted version, not a full audit."

[[audits.ureq]]
who = "GPT 6 Astra <noreply@openai.com>"
criteria = "safe-to-deploy"
delta = "3.4.0 -> 3.4.2"
notes = "AI source review by a GPT 6 Astra subagent verified both published archive SHA-256 values against the baseline and updated workspace lockfiles. Reviewed every production/build delta and relevant TLS/transport context. Small JSON buffering retains read limits and excludes decompressed bodies from the Content-Length shortcut. Config and TlsConfig pool-sharing checks isolate incompatible settings in both directions; reuse rejects buffered surplus input. Phase budgets use recorded predecessors and reject expired I/O budgets. TLS handshakes move to connection establishment without changing certificate verification; this does not prove a strict decreasing wall-clock deadline across handshake I/O. TCP fallback broadens only to address-specific errors and preserves the last failure. No build script is enabled. The ureq-proto minimum rises to 0.6.3; that dependency is reviewed separately. Delta review from the existing exempted baseline, not a full baseline or dependency audit. No upstream test execution was performed for this source review."

[[audits.ureq-proto]]
who = "GPT 6 Astra <noreply@openai.com>"
criteria = "safe-to-deploy"
delta = "0.6.1 -> 0.6.4"
notes = "AI source review by a GPT 6 Astra subagent verified both published archive SHA-256 values against the baseline and updated workspace lockfiles. Reviewed every production/build delta, client/server context and regression assertions. Received Content-Length values must be numerically identical; signs, empty elements, conflicts and overflow are rejected. Outgoing analyzers require one numeric value. Invalid status codes return errors; empty-valued headers no longer drop subsequent headers. Header matching uses complete case-insensitive comma-separated tokens. Network-path redirects retain the scheme and parse the new authority; existing authorization/cookie removal applies to the resolved URI. ArrayVec insertion remains capacity-checked. No build script or new dependency is introduced. Delta review from the existing exempted baseline, not a full baseline or dependency audit. No upstream test execution was performed for this source review."

[[audits.uuid]]
who = "GPT 6 Astra <noreply@openai.com>"
criteria = "safe-to-deploy"
delta = "1.26.0 -> 1.26.1"
notes = "AI source review by a GPT 6 Astra subagent verified both published archive SHA-256 values against the baseline and updated workspace lockfiles. Reviewed every production delta, manifests, timestamp encoder and RNG context. Uuid::new_v7 counter alignment preserves version/variant fields, bounds shifts and retains the most significant 74 counter bits. Full-width counters now invoke the existing RNG and inherit its failure behavior. Timestamp-to-SystemTime conversion uses checked_add with UNIX_EPOCH fallback on overflow. Optional wasm RNG dependency requirements change, but that package is absent from the workspace lockfile and was not audited here. Build remains disabled; no unsafe code is introduced. Delta review from the existing exempted baseline, not a full baseline or dependency audit. No upstream test execution was performed for this source review."

