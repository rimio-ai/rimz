notes = "AI source review by a GPT 6.1 Sol subagent. Archive checksums verified against the workspace lockfile by cargo and independently matched using SHA-256. Reviewed the entire production delta in Cargo.toml, Cargo.toml.orig, src/block_api.rs, src/consts.rs, src/sha256.rs, src/sha512.rs, and every changed or removed AArch64, x86, RISC-V, and wasm SIMD backend file (1127 added/removed lines including source documentation and both manifests), plus dispatch and unsafe-load caller context. Changes: MSRV becomes 1.88; array-chunk APIs replace manual serialization and block splitting; SIMD loads are localized to helpers with correctly sized source regions, fixing round-constant pointer provenance; x86 SHA-256 scheduling is refactored; RISC-V unaligned input-load assembly is replaced by safe byte decoding and no longer requires zbkb/zbb; bounds-checked round-constant assembly loads are relocated. Reviewed changed unsafe loads/stores, pointer extents, alignment requirements, assembly constraints, CPU-feature dispatch, and odd/even block handling; no unsoundness identified in the delta. No new dependencies, build script, procedural macros, or new network/process/environment/filesystem capabilities. README and changelog changes were only skimmed; no upstream test or benchmark delta was present. Delta review from the existing audited baseline, not a full baseline or dependency audit. No upstream test execution was performed for this source review."

[[audits.signal-hook]]
who = "Opus 5.5 <noreply@anthropic.com>"
criteria = "safe-to-deploy"
delta = "0.3.18 -> 0.4.5"
notes = "AI source review by an Opus 5.5 subagent. Archive checksums verified against the workspace lockfile by cargo. Reviewed the complete package delta for signal-hook 0.3.18 -> 0.4.5: build.rs, Cargo.toml, src/low_level/pipe.rs, signal_details.rs, iterator/backend.rs, iterator/mod.rs, flag.rs, lib.rs, tests and example. The production changes move the pipe registration API from raw file descriptors to OwnedFd, which removes a manual close and fixes a double-close on unregister. register_raw now sets FD_CLOEXEC correctly. A hand-written 32-bit Android sigset fallback is replaced by sigemptyset/sigaddset, and Windows cfg gates are added. The remaining unsafe is the same fcntl/write/send libc calls as before, now in one helper, and net unsafe goes down. build.rs only adds a Windows skip around the existing optional cc compile of an unchanged extract.c. No new network, process, filesystem or proc-macro capability. Delta review from the existing exempted baseline, not a full baseline or dependency audit. No upstream test execution was performed for this source review."

