notes = "AI source review: a GPT 6.1 Sol subagent read the entire production delta (123 added/removed lines across Cargo.toml, Cargo.toml.orig and src/) with archive checksums matched against the workspace lockfile; Opus 5.5 adjudicated its one open concern. Changes: negative-zero parsing, finite f32 comparison and invalid-UTF-8 error-position fixes, equivalent arithmetic cleanup, and a new optional foldhash dependency. The unchanged build.rs only reads Cargo target cfg variables. No production unsafe change, network, process or filesystem access. Caveat: preserve_order no longer implies std; with preserve_order enabled and std disabled, src/map.rs selects foldhash::fast::RandomState, which its own docs say offers minimal HashDoS resistance. That is a documented opt-in for no_std builds, which lack a randomized std hasher; std builds keep the standard-library hasher, and this workspace builds serde_json with std and without preserve_order. Delta review from the existing audited baseline, not a full baseline or dependency audit. No upstream test execution was performed for this source review."

