[[audits.borsh]]
who = "GPT 6.1 Sol <noreply@openai.com>"
criteria = "safe-to-run"
delta = "1.5.7 -> 1.8.1"
notes = "AI source review by a GPT 6.1 Sol subagent. Archive checksums verified against the workspace lockfile by cargo and independently matched with sha256sum. Reviewed the whole production source delta and both Cargo manifests (178 added/deleted production-diff lines, including comments and manifest changes), plus the unchanged build.rs. Changes: add optional UUID byte serialization/deserialization, move address serialization/deserialization to core::net for no_std, update address schema type paths, keep bytes no_std unless std is enabled, update the derive dependency and MSRV, add no_std Error::other and accessor annotations, and simplify collection sorting and schema recursion checks. No unsafe changes or autonomous filesystem, process, or network operations were introduced; address types are serialized values, not connections, and I/O remains through caller-provided readers/writers. The unchanged build script only declares a cfg alias through cfg_aliases. Tests, licenses, and ancillary documentation were only skimmed. Delta review from the existing audited baseline, not a full baseline or dependency audit. No upstream test execution was performed for this source review."

[[audits.borsh-derive]]
who = "GPT 6.1 Sol <noreply@openai.com>"
criteria = "safe-to-run"
version = "1.8.1"
notes = "AI source review by a GPT 6.1 Sol subagent. Archive checksums verified against the workspace lockfile by cargo and independently matched with sha256sum. Reviewed all 2572 production src lines (including blank lines and comments), both Cargo manifests, all derive entry points, attribute parsing and validation, crate-name resolution, generic-parameter discovery, enum discriminants, and serialization/deserialization/schema token generation, including feature-gated schema code. Changes: this full version implements the three Borsh derives, custom crate and field function paths, skipped/default fields, bounds, initializer hooks, merged disjoint attributes with duplicate rejection, and schema helper types including Self replacement. No unsafe code or build script is present. The macro implementation performs token/AST processing, not direct filesystem, environment, network, or process operations. Default crate discovery delegates to proc-macro-crate, whose reviewed delta reads Cargo manifests and invokes Cargo locate-project; an explicit crate attribute bypasses that discovery. Generated code performs caller-selected serialization/schema operations and explicitly configured hooks, not hidden I/O. Union serialization/deserialization derive currently panics as unimplemented, a correctness limitation acceptable for safe-to-run. Tests, README, and licenses were only skimmed. Full source review of this version, not a dependency audit. No upstream test execution was performed for this source review."

