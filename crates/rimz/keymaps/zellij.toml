default_prefix = "Ctrl+g"
scrollback = "native"

[normal]
"Alt+j" = "card.next"
"Alt+k" = "card.prev"
"Alt+J" = "worktree.next"
"Alt+K" = "worktree.prev"
"Alt+?" = "filter.needs_you"
"Alt+n" = "palette.new_agent"
"Alt+1" = "card.slot.1"
"Alt+2" = "card.slot.2"
"Alt+3" = "card.slot.3"
"Alt+4" = "card.slot.4"
"Alt+5" = "card.slot.5"
"Alt+6" = "card.slot.6"
"Alt+7" = "card.slot.7"
"Alt+8" = "card.slot.8"
"Alt+9" = "card.slot.9"
"Alt+;" = "card.last"
"Alt+h" = "pane.focus.left"
"Alt+l" = "pane.focus.right"
"<prefix>" = "mode.prefix"

[prefix]
"<prefix>" = "mode.exit"
Esc = "mode.exit"
Enter = "mode.exit"
p = "mode.pane"
t = "mode.tab"
r = "mode.resize"
m = "mode.move"
s = "mode.scrollback"
d = "session.detach"
"/" = "palette.cards"
":" = "palette.commands"
x = "card.close"
u = "card.reopen"
"?" = "keys.help"

[pane]
h = "pane.focus.left"
j = "pane.focus.down"
k = "pane.focus.up"
l = "pane.focus.right"
Left = "pane.focus.left"
Down = "pane.focus.down"
Up = "pane.focus.up"
Right = "pane.focus.right"
p = "pane.focus.next"
n = "pane.split.right"
r = "pane.split.right"
d = "pane.split.down"
x = "card.close"
X = "pane.close"
f = "pane.zoom"
Esc = "mode.exit"
Enter = "mode.exit"

[tab]
h = "tab.prev"
k = "tab.prev"
Left = "tab.prev"
Up = "tab.prev"
l = "tab.next"
j = "tab.next"
Right = "tab.next"
Down = "tab.next"
n = "tab.new"
1 = "card.slot.1"
2 = "card.slot.2"
3 = "card.slot.3"
4 = "card.slot.4"
5 = "card.slot.5"
6 = "card.slot.6"
7 = "card.slot.7"
8 = "card.slot.8"
9 = "card.slot.9"
Esc = "mode.exit"
Enter = "mode.exit"

[resize]
h = "pane.resize.left"
j = "pane.resize.down"
k = "pane.resize.up"
l = "pane.resize.right"
Left = "pane.resize.left"
Down = "pane.resize.down"
Up = "pane.resize.up"
Right = "pane.resize.right"
Esc = "mode.exit"
Enter = "mode.exit"

[move]
h = "pane.swap.left"
j = "pane.swap.down"
k = "pane.swap.up"
l = "pane.swap.right"
Left = "pane.swap.left"
Down = "pane.swap.down"
Up = "pane.swap.up"
Right = "pane.swap.right"
Esc = "mode.exit"
Enter = "mode.exit"
