[normal]
"Alt+j" = "card.next"
"Alt+k" = "card.prev"
"Alt+J" = "worktree.next"
"Alt+K" = "worktree.prev"
"Alt+h" = "pane.focus.left"
"Alt+l" = "pane.focus.right"
"Alt+?" = "filter.needs_you"
"Alt+n" = "palette.new_agent"
"Alt+t" = "tab.new"
"Alt+1" = "card.slot.1"
"Alt+2" = "card.slot.2"
"Alt+3" = "card.slot.3"
"Alt+4" = "card.slot.4"
"Alt+5" = "card.slot.5"
"Alt+6" = "card.slot.6"
"Alt+7" = "card.slot.7"
"Alt+8" = "card.slot.8"
"Alt+9" = "card.slot.9"
"Alt+;" = "card.last"
"<prefix>" = "mode.prefix"

[prefix]
z = "pane.zoom"
p = "palette.commands"
"<prefix>" = "palette.commands"
"/" = "palette.cards"
s = "pane.split.down"
v = "pane.split.right"
h = "pane.focus.left"
j = "pane.focus.down"
k = "pane.focus.up"
l = "pane.focus.right"
H = "pane.swap.left"
J = "pane.swap.down"
K = "pane.swap.up"
L = "pane.swap.right"
r = "mode.resize"
"[" = "mode.scrollback"
"," = "tab.prev"
"." = "tab.next"
x = "card.close"
X = "pane.close"
u = "card.reopen"
d = "session.detach"
"?" = "keys.help"
Esc = "mode.exit"

[resize]
h = "pane.resize.left"
j = "pane.resize.down"
k = "pane.resize.up"
l = "pane.resize.right"
Esc = "mode.exit"
Enter = "mode.exit"

[move]
h = "pane.swap.left"
j = "pane.swap.down"
k = "pane.swap.up"
l = "pane.swap.right"
Esc = "mode.exit"
Enter = "mode.exit"
