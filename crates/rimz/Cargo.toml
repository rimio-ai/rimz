[package]
name = "rimz"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Integration tests live in one binary (`tests/integration/`), not flat
# `tests/*.rs` targets — disable auto-discovery and declare it explicitly.
autotests = false

[lib]
name = "rimz"
path = "src/lib.rs"

[[bin]]
name = "rimz"
path = "src/main.rs"

# Test-only fixture: a `zellij`-shaped shim that records argv and exits 0.
# Used by `tests/integration/backend/zellij.rs` to verify the wakeup walk
# dispatches the broadcast pipe without needing a live Zellij to receive it.
[[bin]]
name = "zellij-trace"
path = "tests/fixtures/zellij-trace/main.rs"
required-features = []
test = false
bench = false

# Test-only fixture: a `codex app-server`-shaped JSON-RPC stub. Used by
# `tests/integration/hooks.rs` to exercise `rimz codex refresh-context` without
# the real `codex` binary (pointed at via `RIMZ_CODEX_BIN`).
[[bin]]
name = "codex-appserver-stub"
path = "tests/fixtures/codex-appserver-stub/main.rs"
required-features = []
test = false
bench = false

# Test-only fixture: a `git`-shaped shim that logs argv to `$RIMZ_TEST_GIT_LOG`
# then execs the real git. Used by `tests/integration/performance/` to count
# the cross-process git fork rate and prove the diff-stats single-flight.
[[bin]]
name = "git-trace"
path = "tests/fixtures/git-trace/main.rs"
required-features = []
test = false
bench = false

# Test-only fixture: an `ssh`-shaped shim that logs argv to
# `$RIMZ_TEST_SSH_LOG` and exits per the scripted `$RIMZ_TEST_SSH_PLAN`. Used
# by `tests/integration/remote_attach.rs` to assert the exec'd ssh argv and
# drive the reconnect supervisor without a real ssh or host (pointed at via
# `RIMZ_SSH_BIN`).
[[bin]]
name = "ssh-trace"
path = "tests/fixtures/ssh-trace/main.rs"
required-features = []
test = false
bench = false

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[lints]
workspace = true

[dependencies]
clap.workspace = true
crc32fast.workspace = true
fs4.workspace = true
hex.workspace = true
jiff.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
terminal_size.workspace = true
toml.workspace = true
toml_edit.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ureq.workspace = true
uuid.workspace = true
which.workspace = true
ratatui.workspace = true
tachyonfx.workspace = true

# anyhow is the binary boundary; per rust-conventions.md it is permitted in
# `crates/rimz/src/main.rs` and the private CLI module tree. Library modules
# return their own typed Result.
anyhow.workspace = true

# Stderr logger is installed in main.rs only; the library re-uses the
# global `tracing` subscriber.
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

# build.rs compacts the checked-in LiteLLM pricing snapshot into `OUT_DIR` for
# `include_str!` embedding (tier 1). Vendored-only and network-free, so builds
# stay reproducible; `serde_json` does the field/prefix filtering.
[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true
portable-pty.workspace = true
predicates.workspace = true
proptest.workspace = true
tempfile.workspace = true
tracing.workspace = true
vt100.workspace = true
