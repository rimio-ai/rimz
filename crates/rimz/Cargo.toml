anstyle.workspace = true
base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
colorchoice.workspace = true
crc32fast.workspace = true
dotenvy.workspace = true
glob.workspace = true
hex.workspace = true
httparse.workspace = true
md5.workspace = true
image-webp.workspace = true
jiff.workspace = true
kdl.workspace = true
notify.workspace = true
png.workspace = true
sentry = { workspace = true, optional = true }
sentry-tracing = { workspace = true, optional = true }
serde.workspace = true
serde_ignored.workspace = true
serde_json.workspace = true
flate2.workspace = true
tar.workspace = true
foldhash.workspace = true
rusqlite.workspace = true
sha2.workspace = true
prost.workspace = true
shlex.workspace = true
similar.workspace = true
terminal_size.workspace = true
toml.workspace = true
toml_edit.workspace = true
thiserror.workspace = true
unicode-width.workspace = true
tokio.workspace = true
tracing.workspace = true
tungstenite.workspace = true
ureq.workspace = true
url.workspace = true
uuid.workspace = true
which.workspace = true
ratatui.workspace = true

# anyhow is the binary boundary; per rust-conventions.md it is permitted in
# `crates/rimz/src/main.rs` and the private CLI module tree. Library modules
# return their own typed Result.
anyhow.workspace = true

# Stderr logger is installed in main.rs only; the library re-uses the
# global `tracing` subscriber.
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true
rustix.workspace = true
signal-hook.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# build.rs gzips the pre-compacted pricing snapshot into an `OUT_DIR` artifact
# for embedding (tier 1). Network-free: the hidden `rimz pricing-refresh`
# command projects the ignored snapshot before release packaging.
[build-dependencies]
flate2.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
divan.workspace = true
headless_chrome = "1.0"
insta.workspace = true
portable-pty.workspace = true
predicates.workspace = true
proptest.workspace = true
tempfile.workspace = true
tracing.workspace = true
vt100.workspace = true
