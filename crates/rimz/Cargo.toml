[package]
name = "rimz"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The control room for your coding agents: a realtime tmux/Zellij dashboard for fleets of Claude Code, Codex, and Pi agents."
homepage = "https://github.com/rimio-ai/rimz"
readme = "../../README.md"
keywords = ["cli", "tui", "agents", "tmux", "zellij"]
categories = ["command-line-utilities", "development-tools", "artificial-intelligence"]
# Integration tests live in one binary (`tests/integration/`), not flat
# `tests/*.rs` targets — disable auto-discovery and declare it explicitly.
autotests = false
# The generated pricing snapshot (pricing/litellm-pricing.json) is gitignored,
# so a default `cargo package` drops it and the published crate would embed an
# empty tier-1 table (build.rs falls back to `{}`). The vendored presence wasm is
# git-tracked, but an `include` allowlist packages only its entries; dropping it
# makes build.rs embed empty bytes and ships a Zellij poll-mode binary. The list
# force-lists those build inputs plus the license bundle; the release workflow
# runs the hidden `rimz pricing-refresh` projection before publish and passes
# `--allow-dirty` (the included snapshot is gitignored, which cargo's dirty
# check otherwise rejects).
include = [
    "/src",
    # Must stay AFTER `/src`; negation order decides whether nested docs stay out.
    "!AGENTS.md",
    "!CLAUDE.md",
    # Test code the whole-`/src` pull would otherwise ship: consumers never
    # compile it (every `mod tests` is `#[cfg(test)]`-gated), so drop sibling
    # test files, `tests/` subtrees and their fixtures, and `*_tests.rs`
    # custom-path modules while keeping production embeds that do not match.
    "!**/tests.rs",
    "!**/tests/**",
    "!**/*_tests.rs",
    "/build.rs",
    "/themes",
    "/pricing/litellm-pricing.json",
    "/presence/rimz-presence-zellij.wasm",
    "/presence/rimz-presence-zellij.wasm.provenance.json",
    "/LICENSE",
]

[lib]
name = "rimz"
path = "src/lib.rs"

[features]
testkit = []
# Off-box error reporting (src/observability/). Non-default and stripped from
# shipped binaries, like `testkit`; dev opts in, CI builds it via --all-features.
sentry = ["dep:sentry", "dep:sentry-tracing"]

[[bin]]
name = "rimz"
path = "src/main.rs"

# Test-only fixture: a `zellij`-shaped shim that records argv and exits 0.
# Used by `tests/integration/backend/zellij.rs` to verify the wakeup walk
# dispatches the broadcast pipe without needing a live Zellij to receive it.
[[bin]]
name = "zellij-trace"
path = "tests/fixtures/zellij-trace/main.rs"
required-features = ["testkit"]
test = false
bench = false

# Test-only ttyd-shaped TCP server. It records argv, binds the requested port,
# and stays alive until the integration test stops it through `rimz web`.
[[bin]]
name = "ttyd-trace"
path = "tests/fixtures/ttyd-trace/main.rs"
required-features = ["testkit"]
test = false
bench = false

# Test-only fixture: a `codex app-server`-shaped JSON-RPC stub. Used by
# `tests/integration/hooks.rs` to exercise `rimz codex refresh-context` without
# the real `codex` binary (pointed at via `RIMZ_CODEX_BIN`).
[[bin]]
name = "codex-appserver-stub"
path = "tests/fixtures/codex-appserver-stub/main.rs"
required-features = ["testkit"]
test = false
bench = false

# Test-only fixture: a `git`-shaped shim that logs argv to `$RIMZ_TEST_GIT_LOG`
# then execs the real git. Used by `tests/integration/performance/` to count
# the cross-process git fork rate and prove the diff-stats single-flight.
[[bin]]
name = "git-trace"
path = "tests/fixtures/git-trace/main.rs"
required-features = ["testkit"]
test = false
bench = false

[[example]]
name = "seed_perf_workspace"
path = "examples/seed_perf_workspace.rs"
required-features = ["testkit"]

# Test-only fixture: an `ssh`-shaped shim that logs argv to
# `$RIMZ_TEST_SSH_LOG` and exits per the scripted `$RIMZ_TEST_SSH_PLAN`. Used
# by `tests/integration/remote_attach.rs` to assert the attached ssh argv and
# drive the reconnect supervisor without a real ssh or host (pointed at via
# `RIMZ_SSH_BIN`).
[[bin]]
name = "ssh-trace"
path = "tests/fixtures/ssh-trace/main.rs"
required-features = ["testkit"]
test = false
bench = false

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["testkit"]

[[bench]]
name = "hotpath"
path = "benches/hotpath.rs"
harness = false
required-features = ["testkit"]

[[bench]]
name = "fleet"
path = "benches/fleet.rs"
harness = false
required-features = ["testkit"]

[lints]
workspace = true

[dependencies]
