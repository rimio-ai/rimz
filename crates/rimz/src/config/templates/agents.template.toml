# Rimz per-machine agent configuration.
#
# Save as ~/.config/rimz/agents.toml, or run `rimz config init`.
# Every key below is optional. Defaults stay commented so an untouched file
# keeps following defaults shipped by future Rimz versions; uncomment a line
# only when this machine needs an override.

[agents]
# Drop-in fragments under ~/.agents/{agents,teams} merge here; entries in this file override them.
# placement = "auto"                    # launch placement: "auto" (single agent → current pane; team/worktree → new tab), "pane" (split a new pane), or "tab" (always new tab)
# `rimz agents <spec>` names a team or uses inline cells made from profiles,
# commands, or built-ins. Built-ins include `term`, agent kinds, and
# adapter-supported `<kind>-<mode>` variants such as `claude-auto` or
# `codex-yolo`. `peer` (claude,codex) is a built-in team.

[agents.worktree]
# dir = "../{repo}-worktrees"          # where Rimz-owned Git worktrees live; {repo} is the root basename
# base = "head"                        # "head", "fresh", or any Git ref for new worktrees
# Project files .worktreeinclude and .worktreelink seed copied files and shared symlink dirs.

[agents.loop]
# Scheduled loop tasks. Each entry drives one `rimz loop run <name>` wake-up,
# fired by the sidebar elder while a room for the task's project is open. Use
# either `spec` to spawn a supervised turn or `bind` to wake one pinned live
# session. Edit entries here or with `rimz loop add`; a running room fires them.
# [agents.loop.tasks]
## [agents.loop.tasks.morning]
## spec = "claude-ping"                # `<kind>-ping` primes the provider window
## root = "/home/you/code/app"         # absolute project root whose room hosts the turn
## at = "07:00"                        # 24h firing time in the configured timezone
## days = "weekdays"                   # "daily", "weekdays", "weekends", or "mon,wed,fri"
## worktree = "main"                   # optional channel to host the transient pane
##
## [agents.loop.tasks.pr_watch]
## spec = "codex"                      # kind, profile, or virtual single-agent cell
## prompt = "check CI on the release PR"
## root = "/home/you/code/app"
## every = "15m"                       # interval; `cron = "*/15 * * * *"` uses raw cron syntax
## mode = "auto"                       # auto, ask, or yolo
##
## [agents.loop.tasks.self_wake]
## bind = { kind = "claude", session = "sess-abc123", handle = "@planner" }
## prompt = "resume the review and fix the next blocking comment"
## root = "/home/you/code/app"
## at = "09:30"

[agents.attention]
# stalled_after_secs = 1800            # silent running agent becomes actionable after this many seconds
# inactive_after_secs = 3600           # a card idle this many seconds sinks below live work (the prompt-cache window)

[agents.profiles]
# Profiles are named main agents addressed as `@<profile>`. `agent` names a
# built-in kind or another profile; the nearest profile wins for every field,
# including `args` (replace, not append). A profile named like a kind overrides
# bare kind cells and virtual cells such as `claude-auto` / `claude-ping`.
## [agents.profiles.claude-slim]
## agent = "claude"
## effort = "low"
## system-prompt-file = "~/.config/rimz/prompts/slim.md"
## append-system-prompt-file = "~/.config/rimz/prompts/extra.md"
## args = "--max-turns 4"

[agents.commands]
# Commands are shell-split raw command panes. They are not addressable agents.
## vim = "nvim -p"
## htop = "htop"

[agents.teams]
# Teams bind ordered role names to profiles. By default each role opens as one
# side-by-side column in the same tab; optional `layout` uses the same
# comma=column / plus=row grammar as inline specs, resolving role names first.
# Each role answers to `@<role>` in that channel.
[agents.teams.peer]
layout = "claude,codex"

## [agents.teams.review]
## layout = "planner+reviewer,coder+term"
## [[agents.teams.review.roles]]
## role = "planner"
## profile = "planner"
## [[agents.teams.review.roles]]
## role = "coder"
## profile = "codex-yolo"
## [[agents.teams.review.roles]]
## role = "reviewer"
## profile = "claude"
