# RimZ per-machine agent configuration.
#
# Save as ~/.config/rimz/agents.toml, or run `rimz config init`.
# Every key below is optional. Defaults stay commented so an untouched file
# keeps following defaults shipped by future RimZ versions; uncomment a line
# only when this machine needs an override.

[agents]
# Drop-in fragments under ~/.agents/{profiles,teams} merge here; entries in this file override them.
# placement = "auto"                    # launch placement: "auto" (single agent → current pane; team/worktree → new tab), "pane" (split a new pane), or "tab" (always new tab)
# `rimz agents <spec>` names a team or uses inline cells made from profiles,
# commands, or built-ins. Built-ins include `term`, agent kinds, and
# adapter-supported `<kind>-<mode>` variants such as `claude-auto` or
# `codex-yolo`. `peer` (claude,codex) is a built-in team.

[agents.worktree]
# dir = "../{repo}-worktrees"          # where RimZ-owned Git worktrees live; {repo} is the root basename
# base = "head"                        # "head", "fresh", or any Git ref for new worktrees
# Project files .worktreeinclude and .worktreelink seed copied files and shared symlink dirs.

[agents.attention]
# active_grace_secs = 180              # silence credited to active time before the estimate pauses
# stalled_after_secs = 1800            # silent running agent becomes actionable after this many seconds
# tool_repeat_warn_after = 3            # identical calls before the card gains a warning marker
# tool_repeat_attention_after = 20      # identical calls before the agent becomes actionable
# inactive_after_secs = 3600           # a card idle this many seconds sinks below live work (the prompt-cache window)
# archive_after_secs = 86400           # a card idle this many seconds parks below hot and warm work

[agents.profiles]
# Profiles are named main agents addressed as `@<profile>`. `agent` names a
# built-in kind or another profile; the nearest profile wins for every field,
# including `args` (replace, not append). A profile named like a kind overrides
# bare kind cells and virtual cells such as `claude-auto` / `claude-plan`.
## [agents.profiles.claude-slim]
## agent = "claude"
## effort = "low"
## budget = "5"                       # session cap; use "20/day" for a local-calendar-day cap
## system-prompt-file = "~/.config/rimz/prompts/slim.md"
## append-system-prompt-files = ["~/.config/rimz/prompts/extra.md"]
## args = "--max-turns 4"

[agents.commands]
# Commands are shell-split raw command panes. They are not addressable agents.
## vim = "nvim -p"
## htop = "htop"

[agents.teams]
# Teams bind ordered role names to profiles or built-in agent kinds. A profile
# named like a kind overrides that implicit base. By default each role opens as
# one side-by-side column in the same tab; optional `layout` uses the same
# comma=column / plus=row grammar as inline specs, resolving role names first.
# Each role answers to `@<role>` in that channel.
[agents.teams.peer]
layout = "claude,codex"

## [agents.teams.review]
## leader = "planner"  # role that receives the launch prompt; default: the first role
## layout = "planner+reviewer,coder+term"
## scratch-files = ["/plan.md", "/*-notes.md"]  # gitignore patterns for ephemeral team memory
## [[agents.teams.review.roles]]
## role = "planner"
## profile = "planner"
## [[agents.teams.review.roles]]
## role = "coder"
## profile = "codex-yolo"
## [[agents.teams.review.roles]]
## role = "reviewer"
## profile = "claude"
