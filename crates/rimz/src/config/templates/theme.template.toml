# Rimz per-machine theme configuration.
#
# Save as ~/.config/rimz/theme.toml, or run `rimz config init`.
# Every key below is optional. Defaults stay commented so an untouched file
# keeps following defaults shipped by future Rimz versions; uncomment a line
# only when this machine needs an override.

[theme]
## style = "modern"                   # "modern" = truecolor + Nerd Font; "default" = auto color + Unicode
# Palette depth and scheme are optional. mode = "auto" uses truecolor when
# COLORTERM or $TERM terminfo advertises it, otherwise 256. Unset scheme uses the bundled
# TokyoNight Night theme; set a bundled Alacritty theme name (`rimz list-themes`)
# or a path to an Alacritty TOML file.
## mode = "auto"
## scheme = "TokyoNight Night"
## scheme = "Catppuccin Mocha"
# Slot overrides accept palette roles ("green", "cyan", "bright_blue"),
# 256-color indexes, or "#rrggbb"; omitted slots use the selected scheme.
## good = "green"                     # ANSI green
## warn = "yellow"                    # ANSI yellow
## caution = "#e0915c"                # derived amber by default
## alarm = "red"                      # ANSI red
## accent = "cyan"                    # ANSI cyan
## cool = "blue"                      # ANSI blue
## meta = "magenta"                   # ANSI magenta
## body = "#a6a19a"                   # derived foreground ladder by default
## muted = "#767168"
## faint = "#45423d"
## rule = "#343230"
## selection = "bright_blue"          # colors.bright.blue, falling back to normal.blue
## selection_bg = "#2a2723"           # derived from colors.selection.background

[theme.animations]
# Status-head animation roles are optional. Each role accepts frames, color,
# effect, and speed; omitted fields keep the built-in value. Colors are semantic
# slots, palette roles, "clay", "#rrggbb", or a 0-255 color index.
## unread = "shimmer"
## [theme.animations.thinking]
## frames = "⠁⠂⠄⡀⡈⡐⡠⣀⣁⣂⣄⣌⣔⣤⣥⣦⣮⣶⣷⣿⡿⠿⢟⠟⡛⠛⠫⢋⠋⠍⡉⠉⠑⠡⢁"
## color = "clay"
## effect = "static"
## speed = "fast"
## [theme.animations.working]
## frames = "⣾⣽⣻⢿⡿⣟⣯⣷"
## color = "clay"
## effect = "static"
## speed = "fast"
## [theme.animations.compacting]
## frames = "▁▃▄▅▆▇▆▅▄▃"
## color = "meta"
## effect = "static"
## speed = "fast"
## [theme.animations.delegating]
## frames = "⢄⢂⢁⡁⡈⡐⡠"
## color = "clay"
## effect = "static"
## speed = "fast"
## [theme.animations.resolving]
## frames = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏"
## color = "meta"
## effect = "static"
## speed = "fast"
## [theme.animations.idle]
## frames = "○"
## color = "good"
## effect = "static"
## speed = "normal"
## [theme.animations.success]
## frames = "✓"
## color = "good"
## effect = "static"
## speed = "normal"
## [theme.animations.paused]
## frames = ["⏸︎"]
## color = "caution"
## [theme.animations.waiting]
## frames = "?"
## color = "warn"
## [theme.animations.failed]
## frames = "!"
## color = "alarm"

[theme.glyphs]
# Glyphs are display-only and grouped the way the sidebar reads on screen. Both
# shipped sets are active below so customizing is direct: paste a different
# glyph over any value. Every glyph must occupy one terminal cell, or two when a
# trailing space pads a double-width icon.
## set = "nerd_font"

[theme.glyphs.unicode.status]
waiting = "?"
attention = "!"
paused = "⏸︎"
done = "✓"
idle = "○"
working = "⢿"
thinking = "⠁"
delegating = "⢄"
