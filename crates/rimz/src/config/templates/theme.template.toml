# Rimz per-machine theme configuration.
#
# Save as ~/.config/rimz/theme.toml, or run `rimz config init`.
# Every key below is optional. Defaults stay commented so an untouched file
# keeps following defaults shipped by future Rimz versions; uncomment a line
# only when this machine needs an override.

[theme]
## style = "modern"                   # "modern" = truecolor + Nerd Font; "default" = auto color + Unicode
# Palette depth and scheme are optional. mode = "auto" uses truecolor when
# COLORTERM or $TERM terminfo advertises it, otherwise 256. Unset scheme uses the bundled
# TokyoNight Night theme; set a bundled Alacritty theme name (`rimz list-themes`)
# or a path to an Alacritty TOML file.
## mode = "auto"
## scheme = "TokyoNight Night"
## scheme = "Catppuccin Mocha"
# Slot overrides accept palette roles ("green", "cyan", "bright_blue"),
# 256-color indexes, or "#rrggbb"; omitted slots use the selected scheme.
## good = "green"                     # ANSI green
## warn = "yellow"                    # ANSI yellow
## caution = "#e0915c"                # derived amber by default
## alarm = "red"                      # ANSI red
## accent = "cyan"                    # ANSI cyan
## cool = "blue"                      # ANSI blue
## meta = "magenta"                   # ANSI magenta
## body = "#a6a19a"                   # derived foreground ladder by default
## muted = "#767168"
## faint = "#45423d"
## rule = "#343230"
## selection = "bright_blue"          # colors.bright.blue, falling back to normal.blue
## selection_bg = "#2a2723"           # derived from colors.selection.background

[theme.display]
# Sidebar render preferences - cadence, sizing, and dashboard layout. All optional.
## refresh_ms = 100                   # render/animation grid; clamped internally
## max_cols = 72                      # creation-time cap for sidebar pane width
## scrollbar = "auto"                 # "auto", "always", or "never"
## card_density = "auto"              # "auto", "expanded", or "compact"
## provider_tabs = "auto"             # "auto", "always", or "never"
## provider_list = []                 # explicit provider order; include "all" to expand the rest
## max_provider_blocks = 3            # cap stacked provider blocks when provider_list is empty

[theme.display.context_meter]
# Agent-card context meter color stops (worse of fill % and absolute tokens).
## green = { percent = 40, tokens = 100000 }
## yellow = { percent = 60, tokens = 160000 }
## amber = { percent = 75, tokens = 258000 }
## red = { percent = 90, tokens = 420000 }

[theme.display.budget_bar]
# Provider budget bar color zones, by remaining budget percent (plan + metered).
## yellow = 50
## amber = 25
## red = 10

[theme.display.budget_bar.burn_rate]
# Reset-marker burn-rate zones, as percent of even pace (100 = on-pace). Deep
# underspend cools toward green once enough of the window has elapsed.
## green = 67
## deep_green = 33
## yellow = 100
## amber = 150
## red = 200

[theme.display.highlight_steps]
# Selected-band and unread-wash offsets from the selection_bg panel, in units of
# 0.01 OKLab lightness (band = 5 is a 0.05 step). indexed is the 256-color
# one-cell step taken either side of the panel.
## band = 5      # truecolor: selected-card recess below selection_bg
## wash = 1      # truecolor: unread-row wash lift above selection_bg
## indexed = 4   # 256-color: one-cell step either side (band darker, wash lighter)

[theme.pets]
# Opt-in animated companion in the provider dashboard. All optional.
## enabled = true                   # opt-in animated companion in the provider dashboard
## pet = "rocky"                    # built-in id, an https:// URL, a petdex pet name, or a path to your own .webp sheet
## glyphs = "auto"                  # auto tries pixels then sextant cell art; or pixel / sextant
## voice = true                     # canned captions on fleet-status changes

[theme.animations]
# Status-head animation roles are optional. Each role accepts frames, color,
# effect, and speed; omitted fields keep the built-in value. Colors are semantic
# slots, palette roles, "clay", "#rrggbb", or a 0-255 color index.
## unread = "shimmer"
## [theme.animations.thinking]
## frames = "⠁⠂⠄⡀⡈⡐⡠⣀⣁⣂⣄⣌⣔⣤⣥⣦⣮⣶⣷⣿⡿⠿⢟⠟⡛⠛⠫⢋⠋⠍⡉⠉⠑⠡⢁"
## color = "clay"
## effect = "static"
## speed = "fast"
## [theme.animations.working]
## frames = "⣾⣽⣻⢿⡿⣟⣯⣷"
