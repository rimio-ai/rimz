# Drop in any Alacritty theme: the [colors.*] tables below follow Alacritty's
# schema, so you can paste a whole scheme file here verbatim to override the
# palette. The shipped default is TokyoNight Night
# (https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/alacritty/TokyoNight.toml).
[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.normal]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#414868"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"

[colors.selection]
background = "#283457"
