# RimZ per-machine loop configuration.
#
# Save as ~/.rimz/loop.toml, or run `rimz config init`.
# Durable recurring loop tasks live here. One-shots and self-waits created by
# RimZ live in the state store instead, so this file stays hand-editable.

# Supervised scheduled turns without a task-specific timeout use two hours.
# default-timeout = "2h"

# Loop runs that start an agent take turns across every room on this machine.
# A start holds the turn until the provider reports the new agent, or for
# `pace` at most ("0s" turns pacing off); a run still waiting after `max-wait`
# is skipped. Per task, `throttle = "off"` starts without taking a turn.
# [throttle]
# pace = "10s"
# max-wait = "30m"
## max-active = 6                      # hold while this many agents are working, in every room
## max-active-per-task = 2             # hold while this many of the task's own agents are working
## cpu-pressure = 60                   # hold while Linux PSI `some` avg10 or avg60 is at or over this percent
## io-pressure = 40
## memory-pressure = 20
## min-memory = "8GB"                  # hold while less memory is available
## min-disk = "20GB"                   # hold while the launch checkout's filesystem has less free

# Scheduled loop tasks. Each entry drives one `rimz loop run <name>` wake-up,
# fired by the sidebar host while a room for the task's project is open, or by
# the OS timer installed with `rimz loop timer install` otherwise. Use either
# `agent` to spawn a supervised turn or `wait` to wake one pinned live session.
# Edit entries here or with `rimz loop add`.
# [tasks]
## [tasks.morning]
## agent = "claude"                    # kind, profile, or virtual single-agent cell
## prompt = "summarize what landed on main since yesterday"
## root = "/home/you/code/app"         # absolute project root whose room hosts the turn
## at = "07:00"                        # 24h firing time in the configured timezone
## every = "weekday"                   # "day", "weekday", "weekend", or "mon,wed,fri"
## worktree = "main"                   # optional channel to host the transient pane
##
## [tasks.pr_watch]
## agent = "codex"                     # kind, profile, or virtual single-agent cell
## prompt = "check CI on the release PR"
## root = "/home/you/code/app"
## every = "15m"                       # interval; `cron = "*/15 * * * *"` uses raw cron syntax
## mode = "auto"                       # auto, ask, or yolo
## account = "work"                    # named provider account every fire runs on; unset follows the room
## budget = "5"                        # cap each spawned run
## budget-per-day = "20"               # skip fires that cannot fit today's task budget
## surplus = "1.5x"                    # require forward headroom in the longest provider window
## surplus-after = "3d"                # wait for this much of that window to elapse
##
## [tasks.watchdog]
## agent = "codex"
## prompt = "tests are failing; fix the next failure"
## root = "/home/you/code/app"
## every = "15m"
## check = "cargo test"                # shell command runs in task dir (project root when absent) before the agent
## on = "fail"                         # "fail" waits on non-zero/timeout; "success" waits on zero
##
## [tasks.ci_green]
## prompt = "CI is green; merge the PR"
## root = "/home/you/code/app"
## every = "2m"
## check = "gh run watch --exit-status"
## on = "success"
## deadline = "2026-07-01T12:00:00Z"   # `rimz loop add --until 30m` stores this as state
## [tasks.ci_green.wait]
## kind = "claude"
## session = "sess-abc123"
## handle = "@planner"
##
## [tasks.roomy]
## agent = "claude"
## prompt = "refactor the next rough module"
## root = "/home/you/code/app"
## when = ["window.5h.left>=60"]
## provider = "claude"                 # `rimz loop add` stores the kind a window term reads as state
##
## [tasks.after_limit]
## agent = "claude"
## prompt = "pick the refactor back up"
## root = "/home/you/code/app"
## fire-at = "2026-07-01T14:00:00Z"     # `rimz loop add --after-reset 5h` stores the reset as state
##
## [tasks.self_wait]
## prompt = "resume the review and fix the next blocking comment"
## root = "/home/you/code/app"
## at = "09:30"
## [tasks.self_wait.wait]
## kind = "claude"
## session = "sess-abc123"
## handle = "@planner"
