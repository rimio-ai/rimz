# RimZ per-machine loop configuration.
#
# Save as ~/.rimz/loop.toml, or run `rimz config init`.
# Durable recurring loop tasks live here. One-shots and self-waits created by
# RimZ live in the state store instead, so this file stays hand-editable.

# The `timeout` `rimz loop add` writes on a shell task given no `--timeout`.
# default-timeout = "2h"

# Scheduled loop tasks. Each entry drives one `rimz loop run <name>` fire, by the
# sidebar host while a room for the task's project is open, or by the OS timer
# installed with `rimz loop timer install` otherwise. A task declares the kind of
# thing it launches. A `shell` task runs `args` (an argv, no shell) under its
# `timeout`, which a hand-written shell task must set: exit 0 ends the fire done,
# anything else, or the timeout, failed. A `workflow`, `agent` or `team` task
# launches `rimz workflow run`, `rimz agents` or `rimz teams launch` with its
# `target` and `args`; those kinds take no `timeout`. `rimz loop add [name]
# <trigger> [--workflow|--agent|--team <target>] -- <args>` writes an entry; edit
# entries here as well.
# [tasks]
## [tasks.morning]
## kind = "team"
## target = "forge"
## args = ["-w", "morning", "summarize what landed"]
## root = "/home/you/code/app"         # absolute project root whose room hosts the fire
## cron = "0 7 * * 1-5"                # five-field cron in the configured timezone: 07:00 on weekdays
##
## [tasks.pr_watch]
## kind = "shell"
## args = ["gh", "pr", "checks"]
## timeout = "5m"                      # how long the command may run; required on a shell task
## root = "/home/you/code/app"
## cron = "*/15 * * * *"               # every 15 minutes
## overlap = "coalesce"                # busy triggers: skip (default), coalesce (newest), queue, replace (stop for newest), allow (agent tasks: launch anyway)
## # overlap-limit = 10                # only with overlap = "queue"; at least 1
##
## [tasks.deployed]
## kind = "workflow"
## target = "smoke"
## root = "/home/you/code/app"
## when = ["ci=passed"]
## repeat = true                       # a when task fires once unless it repeats
##
## [tasks.roomy]
## kind = "agent"
## target = "claude"
## args = ["refactor the next rough module"]
## root = "/home/you/code/app"
## when = ["window.5h.left>=80"]
## provider = "claude"                 # `rimz loop add` stores the kind a window term reads as state
## account = "work"                    # the account whose windows the conditions read; unset follows the room
##
## [tasks.self_wait]
## prompt = "resume the review and fix the next blocking comment"
## root = "/home/you/code/app"
## fire-at = "2026-06-01T09:30:00Z"    # a one-shot's instant; the row goes once it fires
## [tasks.self_wait.wait]                # a delivery row: hands its prompt to one pinned live session
## kind = "claude"
## session = "sess-abc123"
## handle = "@planner"
