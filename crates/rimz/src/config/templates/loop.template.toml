# RimZ per-machine loop configuration.
#
# Save as ~/.rimz/loop.toml, or run `rimz config init`.
# Durable recurring loop tasks live here. One-shots and self-waits created by
# RimZ live in the state store instead, so this file stays hand-editable.

# A fire whose task sets no `timeout` may run its command this long.
# default-timeout = "2h"

# Scheduled loop tasks. Each entry drives one `rimz loop run <name>` fire, by the
# sidebar host while a room for the task's project is open, or by the OS timer
# installed with `rimz loop timer install` otherwise. A fire runs the task's
# `command` (an argv, no shell) and lasts as long as it does: exit 0 ends it done,
# anything else, or the timeout, failed. `rimz loop add [name] <trigger> -- <command>`
# writes an entry; edit entries here as well.
# [tasks]
## [tasks.morning]
## command = ["rimz", "teams", "launch", "forge", "-w", "morning", "--detach", "summarize what landed"]
## timeout = "30m"                     # how long the command may run; else default-timeout
## root = "/home/you/code/app"         # absolute project root whose room hosts the fire
## at = "07:00"                        # 24h firing time in the configured timezone
## every = "weekday"                   # "day", "weekday", "weekend", or "mon,wed,fri"
## fresh-worktree = "morning"          # optional prefix: a fresh worktree from trunk each fire
##
## [tasks.pr_watch]
## command = ["gh", "pr", "checks"]
## timeout = "5m"
## root = "/home/you/code/app"
## every = "15m"                       # interval; `cron = "*/15 * * * *"` uses raw cron syntax
## overlap = "coalesce"                # busy triggers: skip (default), coalesce (newest), queue, replace (stop for newest)
## # overlap-limit = 10                # only with overlap = "queue"; at least 1
##
## [tasks.deployed]
## command = ["./scripts/smoke"]
## timeout = "10m"
## root = "/home/you/code/app"
## signal = "deploy.done"
## repeat = true                       # signal and when tasks fire once unless they repeat
##
## [tasks.roomy]
## command = ["rimz", "agents", "launch", "claude", "refactor the next rough module"]
## timeout = "2h"
## root = "/home/you/code/app"
## when = ["window.5h.left>=60"]
## provider = "claude"                 # `rimz loop add` stores the kind a window term reads as state
## account = "work"                    # the account whose windows the conditions read; unset follows the room
##
## [tasks.self_wait]
## prompt = "resume the review and fix the next blocking comment"
## root = "/home/you/code/app"
## at = "09:30"
## [tasks.self_wait.wait]                # a delivery row: hands its prompt to one pinned live session
## kind = "claude"
## session = "sess-abc123"
## handle = "@planner"
