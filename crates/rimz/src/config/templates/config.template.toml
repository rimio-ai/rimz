# RimZ per-machine configuration.
#
# Save as ~/.config/rimz/config.toml, or run `rimz config init`.
# Every key below is optional. Defaults stay commented so an untouched file
# keeps following defaults shipped by future RimZ versions; uncomment a line
# only when this machine needs an override.

## timezone = "America/New_York" # IANA zone for displayed times and scheduling; default = system local

[remote_control]
# claude = false                       # auto-launch `claude remote-control` in the managed daemon tab
# codex = false                        # ensure the per-user Codex remote-control daemon when installed

[daemon]
# The rimzd dashboard's middle column (beside the sidebar and managed hosts).
# Unset keeps one live-stats pane. List panes to replace or extend it; the
# reserved command "stats" is the live-stats pane. cwd defaults to the worktree.
# Command/cwd edits reload on save; adding/removing panes needs a room restart.
## [[daemon.pane]]
## command = "stats"
## [[daemon.pane]]
## command = "btop"
## cwd = "/var/log"

[accounts]
[accounts.budget]
# Per-login local-calendar-day caps shared by every room. Values require /day
# and wired authoritative account-spend history; quota bars and estimates do
# not qualify. Unsupported kinds refuse config edits and room start.
## claude = "100/day"
## codex = "100/day"

[accounts.usage_limit_usd]
# Display-only monthly USD ceilings for the extra/API usage bar. These are not
# provider-enforced spending limits; they only scale the dashboard bar when the
# provider does not report a cap. Unset means infinite/uncapped display.
## claude = 50.0
## codex = 25.0

[notifications]
# enabled = true
# triggers = ["waiting", "failed"]
# desktop = "auto"                    # "auto", "osc", or "off"
# sound = "bell"                      # "bell" or "off"
# suppress_focused = true
# debounce_ms = 5000
# coalesce_ms = 1000
# remind_secs = 60                   # seconds between local unread reminders; 0 disables reminders
## title = "RimZ: {{agent}} {{kind}}"  # optional banner title for agent/coalesced notifications
## body = "{{task}}"                   # optional banner body; vars: kind, agent, handle, status, worktree, task, count, unread
## command = "ntfy publish rimz"       # shorthand for one unconditional handler; receives RIMZ_NOTIFY_* environment variables
## [[notifications.handler]]
## name = "waiting-ntfy"
## command = "ntfy publish --title {{title}} rimz {{body}}" # each {{var}} is shell-quoted; do not add quotes around vars
## when = { kind = ["waiting"], worktree = ["feat/*"], handle = ["@planner"] }

[sidebar]
# Sidebar behavior: focus keybind, motion keybinds, spend headline window, and worktree comparison target.
# focus_key = "Alt+p"                 # global chord to focus the sidebar (toggle); "" or "off" to disable
# afk_after_secs = 900                # input-idle seconds before the AFK badge (tmux only); default 15 min
# spend_window = "session"            # cockpit & provider headline window: "session", "24h", or "today"
## trunk = "develop"                  # optional preferred branch for worktree comparison stats

[sidebar.keys]
# narrower = "a"
# wider = "d"
# up = "k up"
# down = "j down"
# top = "g"
# bottom = "G"
# worktree_up = "K"
# worktree_down = "J"
# page_up = "ctrl+b pageup"
# page_down = "ctrl+f pagedown"
# screen_top = "H"
# screen_bottom = "L"

[web]
# enabled = true                     # allow rimz web / remote --web to enable Zellij browser sharing (auto-grants the RimZ presence plugin)

[web.zellij]
# Zellij browser access. base_url is the URL users open; set it when a reverse
# proxy serves Zellij under a public host or path.
## base_url = "https://devbox.example/zellij"
# auto_start = true                   # `rimz web open` starts `zellij web` when offline
# font = "JetBrainsMono Nerd Font Mono" # browser terminal font for zellij web (web_client)
# style_client = true                 # style the browser terminal (font + colors) from [theme]; false keeps your Zellij web_client config

[web.tmux]
# tmux browser access through ttyd. base_url is the URL users open when a
# reverse proxy serves the per-room ttyd process under a public host or path.
## base_url = "https://devbox.example/tmux"
# auto_start = true                   # `rimz web open` starts ttyd for the room when needed

[mux]
## default = "tmux"                   # preferred backend when both zellij and tmux are installed; unset resolves to tmux

[zellij]
# Critical room invariants RimZ always applies:
mouse_click_through = true            # single click on a card jumps to the agent (Zellij >= 0.44.0)
focus_follows_mouse = false           # off so a single click passes through to the renderer
session_serialization = false         # RimZ owns rebirth instead of Zellij resurrection
disable_session_metadata = true       # stop Zellij's per-second metadata/ps loop

# Optional: uncomment to override your ~/.config/zellij/config.kdl. Left unset,
# RimZ leaves these to your Zellij config or Zellij's defaults.
## pane_frames = true
## mouse_mode = true
## advanced_mouse_actions = true
## mouse_hover_effects = false
## on_force_close = "detach"          # "detach" or "quit"
## scroll_buffer_size = 100000
## show_startup_tips = false
## show_release_notes = false
## copy_clipboard = "system"          # "system" or "primary"
## copy_on_select = true
## support_kitty_keyboard_protocol = true
## osc8_hyperlinks = true

[tmux]
# RimZ applies these to its tmux session on every birth.
mouse = true
focus_events = true
history_limit = 100000
allow_passthrough = true
set_clipboard = "on"                  # "on", "external", or "off"
extended_keys = true                  # Shift+Enter / Alt+Enter as soft newlines; on tmux 3.5.x this trades clean multiline paste (use Ctrl+J, or tmux 3.6+)
extended_keys_format = "csi-u"        # "csi-u" or "xterm"
escape_time_ms = 0
renumber_windows = true
aggressive_resize = true

# Optional: uncomment to override your ~/.tmux.conf. Left unset, RimZ leaves
# pane borders to your tmux config or tmux's defaults.
## pane_border_status = "top"          # "off", "top", or "bottom"
## pane_border_lines = "heavy"         # "simple", "single", "double", or "heavy"

[resume]
# on_rebirth = true                   # re-seed prior agents when a room is reborn
# max = 128                           # cap auto-resumed agents per rebirth
# auto_continue = false               # resume rate-limit, overload, and transient API-error parks (stalls/timeouts/drops)
# auto_continue_backoff_secs = [180, 300] # first retry after 3m; 5m thereafter
# auto_continue_max_retries = 12      # stop attempting after this many auto-continue tries
# auto_continue_text = "continue"     # the nudge typed into the parked pane on resume

[harness]
## budget = "50/day"             # turn on the whole-room local-day cap; adjust the live cap with `rimz budget`
## smart_compact = "70%"          # default compact-first threshold for message ("70%", "120000", or "180k"); unset = off
# rtk = "auto"                    # wrap agent cargo runs (build/check/test/nextest/clippy) through `rtk`; auto = when rtk is on PATH, on = force, off = never
