# Rimz per-machine configuration.
#
# Save as ~/.config/rimz/config.toml, or run `rimz config init`.
# Every key below is optional. Defaults stay commented so an untouched file
# keeps following defaults shipped by future Rimz versions; uncomment a line
# only when this machine needs an override.

[remote_control]
# claude = false                       # auto-launch `claude remote-control` in the managed daemon tab
# codex = false                        # ensure the per-user Codex remote-control daemon on start

[accounts]
[accounts.usage_limit_usd]
# Display-only monthly USD ceilings for the extra/API usage bar. These are not
# provider-enforced spending limits; they only scale the dashboard bar when the
# provider does not report a cap. Unset means infinite/uncapped display.
## claude = 50.0
## codex = 25.0

[notifications]
# enabled = true
# triggers = ["waiting", "failed", "paused", "success"]
# desktop = "auto"                    # "auto", "osc", or "off"
# sound = "bell"                      # "bell" or "off"
# suppress_focused = true
# debounce_ms = 5000
# coalesce_ms = 1000
# remind_secs = 60                   # seconds between local unread reminders; 0 disables reminders
## command = "ntfy publish rimz"       # optional shell command; receives RIMZ_NOTIFY_* environment variables

[sidebar]
# refresh_ms = 100                    # render/animation grid; clamped internally
# max_provider_blocks = 3             # cap discovered provider blocks when provider_list is empty
# provider_tabs = "auto"              # "auto", "always", or "never"
# provider_list = []                  # explicit provider order; include "all" to expand remaining providers
# max_cols = 72                       # creation-time cap for sidebar pane width
# scrollbar = "auto"                  # "auto", "always", or "never"
# glow = "auto"                       # transition flashes: "auto", "always", or "never"
# card_density = "auto"               # "auto", "expanded", or "compact"
# focus_key = "Alt+p"                 # global chord to focus the sidebar (toggle); "" or "off" to disable
## trunk = "develop"                  # optional preferred branch for worktree comparison stats

[sidebar.context]
# green = { percent = 40, tokens = 100000 }
# yellow = { percent = 60, tokens = 160000 }
# amber = { percent = 75, tokens = 258000 }
# red = { percent = 90, tokens = 420000 }

[sidebar.budget]
# yellow = 50                         # remaining percent where the draining bar reaches warn (gold)
# amber = 25                          # remaining percent where the bar reaches caution (amber)
# red = 10                            # remaining percent where the bar reaches alarm (red)

[sidebar.budget.pace]
# yellow = 100                        # pace percent where the reset marker leaves the soft tier for warn
# amber = 150                         # pace percent where the marker reaches caution (amber)
# red = 200                           # pace percent where the marker reaches alarm (red)

[zellij]
# Critical room invariants Rimz always applies:
mouse_click_through = true            # single click on a card jumps to the agent (Zellij >= 0.44.0)
focus_follows_mouse = false           # required for the first click to pass through
session_serialization = false         # Rimz owns rebirth instead of Zellij resurrection
auto_layout = true                    # use Rimz's swap layout for no-direction new panes

# Optional: uncomment to override your ~/.config/zellij/config.kdl. Left unset,
# Rimz leaves these to your Zellij config or Zellij's defaults.
## pane_frames = true
## mouse_mode = true
## advanced_mouse_actions = true
## mouse_hover_effects = false
## on_force_close = "detach"          # "detach" or "quit"
## scroll_buffer_size = 100000
## show_startup_tips = false
## show_release_notes = false
## copy_clipboard = "system"          # "system" or "primary"
## copy_on_select = true
## support_kitty_keyboard_protocol = true
## osc8_hyperlinks = true

[tmux]
# mouse = true
# focus_events = true
# history_limit = 100000
# allow_passthrough = true
# set_clipboard = "on"                # "on", "external", or "off"
# extended_keys = true
# extended_keys_format = "csi-u"      # "csi-u" or "xterm"
# escape_time_ms = 0
# renumber_windows = true
# aggressive_resize = true
# pane_border_status = "off"          # "off", "top", or "bottom"
# pane_border_lines = "simple"        # "simple", "single", "double", or "heavy"

[resume]
# on_rebirth = true                   # re-seed prior agents when a room is reborn
# max = 8                             # cap auto-resumed agents per rebirth
# auto_continue = false               # resume a rate-limit-parked agent when its 5h/7d window resets
# auto_continue_overloaded = false    # resume an overload-parked agent on the retry backoff below
# auto_continue_overloaded_backoff_secs = [60, 120, 180] # retry ramp; the last value repeats
# auto_continue_overloaded_max_retries = 10 # stop attempting after this many overload retries
# auto_continue_text = "continue"     # the nudge typed into the parked pane on resume

[sentry]
# Off-box error reporting. With no DSN, Sentry stays off and Rimz makes no
# network calls. When set, Rimz warn/error events and observed agent
# rate-limit/overload conditions report to this project (machine name and PII
# withheld). RIMZ_SENTRY_DSN / RIMZ_SENTRY_ENVIRONMENT override these.
## dsn = "https://examplePublicKey@o0.ingest.sentry.io/0"
## environment = "production"         # deployment tag attached to every event
