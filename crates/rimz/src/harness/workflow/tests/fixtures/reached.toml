[workflow]
scope = 'worktree'
start = 'build'

[agent.build]
agent = 'claude'
lifecycle = 'turn'
prompt-file = 'prompt.md'
then = 'gate'
max-visits = 1

[script.gate]
run = 'cat answer.json'
timeout = '1h'
on.again = 'build'
on.next = 'middle'

[agent.middle]
agent = 'claude'
lifecycle = 'turn'
prompt-file = 'prompt.md'
then = 'review'
max-visits = 1

[script.review]
run = 'cat answer.json'
timeout = '1h'
on.next = 'finish'

[agent.finish]
agent = 'claude'
lifecycle = 'turn'
prompt-file = 'prompt.md'
then = 'gate'
max-visits = 1
