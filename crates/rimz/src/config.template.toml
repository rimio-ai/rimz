# Rimz per-machine configuration.
#
# Save as ~/.config/rimz/config.toml, or run `rimz config init`.
# Every key below is optional. Defaults stay commented so an untouched file
# keeps following defaults shipped by future Rimz versions; uncomment a line
# only when this machine needs an override.

[worktree]
# dir = "../{repo}-worktrees"          # where Rimz-owned Git worktrees live; {repo} is the root basename
# base = "head"                        # "head", "fresh", or any Git ref for new worktrees

[agents]
# tab = "auto"                          # launch placement: "auto" (worktree or multi-cell → new tab, else same tab), "new", or "same"
# `rimz agents <spec>` cells are profiles, commands, or built-ins. Built-ins
# include `term`, agent kinds, and adapter-supported `<kind>-<mode>` variants
# such as `claude-auto` or `codex-yolo`. `peer` (claude,codex) is a built-in
# layout.

[agents.profiles]
# Profiles are named main agents addressed as `@<profile>`. `agent` names a
# built-in kind or another profile; the nearest profile wins for every field,
# including `args` (replace, not append). A profile named like a kind overrides
# bare kind cells and virtual cells such as `claude-auto` / `claude-ping`.
## [agents.profiles.claude-slim]
## agent = "claude"
## effort = "low"
## system-prompt-file = "~/.config/rimz/prompts/slim.md"
## args = "--max-turns 4"
## [agents.profiles.planner]
## agent = "claude-slim"
## system-prompt-file = "~/.config/rimz/prompts/planner.md"
## [agents.profiles.claude]                 # kind-default override for bare `claude` and `claude-auto`
## agent = "claude"
## args = "--append-system-prompt 'Prefer concise plans.'"

[agents.commands]
# Commands are shell-split raw command panes. They are not addressable agents.
## vim = "nvim -p"
## htop = "htop"

[agents.layouts]
# Layouts are shape strings that compose profiles, commands, and built-ins with
# `,` columns and `+` rows.
## review = "planner,codex+vim"
## debug = "pi,htop+term"

[autoping]
# Scheduled window-priming pings. Each entry fires a lowest-effort `<kind>-ping`
# turn at a chosen time, so the provider's sliding budget window starts on your
# schedule instead of whenever you first sit down. Per-machine and outside the
# trust hash; the only thing an entry runs is the rimz-owned `autoping run`.
# Edit entries here or with `rimz autoping add`, then apply them to this box's OS
# scheduler with `rimz autoping install`.
## [autoping.schedules.morning]
## kind = "claude"                      # agent kind to prime (must support a ping turn)
## root = "/home/you/code/app"          # absolute project root whose room hosts the ping
## at = "07:00"                         # 24h local wall-clock firing time
## days = "weekdays"                    # "daily", "weekdays", "weekends", or "mon,wed,fri"
## worktree = "main"                    # optional channel to host the transient ping pane
## # cron = "0 7 * * 1-5"               # raw cron escape hatch (cron backend only; replaces at/days)

[remote_control]
# claude = false                       # auto-launch `claude remote-control` in the managed daemon tab
# codex = false                        # ensure the per-user Codex remote-control daemon on start

[accounts]
# oauth_usage = true                   # enable local OAuth account-usage enrichment when available

[accounts.usage_limit_usd]
# Display-only monthly USD ceilings for the extra/API usage bar. These are not
# provider-enforced spending limits; they only scale the dashboard bar when the
# provider does not report a cap. Unset means infinite/uncapped display.
## claude = 50.0
## codex = 25.0

[notifications]
# enabled = true
# triggers = ["waiting", "failed", "paused", "success"]
# desktop = "auto"                    # "auto", "osc", or "off"
# sound = "bell"                      # "bell" or "off"
# suppress_focused = true
# debounce_ms = 5000
# coalesce_ms = 1000
# remind_secs = 60                   # seconds between local unread reminders; 0 disables reminders
## command = "ntfy publish rimz"       # optional shell command; receives RIMZ_NOTIFY_* environment variables

[sidebar]
## style = "modern"                   # headline preset: "modern" (truecolor + Nerd Font) or "default" (auto color + Unicode); theme.mode / glyphs.set override it
# refresh_ms = 100                    # render/animation grid; clamped internally
# max_provider_blocks = 3             # cap discovered provider blocks when provider_list is empty
# provider_tabs = "auto"              # "auto", "always", or "never"
# provider_list = []                  # explicit provider order; include "all" to expand remaining providers
# max_cols = 72                       # creation-time cap for sidebar pane width
# scrollbar = "auto"                  # "auto", "always", or "never"
# glow = "auto"                       # transition flashes: "auto", "always", or "never"
# card_density = "auto"               # "auto", "expanded", or "compact"
# focus_key = "Alt+p"                 # global chord to focus the sidebar (toggle); "" or "off" to disable
## trunk = "develop"                  # optional preferred branch for worktree comparison stats

[sidebar.context]
# green = { percent = 40, tokens = 100000 }
# yellow = { percent = 60, tokens = 160000 }
# amber = { percent = 75, tokens = 258000 }
# red = { percent = 90, tokens = 420000 }

[sidebar.budget]
# yellow = 50                         # remaining percent where the draining bar reaches warn (gold)
# amber = 25                          # remaining percent where the bar reaches caution (amber)
# red = 10                            # remaining percent where the bar reaches alarm (red)

[sidebar.budget.pace]
# yellow = 100                        # pace percent where the reset marker leaves the soft tier for warn
# amber = 150                         # pace percent where the marker reaches caution (amber)
# red = 200                           # pace percent where the marker reaches alarm (red)

[sidebar.attention]
# stalled_after_secs = 1800           # silent running agent becomes actionable after this many seconds
# inactive_after_secs = 3600          # a card idle this many seconds sinks below live work (the prompt-cache window)

[sidebar.pets]
# enabled = false                     # opt-in animated companion tab in the provider dashboard
# pet = "codex"                       # built-in id (codex, dewey, ...), an https:// URL, a petdex pet name (~/.codex/pets/<name>), or a path to your own .webp sheet
# size = "medium"                     # "medium" keeps the original pet footprint; "small" fits the active provider block
# glyphs = "auto"                     # "auto", "half", "sextant", or "octant"
# voice = true                        # canned captions on fleet-status changes

[sidebar.theme]
# Palette depth and scheme are optional. mode = "auto" uses truecolor when COLORTERM advertises it, otherwise 256. Unset scheme uses the bundled TokyoNight Night theme; set a bundled Alacritty theme name (rimz list-themes) or a path to an Alacritty TOML file.
# Slot overrides accept either 256-color indexes or "#rrggbb"; omitted slots use the selected scheme. The bundled catalog lives under crates/rimz/themes/alacritty.
## mode = "auto"
## scheme = "TokyoNight Night"
## scheme = "Catppuccin Mocha"
## good = "#96c293"
## warn = "#dfb66d"
## caution = "#e0915c"
## alarm = "#de6e6e"
## accent = "#72b3aa"
## cool = "#7fa8de"
## meta = "#b49be0"
## body = "#a6a19a"
## muted = "#767168"
## faint = "#45423d"
## rule = "#343230"
## selection = "#8ab3e0"
## selection_bg = "#2a2723"           # the selected card's background band; derived from the scheme's colors.selection.background, subdued toward the background

[sidebar.animations]
# Status-head animation roles are optional. Each role accepts frames, color,
# effect, and speed; omitted fields keep the built-in value. frames can be a
# string split per Unicode codepoint or an array for multi-codepoint glyphs;
# every frame must occupy exactly one terminal cell.
# Colors are palette slots ("good", "warn", "caution", "alarm", "accent", "cool",
# "meta", "body", "muted", "faint"), "clay", a "#rrggbb" hex color, or a 0-255 color index.
# effect is "static" or "breathe"; speed is "slow", "normal", or "fast" for both frame advance and effect cadence.
# Every role follows the same frames/color/effect/speed model. Set a role's
# effect to "static" to quiet the unread attention signal for that role; it
# then holds a constant bold tone instead.
# A literal blink is a frame sequence such as [" ", "!"].
# unread picks how an unread attention row reads, shared by the lead glyph, the
# card name, the description, and the make-up buckets: "shimmer" (default) flows
# a light beam across each one, "bright" holds a constant brighter bold, and
# "blink" is the hard 2-pole brightness toggle, age-paced.
## unread = "shimmer"
## [sidebar.animations.thinking]
## frames = "⠁⠂⠄⡀⡈⡐⡠⣀⣁⣂⣄⣌⣔⣤⣥⣦⣮⣶⣷⣿⡿⠿⢟⠟⡛⠛⠫⢋⠋⠍⡉⠉⠑⠡⢁"
## color = "clay"
## effect = "static"
## speed = "fast"
## [sidebar.animations.working]
## frames = "⣾⣽⣻⢿⡿⣟⣯⣷"
## color = "clay"
## effect = "static"
## speed = "fast"
## [sidebar.animations.compacting]
## frames = "▁▃▄▅▆▇▆▅▄▃"
## color = "meta"
## effect = "static"
## speed = "fast"
## [sidebar.animations.delegating]
## frames = "⢄⢂⢁⡁⡈⡐⡠"
## color = "clay"
## effect = "static"
## speed = "fast"
## [sidebar.animations.resolving]
## frames = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏"
## color = "meta"
## effect = "static"
## speed = "fast"
## [sidebar.animations.idle]
## frames = "○"
## color = "good"
## effect = "static"
## speed = "normal"
## [sidebar.animations.success]
## frames = "✓"
## color = "good"
## effect = "static"
## speed = "normal"
## [sidebar.animations.paused]
## frames = ["⏸︎"]
## color = "caution"
## [sidebar.animations.waiting]
## frames = "?"
## color = "warn"
## [sidebar.animations.failed]
## frames = "!"
## color = "alarm"

[sidebar.glyphs]
# Glyphs are display-only and grouped the way the sidebar reads on screen.
# Paste a different glyph over any value below to swap it; it takes effect on
# the next render. Every glyph must occupy exactly one terminal cell.
#
# set is the fallback for any glyph you delete: "unicode" (default) is the shape
# shown below, "nerd-font" swaps in Nerd Font icons, and a path loads a custom
# glyph TOML. A custom file may pick its own "unicode"/"nerd-font" base; the keys
# in this file win last.
## set = "nerd-font"
## set = "~/.config/rimz/glyphs.toml"

# status — the leading cell of every agent row (the cockpit make-up line). The
# shape lives here; its color and motion live in [sidebar.animations.<role>].
# Note: status.attention is the animation role "failed", status.done is "success".
[sidebar.glyphs.status]
waiting = "?"
attention = "!"
paused = "⏸︎"
done = "✓"
idle = "○"
working = "⢿"
thinking = "⠁"
delegating = "⢄"
resolving = "⠙"
compacting = "▇"

# cockpit — the identity and summary row.
[sidebar.glyphs.cockpit]
workspace = "⌘"
sessions = "◎"
agents = "¤"

# tokens — the token-accounting markers across cards, fleet lines, and dashboard.
[sidebar.glyphs.tokens]
total = "◇"
input = "↘"
output = "↗"
cache_read = "◌"
cache_write = "◍"
filled = "▤"
compaction = "↻"

# worktree — the group header's git story.
[sidebar.glyphs.worktree]
branch = "⑂"
ahead = "⇡"
behind = "⇣"
trunk_equal = "≡"
trunk_clear = "✓"
dotted = "┄"

# card — the agent card body.
[sidebar.glyphs.card]
subagents = "⧉"
todo_done = "●"
todo_pending = "○"
parked_bg = "⋯"

# process — the process-row resource grid.
[sidebar.glyphs.process]
cpu = "C"
mem = "M"
io = "⇅"

# chrome — framing and badges. remote_link and infinity carry icons in the
# Nerd Font preset; alert, remote_control, the hairline, tab caps, and selection
# spines stay their Unicode / box-drawing shape (no single-cell Nerd Font tile).
## [sidebar.glyphs.chrome]
## alert = "⚠"
## remote_link = "⇄"
## remote_control = "⇅"
## infinity = "∞"

# meter — the context tiles and the reset marker carry icons in the Nerd Font
# preset; the context/scroll/mana bars keep their box-drawing shape in every
# preset. The age clock fills the clock faces by elapsed time — quarter steps in
# Unicode, eighth steps across the circle-slice series in nerd-font.
## [sidebar.glyphs.meter]
## context_full = "▣"
## reset = "↻"
## [sidebar.glyphs.clock]
## over = "◉"

[sidebar.providers]
# Provider styles are keyed by agent kind and every field is optional.
## [sidebar.providers.claude]
## product_name = "Claude Code"
## color = "#d97757"
## ascii_art = "CLAUDE"

[zellij]
# default_mode is always "locked" so ordinary typing reaches the focused agent
# pane (Rimz invariant; enter a Zellij mode deliberately for multiplexer keys).
# Critical room invariants Rimz always applies:
mouse_click_through = true       # single click on a card jumps to the agent (Zellij >= 0.44.0)
focus_follows_mouse = false      # required for the first click to pass through
session_serialization = false    # Rimz owns rebirth instead of Zellij resurrection
auto_layout = true               # Rimz's sidebar/compact-bar-pinning swap layout

# Optional: uncomment to override your ~/.config/zellij/config.kdl. Left unset,
# Rimz leaves these to your Zellij config or Zellij's defaults.
## pane_frames = true
## mouse_mode = true
## advanced_mouse_actions = true
## mouse_hover_effects = false
## on_force_close = "detach"           # "detach" or "quit"
## scroll_buffer_size = 100000
## show_startup_tips = false
## show_release_notes = false
## copy_clipboard = "system"           # "system" or "primary"
## copy_on_select = true
## support_kitty_keyboard_protocol = true
## osc8_hyperlinks = true

[tmux]
# mouse = true
# focus_events = true
# history_limit = 100000
# allow_passthrough = true
# set_clipboard = "on"                # "on", "external", or "off"
# extended_keys = true
# extended_keys_format = "csi-u"      # "csi-u" or "xterm"
# escape_time_ms = 0
# renumber_windows = true
# aggressive_resize = true
# pane_border_status = "off"          # "off", "top", or "bottom"
# pane_border_lines = "simple"        # "simple", "single", "double", or "heavy"

[resume]
# on_rebirth = true                   # re-seed prior agents when a room is reborn
# max = 8                             # cap auto-resumed agents per rebirth
# auto_continue = false               # resume a rate-limit-parked agent when its 5h/7d window resets
# auto_continue_overloaded = false    # resume an overload-parked agent on the retry backoff below
# auto_continue_overloaded_backoff_secs = [60, 120, 180] # retry ramp; the last value repeats
# auto_continue_overloaded_max_retries = 10 # stop attempting after this many overload retries
# auto_continue_text = "continue"     # the nudge typed into the parked pane on resume

[sentry]
# Off-box error reporting. With no DSN, Sentry stays off and Rimz makes no
# network calls. When set, Rimz warn/error events and observed agent
# rate-limit/overload conditions report to this project (machine name and PII
# withheld). RIMZ_SENTRY_DSN / RIMZ_SENTRY_ENVIRONMENT override these.
## dsn = "https://examplePublicKey@o0.ingest.sentry.io/0"
## environment = "production"         # deployment tag attached to every event
