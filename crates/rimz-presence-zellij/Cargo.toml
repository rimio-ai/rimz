[package]
name = "rimz-presence-zellij"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The Zellij presence plugin: a headless wasm32-wasip1 plugin loaded by rimz
# into every Zellij session it manages, poking `rimz sidebar wake` on pane
# topology/focus changes and correcting switched-to tabs whose focus restored
# to the sidebar. The lib (rlib) holds the host-tested decision engine
# (`engine.rs`), pure policy helpers (`policy.rs`), and host-boundary wire seam
# (`wire.rs`) inside the ordinary workspace test run; the bin is the Zellij
# plugin entrypoint
# (`register_plugin!` defines `main`), built for wasm by
# `cargo xtask build-plugin`, vendored into `crates/rimz/presence/` by
# `cargo xtask plugin-refresh` for crates.io installs, and a stub on host targets
# so `--workspace` builds and lints stay green without the wasm toolchain.
[lib]
path = "src/lib.rs"

[[bin]]
name = "rimz-presence-zellij"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

# The official Zellij plugin API, wasm-only: its shims call extern host
# functions that exist only inside Zellij's plugin host, so host targets must
# not link it. Pinned to the 0.44 line so one vendored artifact loads across
# RimZ's supported Zellij hosts. The host-side `MIN_ZELLIJ_VERSION` gate in
# `capabilities()` rejects older versions before room startup.
[target.'cfg(target_family = "wasm")'.dependencies]
zellij-tile = "0.45"
